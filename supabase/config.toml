# RegAnchor Edge Function JWT gateway flags.
# GitHub Pages merge does NOT deploy functions — deploy explicitly after merge.

[functions.send-mail]
# Public contact / demo / enterprise / diagnostic forms have no user JWT.
# Kind-specific auth runs inside the function (portal-alert, admin-reply).
verify_jwt = false

[functions.link-diagnostic]
# Requires signed-in user; body user_id is ignored (JWT sub).
verify_jwt = true

[functions.link-subscription]
# Requires signed-in user; body user_id is ignored (JWT sub).
verify_jwt = true

[functions.get-buy-context]
verify_jwt = false

[functions.create-billing-portal-session]
# Validates JWT inside the function (org owner/admin).
verify_jwt = false

[functions.get-billing-overview]
verify_jwt = false

[functions.stripe-webhook]
# Stripe signature verified inside the function.
verify_jwt = false

[functions.subscription-webhook]
# Stripe signature verified inside the function.
verify_jwt = false

[functions.create-checkout-session]
# Guest diagnostic purchase (buy-report / results) has no user JWT — anon key only.
# Function validates result_id against diagnostic_results before calling Stripe.
verify_jwt = false

[functions.create-subscription-session]
# guest=true public; signed-in path checks JWT inside.
verify_jwt = false

[functions.checkout-session-info]
# Post-pay signup; session_id is the capability.
verify_jwt = false

[functions.generate-report]
# Gateway JWT required — do NOT deploy with --no-verify-jwt.
verify_jwt = true

[functions.provider-connect]
verify_jwt = true

[functions.provider-test]
verify_jwt = true

[functions.provider-revoke]
verify_jwt = true

[functions.provider-insights]
verify_jwt = true

[functions.provider-insights-sync]
# Accepts a dedicated cron/service secret or validates an org-admin JWT in-function.
verify_jwt = false

[functions.org-provider-connect]
verify_jwt = true

[functions.org-provider-test]
verify_jwt = true

[functions.org-provider-revoke]
verify_jwt = true

[functions.asset-gateway-token]
# Signed-in organisation owner/admin; authorization is checked in-function.
verify_jwt = true

[functions.gateway-anthropic]
# Authenticates a RegAnchor asset gateway capability, not a Supabase JWT.
verify_jwt = false

[functions.mcp-auth]
# Device start/token are public; approve validates the portal user JWT in-function.
verify_jwt = false

[functions.mcp-oauth]
# OAuth AS + DCR + token; consent validates portal user JWT in-function.
verify_jwt = false

[functions.mcp]
# Authenticates RegAnchor MCP access tokens (ra_mcp_at_…), not Supabase JWTs.
verify_jwt = false

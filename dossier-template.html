<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RegAnchor · AI Governance Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AI Governance Dossier — RegAnchor app typography (Inter)
   Dense enterprise record. No marketing chrome.
   ============================================================ */

:root {
  --ink: #111827;
  --text-2: #4B5563;
  --text-3: #6B7280;
  --line: #E5E7EB;
  --line-strong: #111827;
  --wash: #F9FAFB;
  --accent: #533AFD;
  --ok: #047857;
  --warn: #B45309;
  --risk: #BE123C;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --t-display: 22pt;
  --t-h1: 13pt;
  --t-body: 9pt;
  --t-small: 8pt;
  --t-micro: 7.5pt;
  --t-num: 20pt;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 10pt;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

body {
  font-family: var(--font);
  font-weight: 400;
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.45;
  background: #fff;
  -webkit-font-smoothing: antialiased;
}

.section { page-break-before: always; }
.keep { page-break-inside: avoid; }

.sec-bar {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 0 0 8px;
  margin: 0 0 4px;
  border-bottom: 1px solid var(--line-strong);
}
.sec-bar-num {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: .06em;
  min-width: 1.4em;
}
.sec-bar-title {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--ink);
  letter-spacing: .05em;
  text-transform: uppercase;
  flex: 1;
}

.sec-title {
  font-family: var(--font);
  font-size: var(--t-h1);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
  margin: 14px 0 6px;
}
.sec-intro {
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.5;
  max-width: 68ch;
  margin: 0 0 16px;
}

.sub-label {
  display: block;
  font-size: var(--t-micro);
  font-weight: 500;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 18px 0 8px;
}

/* Cover */
.cover {
  page-break-after: always;
  min-height: 252mm;
  display: flex;
  flex-direction: column;
}
.cover-top { flex: 1; padding-top: 2mm; }
.brand-wordmark {
  display: block;
  width: 128px;
  height: auto;
  margin-bottom: 32px;
}
.cov-doctype {
  font-size: var(--t-micro);
  font-weight: 500;
  letter-spacing: .08em;
  color: var(--text-3);
  margin-bottom: 10px;
  text-transform: uppercase;
}
.cov-title {
  font-size: var(--t-display);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.2;
  letter-spacing: -.02em;
  margin-bottom: 8px;
}
.cov-org {
  font-size: 12pt;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
}
.cov-meta {
  font-size: var(--t-small);
  color: var(--text-3);
  margin-bottom: 28px;
}
.cov-blurb {
  font-size: var(--t-body);
  color: var(--text-2);
  max-width: 56ch;
  line-height: 1.55;
  margin-bottom: 28px;
}
.cov-kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.cov-kpi {
  padding: 12px 10px 12px 0;
  border-right: 1px solid var(--line);
}
.cov-kpi:last-child { border-right: none; padding-right: 0; }
.cov-score-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.cov-score-line .cov-kpi-val { font-size: 18pt; }
.cov-score-line .cov-kpi-sub { margin-top: 0; font-size: var(--t-small); color: var(--ink); font-weight: 500; }
.cov-kpi-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 4px;
}
.cov-kpi-val {
  font-size: 14pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.cov-kpi-sub {
  font-size: var(--t-micro);
  color: var(--text-3);
  margin-top: 2px;
}
.cover-foot {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: var(--t-small);
  color: var(--text-3);
}
.cover-foot strong { color: var(--ink); font-weight: 500; }

/* Score block */
.score-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 20px;
  align-items: center;
  margin: 8px 0 18px;
}
.score-ring {
  position: relative;
  width: 108px;
  height: 108px;
}
.score-ring svg { display: block; width: 108px; height: 108px; }
.score-ring-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-num {
  font-size: var(--t-num);
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.score-of { font-size: var(--t-micro); color: var(--text-3); margin-top: 2px; }
.score-posture {
  font-size: 11pt;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 4px;
}
.score-note {
  font-size: var(--t-small);
  color: var(--text-3);
  max-width: 48ch;
  line-height: 1.45;
}
.layer-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 0 18px;
}
.layer {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.layer-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.layer-val {
  font-size: 14pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 0 0 18px;
}
.stat {
  padding: 10px 12px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.stat:nth-child(3n) { border-right: none; }
.stat:nth-last-child(-n+3) { border-bottom: none; }
.stat-lbl {
  display: block;
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 2px;
}
.stat-val {
  font-size: 13pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stat-sub {
  font-size: var(--t-micro);
  color: var(--text-3);
  margin-top: 1px;
}

.obs-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.obs-list li {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-body);
  color: var(--ink);
  line-height: 1.45;
}
.obs-list li:last-child { border-bottom: none; }
.obs-list li::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 1px;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
}

/* TOC */
.toc { list-style: none; margin: 8px 0 0; padding: 0; }
.toc li {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-body);
  color: var(--ink);
}
.toc-num {
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  min-width: 1.6em;
}
.toc-title { flex: 1; font-weight: 500; }

/* Tables */
table.data {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 14px;
  font-size: var(--t-small);
}
table.data th {
  text-align: left;
  font-weight: 500;
  color: var(--text-3);
  font-size: var(--t-micro);
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 6px 8px 6px 0;
  border-bottom: 1px solid var(--line-strong);
  vertical-align: bottom;
}
table.data td {
  padding: 7px 8px 7px 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  vertical-align: top;
  line-height: 1.35;
}
table.data td.muted { color: var(--text-3); }
table.data .num { font-variant-numeric: tabular-nums; }

.status {
  font-weight: 500;
  font-size: var(--t-small);
}
.status.s-ok { color: var(--ok); }
.status.s-warn { color: var(--warn); }
.status.s-risk { color: var(--risk); }
.status.s-muted, .status.s-info { color: var(--text-3); }

.ev-stack { display: flex; flex-direction: column; gap: 3px; }
.ev-label {
  font-size: 6.5pt;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.ev-item { font-size: var(--t-small); color: var(--ink); line-height: 1.3; }
.ev-item.quiet { color: var(--text-3); }

/* Control detail cards */
.ctrl-block {
  border-top: 1px solid var(--line);
  padding: 12px 0;
  page-break-inside: avoid;
}
.ctrl-block:first-of-type { border-top: none; }
.ctrl-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}
.ctrl-code {
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  font-size: var(--t-small);
}
.ctrl-name {
  font-weight: 500;
  color: var(--ink);
  font-size: var(--t-body);
  flex: 1;
}
.ctrl-meta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px 14px;
  margin: 8px 0;
  font-size: var(--t-small);
}
.ctrl-meta dt {
  font-size: 6.5pt;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 1px;
}
.ctrl-meta dd { color: var(--ink); font-weight: 400; }
.ctrl-body {
  font-size: var(--t-small);
  color: var(--text-2);
  line-height: 1.45;
  margin: 4px 0 8px;
  max-width: 72ch;
}
.ctrl-ev {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 6px;
}
.ctrl-ev-box {
  background: var(--wash);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.ctrl-ev-box ul {
  margin: 4px 0 0;
  padding-left: 14px;
  color: var(--ink);
  font-size: var(--t-small);
}
.ctrl-ev-box li { margin-bottom: 2px; }

.kv {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 4px 12px;
  margin: 0 0 14px;
  font-size: var(--t-body);
}
.kv dt { color: var(--text-3); font-weight: 500; }
.kv dd { color: var(--ink); }

.empty {
  padding: 14px 0;
  color: var(--text-3);
  font-size: var(--t-body);
  border-top: 1px solid var(--line);
}

.attest {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin: 12px 0;
}
.attest p {
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.5;
  margin-bottom: 8px;
}
.attest p:last-child { margin-bottom: 0; }
.attest strong { color: var(--ink); font-weight: 500; }

.sign-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 20px;
}
.sign-box {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  min-height: 56px;
}
.sign-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.sign-val {
  margin-top: 18px;
  font-size: var(--t-body);
  color: var(--ink);
  font-weight: 500;
}

@media print {
  .section { page-break-before: always; }
  .cover { page-break-after: always; }
  thead { display: table-header-group; }
  tfoot { display: table-footer-group; }
  tr, .ctrl-block, .layer, .stat, .obs-list li, .attest, .sign-box {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  table.data { page-break-inside: auto; }
  h2, .sec-bar, .sub-label {
    page-break-after: avoid;
    break-after: avoid;
  }
  p, li { orphans: 3; widows: 3; }
}
</style>
</head>

<div id="dossier"></div>
<script>
/*__DOSSIER_DATA__*/

const PROVIDER_LABELS = {
  anthropic: 'Anthropic',
  openai: 'OpenAI',
  bedrock: 'AWS Bedrock',
  aws: 'AWS',
  google: 'Google',
  googlecloud: 'Google Cloud',
  gemini: 'Gemini',
  azure: 'Microsoft Foundry',
  azureai: 'Microsoft Foundry',
  microsoft: 'Microsoft',
  meta: 'Meta',
  huggingface: 'Hugging Face',
  groq: 'Groq',
  cohere: 'Cohere',
  cursor: 'Cursor',
  in_house: 'In-house',
  other: 'Other',
};

const CTRL_STATUS = {
  not_started: 'Not Started',
  in_progress: 'In Progress',
  implemented: 'Implemented',
  verified: 'Verified',
  overdue: 'Overdue',
};

const ASSESS_STATUS = {
  submitted: 'Awaiting review',
  in_review: 'Under review',
  controls_issued: 'Controls assigned',
};

const TIER = {
  none: 'Unclassified',
  unclassified: 'Unclassified',
  minimal: 'Minimal',
  limited: 'Limited',
  high: 'High',
  unacceptable: 'Unacceptable',
};

const LIFECYCLE = {
  planned: 'Planned',
  development: 'Development',
  pilot: 'Pilot',
  production: 'Production',
  decommissioned: 'Decommissioned',
};

const ACTIVITY_LABELS = {
  system_created: 'AI asset created',
  system_updated: 'AI asset updated',
  risk_tier_changed: 'Risk classification changed',
  control_assigned: 'Control assigned',
  control_updated: 'Control updated',
  control_implemented: 'Control implemented',
  assessment_submitted: 'Assessment submitted',
  assessment_requested: 'Assessment requested',
  policy_adopted: 'Policy adopted',
  policy_acknowledged: 'Policy acknowledged',
  policy_esigned: 'Policy signed',
  compliance_status_updated: 'Obligation status updated',
};

function x(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function labelProvider(slug, fallback) {
  const s = String(slug || '').trim().toLowerCase();
  if (!s) return (fallback || '').trim() || 'Not set';
  return PROVIDER_LABELS[s] || (fallback || '').trim() || slug;
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return '—'; }
}

function fmtShort(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return '—'; }
}

function controlCode(n) {
  if (n == null || n === '') return '—';
  return 'C' + String(n).replace(/^c/i, '');
}

function ctrlStatus(s) {
  const k = String(s || '').toLowerCase();
  return CTRL_STATUS[k] || pretty(s) || 'Not Started';
}

function assessStatus(s) {
  const k = String(s || '').toLowerCase();
  return ASSESS_STATUS[k] || pretty(s) || '—';
}

function tierLabel(t) {
  const k = String(t || '').toLowerCase();
  return TIER[k] || (t ? pretty(t) : 'Unclassified');
}

function lifeLabel(l) {
  const k = String(l || '').toLowerCase();
  return LIFECYCLE[k] || pretty(l) || '—';
}

function purposeLabel(p) {
  if (!p) return '—';
  return String(p).replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
}

function pretty(s) {
  const t = String(s || '').replace(/_/g, ' ').trim();
  if (!t) return '';
  return t.split(/\s+/).map((w) => {
    if (/^ai$/i.test(w)) return 'AI';
    if (/^id$/i.test(w)) return 'ID';
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}

function statusClass(s) {
  const t = String(s || '').toLowerCase();
  if (['implemented', 'verified', 'active', 'controls_issued', 'minimal', 'production', 'met', 'compliant'].includes(t)) return 's-ok';
  if (['in_progress', 'in_review', 'submitted', 'limited', 'partial', 'development', 'pilot'].includes(t)) return 's-warn';
  if (['not_started', 'high', 'unacceptable', 'overdue', 'failed', 'not_met'].includes(t)) return 's-risk';
  return 's-muted';
}

function donut(score) {
  const s = Math.max(0, Math.min(100, Number(score) || 0));
  const r = 46;
  const c = 2 * Math.PI * r;
  const dash = (s / 100) * c;
  return `<svg viewBox="0 0 108 108" aria-hidden="true">
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="7"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="#533AFD" stroke-width="7"
      stroke-linecap="butt" stroke-dasharray="${dash} ${c}"
      transform="rotate(-90 54 54)"/>
  </svg>`;
}

function wordmarkLogo() {
  return `<svg class="brand-wordmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 389 72.75" role="img" aria-label="RegAnchor">
    <g fill="#000000">

      <path d="M13.14,39h-.14v17H0V2h15.19c12.2,0,23.81,3.98,23.81,18.31,0,7.96-5.33,13.25-12.12,16l14.31,19.69h-15.94l-12.11-17ZM13,14v15h3.32c5.7,0,9.66-2.88,9.66-7.93,0-4.69-3.39-7.07-9.81-7.07h-3.17Z"/>
      <path d="M64.77,57.51c-15.7,0-25.13-9.58-25.13-22.68s9.43-22.68,22.97-22.68c12.75,0,22.39,9.58,22.39,22.75v3.1h-32.69c1.01,6.48,5.33,9.94,12.6,9.94,5.9,0,9.94-2.02,13.1-4.82l6.7,7.13c-4.54,4.1-10.87,7.27-19.95,7.27ZM52.09,30h19.59c-1.3-5.11-4.68-8.14-9.79-8.14s-8.5,3.02-9.79,8.14Z"/>

function secBar(num, title) {
  return `<div class="sec-bar">
    <span class="sec-bar-num">${x(num)}</span>
    <span class="sec-bar-title">${x(title)}</span>
  </div>`;
}

function empty(msg) {
  return `<div class="empty">${x(msg)}</div>`;
}

function evCell(ctrl) {
  const suggested = ctrl.suggested_evidence || [];
  const provided = ctrl.evidence_provided || [];
  const sug = suggested.length
    ? suggested.slice(0, 4).map((s) => `<div class="ev-item quiet">${x(displayEvidenceType(s))}</div>`).join('') +
      (suggested.length > 4 ? `<div class="ev-item quiet">+${suggested.length - 4} more</div>` : '')
    : `<div class="ev-item quiet">None recorded</div>`;
  const prov = provided.length
    ? provided.slice(0, 4).map((e) => `<div class="ev-item">${x(e.file_name)}</div>`).join('') +
      (provided.length > 4 ? `<div class="ev-item">+${provided.length - 4} more</div>` : '')
    : `<div class="ev-item quiet">None uploaded</div>`;
  return `<div class="ev-stack">
    <span class="ev-label">Suggested</span>${sug}
    <span class="ev-label" style="margin-top:4px">Provided</span>${prov}
  </div>`;
}

function governanceBasisCell(ctrl) {
  const mapped = ctrl.mapped_requirements || [];
  if (mapped.length) {
    return mapped.map((m) => {
      const fw = m.framework_name ? `${m.framework_name}` : '';
      const art = m.article_reference ? m.article_reference : '';
      const title = m.requirement_title || '';
      const head = [fw, art].filter(Boolean).join(' · ');
      const line = head && title ? `${head}: ${title}` : head || title || 'Mapped requirement';
      return `<div>${x(line)}${m.is_primary ? ' <span class="muted">(primary)</span>' : ''}</div>`;
    }).join('');
  }
  if (ctrl.is_org_level) return `<span class="muted">Internal governance requirement</span>`;
  return `<span class="muted">No external requirement currently mapped</span>`;
}

function displayControlTitle(title) {
  return String(title || 'Control')
    .replace(/\bAI System Risk Classification\b/gi, 'AI Asset Risk Classification')
    .replace(/\bAI system inventory\b/gi, 'AI asset inventory')
    .replace(/\bAI System Inventory\b/g, 'AI Asset Inventory');
}

function displayEvidenceType(label) {
  return String(label || '')
    .replace(/\bAI system classification report\b/gi, 'AI asset classification record')
    .replace(/\bAI system inventory export\b/gi, 'AI asset inventory export')
    .replace(/\bAI system\b/gi, 'AI asset');
}

  const evRows = evidence.slice(0, 80).map((e) => `<tr>
    <td>${x(e.file_name)}</td>
    <td>${e.control_title ? x(controlCode(e.control_number) + ' · ' + e.control_title) : '—'}</td>

    <td><span class="status ${statusClass(e.control_status)}">${e.control_status ? x(ctrlStatus(e.control_status)) : '—'}</span></td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('08', 'Evidence index')}
    <h2 class="sec-title">Uploaded evidence</h2>
    <p class="sec-intro">Files uploaded in RegAnchor and their linked control assignment or AI asset, where that relationship exists.</p>

      </tr></thead><tbody>${evRows}</tbody></table>`
      : empty('No evidence files uploaded.')}
  </section>`;

  /* ── 09 Activity ── */
  const actRows = activity.slice(0, 50).map((a) => `<tr>
    <td class="num muted">${x(fmtShort(a.created_at))}</td>
    <td>${x(ACTIVITY_LABELS[a.action] || pretty(a.action))}</td>

    <td class="muted">${x(a.entity_label || '—')}</td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('09', 'Activity trail')}
    <h2 class="sec-title">Recent governance activity</h2>
    <p class="sec-intro">Selected governance events from the RegAnchor audit log for this organisation.</p>

  </section>`;

  /* ── 10 Attestation ── */
  html += `<section class="section">
    ${secBar('10', 'Attestation & notice')}
    <h2 class="sec-title">Attestation</h2>
    <div class="attest">
      <p>This AI Governance Dossier is a <strong>point-in-time export</strong> of data held in RegAnchor for <strong>${x(orgName)}</strong> as at <strong>${x(fmtDate(generatedAt))}</strong>.</p>

    </div>

      <div class="sign-box">
        <div class="sign-lbl">Organisation reviewer</div>
        <div class="sign-val">Name / role / date</div>
      </div>
      <div class="sign-box">

      </div>
    </div>
  </section>`;

  root.innerHTML = html;
  document.title = `RegAnchor · AI Governance Dossier · ${orgName}`;
}

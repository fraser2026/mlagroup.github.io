<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RegAnchor · AI Governance Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AI Governance Dossier — premium board / procurement record
   Inter only. Sentence case. Status on the word. No Anchor Line.
   ============================================================ */

:root {
  --ink: #0A0E14;
  --text-2: #425466;
  --text-3: #697386;
  --line: #E6EBF1;
  --line-strong: #0A0E14;
  --wash: #F6F9FC;
  --accent: #533AFD;
  --ok: #0F766E;
  --risk: #C8102E;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --t-hero: 26pt;
  --t-display: 15pt;
  --t-h1: 13pt;
  --t-body: 9.5pt;
  --t-small: 8.5pt;
  --t-micro: 8pt;
  --t-num: 22pt;
  --radius: 4px;
  --page-pad-x: 0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 10pt;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

body {
  font-family: var(--font);
  font-weight: 400;
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.5;
  background: #fff;
  text-transform: none;
  -webkit-font-smoothing: antialiased;
}

.section { page-break-before: always; }
.keep { page-break-inside: avoid; }

/* Section chrome — sentence case */
.sec-bar {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 0 0 10px;
  margin: 0 0 18px;
  border-bottom: 1px solid var(--line);
}
.sec-bar-num {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  min-width: 1.6em;
}
.sec-bar-title {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--ink);
  flex: 1;
}

.sec-title {
  font-size: var(--t-h1);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin: 0 0 8px;
}
.sec-intro {
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.55;
  max-width: 62ch;
  margin: 0 0 20px;
}

.sub-label {
  display: block;
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin: 22px 0 10px;
}

/* Cover */
.cover {
  page-break-after: always;
  min-height: 252mm;
  display: flex;
  flex-direction: column;
}
.cover-top { flex: 1; padding-top: 4mm; }
.brand-wordmark {
  display: block;
  width: 152px;
  height: auto;
  overflow: visible;
  margin-bottom: 40px;
}
.cov-doctype {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 14px;
}
.cov-org {
  font-size: var(--t-hero);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.15;
  letter-spacing: -0.03em;
  margin-bottom: 10px;
}
.cov-export {
  font-size: var(--t-small);
  color: var(--text-3);
  margin-bottom: 4px;
}
.cov-id {
  font-size: var(--t-small);
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin-bottom: 28px;
}
.cov-blurb {
  font-size: var(--t-body);
  color: var(--text-2);
  max-width: 54ch;
  line-height: 1.6;
  margin-bottom: 32px;
}

.cov-score {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.cov-score-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 4px;
}
.cov-score-val {
  font-size: 20pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.cov-score-posture {
  font-size: 11pt;
  font-weight: 500;
  color: var(--ink);
}

.cov-kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  margin-bottom: 24px;
}
.cov-kpi {
  padding: 4px 14px 4px 0;
  border-right: 1px solid var(--line);
}
.cov-kpi:last-child { border-right: none; padding-right: 0; }
.cov-kpi-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 4px;
}
.cov-kpi-val {
  font-size: 15pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}
.cov-kpi-sub {
  font-size: var(--t-micro);
  color: var(--text-3);
  margin-top: 3px;
}

.cov-ref {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 28px;
  padding: 14px 0 0;
  border-top: 1px solid var(--line);
  font-size: var(--t-micro);
}
.cov-ref dt { color: var(--text-3); font-weight: 500; }
.cov-ref dd { color: var(--ink); font-variant-numeric: tabular-nums; margin-bottom: 6px; }

.cover-foot {
  margin-top: auto;
  padding-top: 28px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 24px;
  font-size: var(--t-small);
  color: var(--text-3);
}
.cover-foot strong {
  display: block;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 4px;
}

/* Score / layers */
.score-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 24px;
  align-items: center;
  margin: 4px 0 22px;
}
.score-ring {
  position: relative;
  width: 108px;
  height: 108px;
}
.score-ring svg { display: block; width: 108px; height: 108px; }
.score-ring-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-num {
  font-size: var(--t-num);
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.score-of { font-size: var(--t-micro); color: var(--text-3); margin-top: 3px; }
.score-posture {
  font-size: 12pt;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
}
.score-note {
  font-size: var(--t-small);
  color: var(--text-3);
  max-width: 48ch;
  line-height: 1.5;
}

.layer-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 0 0 22px;
}
.layer {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.layer-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
}
.layer-val {
  font-size: 16pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}

.risk-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin: 0 0 22px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.risk-chip {
  font-size: var(--t-small);
  color: var(--text-2);
}
.risk-chip strong {
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin-right: 6px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  margin: 0 0 22px;
  border-top: 1px solid var(--line);
}
.stat {
  padding: 14px 14px 14px 0;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
.stat:nth-child(3n) { border-right: none; padding-right: 0; }
.stat-lbl {
  display: block;
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 4px;
}
.stat-val {
  font-size: 14pt;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stat-sub {
  font-size: var(--t-micro);
  color: var(--text-3);
  margin-top: 3px;
  line-height: 1.4;
}

.obs-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--line);
}
.obs-list li {
  padding: 11px 0 11px 14px;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-body);
  color: var(--ink);
  line-height: 1.5;
  position: relative;
}
.obs-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 17px;
  width: 5px;
  height: 5px;
  border-radius: 1px;
  background: var(--accent);
}

/* TOC */
.toc { list-style: none; margin: 4px 0 0; padding: 0; }
.toc li {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-body);
  color: var(--ink);
}
.toc-num {
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  min-width: 1.8em;
}
.toc-title { flex: 1; font-weight: 500; }

/* Tables */
table.data {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 16px;
  font-size: var(--t-small);
}
table.data th {
  text-align: left;
  font-weight: 500;
  color: var(--text-3);
  font-size: var(--t-micro);
  text-transform: none;
  letter-spacing: 0;
  padding: 8px 10px 8px 0;
  border-bottom: 1px solid var(--line-strong);
  vertical-align: bottom;
}
table.data td {
  padding: 9px 10px 9px 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  vertical-align: top;
  line-height: 1.4;
}
table.data td.muted { color: var(--text-3); }
table.data .num { font-variant-numeric: tabular-nums; }
table.data .asset-name { font-weight: 500; color: var(--ink); }
table.data .asset-sub {
  display: block;
  font-size: var(--t-micro);
  font-weight: 400;
  color: var(--text-3);
  margin-top: 2px;
}

.provider-cell {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.provider-ico {
  flex: none;
  display: block;
  width: 14px;
  height: 14px;
}
.provider-fallback {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  background: var(--wash);
  color: var(--text-3);
  font-size: 6pt;
  font-weight: 600;
  letter-spacing: 0;
}

.status {
  font-weight: 500;
  font-size: var(--t-small);
}
.status.s-ok { color: var(--ok); }
.status.s-risk { color: var(--risk); }
.status.s-muted, .status.s-info, .status.s-neutral { color: var(--text-3); }
.status.s-ink { color: var(--ink); }

.ev-summary { font-size: var(--t-small); color: var(--ink); }
.ev-summary.quiet { color: var(--text-3); }

.mix-stack {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: var(--t-micro);
  color: var(--text-3);
}

/* Control detail */
.ctrl-block {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  page-break-inside: avoid;
}
.ctrl-block:first-of-type { padding-top: 0; }
.ctrl-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 8px;
}
.ctrl-code {
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  font-size: var(--t-small);
}
.ctrl-name {
  font-weight: 500;
  color: var(--ink);
  font-size: var(--t-body);
  flex: 1;
}
.ctrl-meta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px 16px;
  margin: 12px 0;
  font-size: var(--t-small);
}
.ctrl-meta dt {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 2px;
}
.ctrl-meta dd { color: var(--ink); font-weight: 400; }
.ctrl-body {
  font-size: var(--t-small);
  color: var(--text-2);
  line-height: 1.5;
  margin: 4px 0 8px;
  max-width: 72ch;
}
.ctrl-ev {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.ctrl-ev-box {
  background: var(--wash);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.ctrl-ev-box .ev-label {
  display: block;
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  margin-bottom: 4px;
}
.ctrl-ev-box ul {
  margin: 0;
  padding-left: 14px;
  color: var(--ink);
  font-size: var(--t-small);
}
.ctrl-ev-box li { margin-bottom: 3px; }

.kv {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 6px 16px;
  margin: 0 0 18px;
  font-size: var(--t-body);
}
.kv dt { color: var(--text-3); font-weight: 500; }
.kv dd { color: var(--ink); }

.note-line {
  font-size: var(--t-small);
  color: var(--text-3);
  margin: 12px 0 0;
  line-height: 1.45;
}

.empty {
  padding: 16px 0;
  color: var(--text-3);
  font-size: var(--t-body);
  border-top: 1px solid var(--line);
}

.attest {
  padding: 4px 0 8px;
  margin: 4px 0 8px;
  border-top: 1px solid var(--line);
}
.attest p {
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.55;
  margin-bottom: 12px;
  max-width: 68ch;
}
.attest p:last-child { margin-bottom: 0; }
.attest strong { color: var(--ink); font-weight: 500; }

.sign-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 28px;
}
.sign-box {
  border-top: 1px solid var(--line-strong);
  padding-top: 12px;
  min-height: 72px;
}
.sign-lbl {
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
}
.sign-val {
  margin-top: 22px;
  font-size: var(--t-body);
  color: var(--ink);
  font-weight: 500;
}
.sign-meta {
  display: block;
  margin-top: 6px;
  font-weight: 400;
  font-size: var(--t-small);
  color: var(--text-3);
  line-height: 1.45;
}

@media print {
  .section { page-break-before: always; }
  .cover { page-break-after: always; }
  thead { display: table-header-group; }
  tr, .ctrl-block, .layer, .stat, .obs-list li, .attest, .sign-box {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  table.data { page-break-inside: auto; }
  h2, .sec-bar, .sub-label {
    page-break-after: avoid;
    break-after: avoid;
  }
  p, li { orphans: 3; widows: 3; }
}
</style>
</head>

const CTRL_STATUS = {
  not_started: 'Not started',
  in_progress: 'In progress',
  implemented: 'Implemented',
  verified: 'Verified',
  overdue: 'Overdue',
};

const ASSESS_STATUS = {
  submitted: 'Awaiting review',
  in_review: 'Under review',
  controls_issued: 'Controls assigned',
};

const TIER = {
  none: 'Unclassified',
  unclassified: 'Unclassified',
  minimal: 'Minimal',
  limited: 'Limited',
  high: 'High',
  unacceptable: 'Unacceptable',
};

const LIFECYCLE = {
  planned: 'Planned',
  development: 'Development',
  pilot: 'Pilot',
  production: 'Production',
  decommissioned: 'Decommissioned',
};

const ACTIVITY_LABELS = {
  system_created: 'AI asset created',
  system_updated: 'AI asset updated',
  risk_tier_changed: 'Risk classification changed',
  control_assigned: 'Control assigned',
  control_updated: 'Control updated',
  control_implemented: 'Control implemented',
  assessment_submitted: 'Assessment submitted',
  assessment_requested: 'Assessment requested',
  policy_adopted: 'Policy adopted',
  policy_acknowledged: 'Policy acknowledged',
  policy_esigned: 'Policy signed',
  compliance_status_updated: 'Obligation status updated',
};

function x(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function blank(v) {
  const s = String(v == null ? '' : v).trim();
  return s || 'Not recorded';
}

function labelProvider(slug, fallback) {
  const s = String(slug || '').trim().toLowerCase();
  if (!s) return (fallback || '').trim() || 'Not set';
  return PROVIDER_LABELS[s] || (fallback || '').trim() || slug;
}

function providerMark(slug, fallback) {
  const s = String(slug || '').trim().toLowerCase();
  const label = labelProvider(s, fallback);
  const icon = PROVIDER_ICONS[s];
  if (icon) {
    return `<span class="provider-cell"><svg class="provider-ico" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">${icon}</svg><span>${x(label)}</span></span>`;
  }
  const initials = label.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '—';
  return `<span class="provider-cell"><span class="provider-fallback">${x(initials)}</span><span>${x(label)}</span></span>`;
}

function fmtDate(iso) {
  if (!iso) return 'Not recorded';
  try {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return 'Not recorded'; }
}

function fmtShort(iso) {
  if (!iso) return 'Not recorded';
  try {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return 'Not recorded'; }
}

function controlCode(n) {
  if (n == null || n === '') return 'Not recorded';
  return 'C' + String(n).replace(/^c/i, '');
}

function ctrlStatus(s) {
  const k = String(s || '').toLowerCase();
  return CTRL_STATUS[k] || pretty(s) || 'Not started';
}

function assessStatus(s) {
  const k = String(s || '').toLowerCase();
  return ASSESS_STATUS[k] || pretty(s) || 'Not recorded';
}

function tierLabel(t) {
  const k = String(t || '').toLowerCase();
  return TIER[k] || (t ? pretty(t) : 'Unclassified');
}

function lifeLabel(l) {
  const k = String(l || '').toLowerCase();
  return LIFECYCLE[k] || pretty(l) || 'Not recorded';
}

function pretty(s) {
  const t = String(s || '').replace(/_/g, ' ').trim();
  if (!t) return '';
  return t.split(/\s+/).map((w) => {
    if (/^ai$/i.test(w)) return 'AI';
    if (/^id$/i.test(w)) return 'ID';
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}

/** Status colour on the word only. No amber/gold. */
function statusClass(s) {
  const t = String(s || '').toLowerCase();
  if (['implemented', 'verified', 'active', 'controls_issued', 'met', 'compliant', 'production'].includes(t)) return 's-ok';
  if (['not_started', 'high', 'unacceptable', 'overdue', 'failed', 'not_met'].includes(t)) return 's-risk';
  if (['minimal', 'limited', 'in_progress', 'in_review', 'submitted', 'development', 'pilot', 'planned'].includes(t)) return 's-ink';
  return 's-muted';
}

function donut(score) {
  const s = Math.max(0, Math.min(100, Number(score) || 0));
  const r = 46;
  const c = 2 * Math.PI * r;
  const dash = (s / 100) * c;
  return `<svg viewBox="0 0 108 108" aria-hidden="true">
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="#E6EBF1" stroke-width="7"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="#533AFD" stroke-width="7"
      stroke-linecap="butt" stroke-dasharray="${dash} ${c}"
      transform="rotate(-90 54 54)"/>
  </svg>`;
}

function secBar(num, title) {
  return `<div class="sec-bar">
    ${num ? `<span class="sec-bar-num">${x(num)}</span>` : ''}
    <span class="sec-bar-title">${x(title)}</span>
  </div>`;
}

function empty(msg) {
  return `<div class="empty">${x(msg)}</div>`;
}

function evSummary(ctrl) {
  const n = Number(ctrl.evidence_count || (ctrl.evidence_provided || []).length || 0);
  if (n > 0) return `<span class="ev-summary">Uploaded ${n}</span>`;
  return `<span class="ev-summary quiet">None</span>`;
}

function governanceBasisCell(ctrl) {
  const mapped = ctrl.mapped_requirements || [];
  if (mapped.length) {
    return mapped.map((m) => {
      const fw = m.framework_name || '';
      const art = m.article_reference || '';
      const title = m.requirement_title || '';
      const head = [fw, art].filter(Boolean).join(', ');
      const line = head && title ? `${head}: ${title}` : head || title || 'Mapped requirement';
      return `<div>${x(line)}${m.is_primary ? ' <span class="muted">(primary)</span>' : ''}</div>`;
    }).join('');
  }
  if (ctrl.is_org_level) return `<span class="muted">Internal governance requirement</span>`;
  return `<span class="muted">No external requirement currently mapped</span>`;
}

function displayControlTitle(title) {
  return String(title || 'Control')
    .replace(/\bAI System Risk Classification\b/gi, 'AI Asset Risk Classification')
    .replace(/\bAI system inventory\b/gi, 'AI asset inventory')
    .replace(/\bAI System Inventory\b/g, 'AI Asset Inventory');
}

function displayEvidenceType(label) {
  return String(label || '')
    .replace(/\bAI system classification report\b/gi, 'AI asset classification record')
    .replace(/\bAI system inventory export\b/gi, 'AI asset inventory export')
    .replace(/\bAI system\b/gi, 'AI asset');
}

function isMaterialControl(c) {
  const st = String(c.status || '').toLowerCase();
  const ev = Number(c.evidence_count || (c.evidence_provided || []).length || 0);
  if (ev > 0) return true;
  return ['implemented', 'verified', 'overdue', 'in_progress'].includes(st);
}

function statusMixStack(statuses) {
  const entries = Object.entries(statuses || {});
  if (!entries.length) return `<span class="muted">Not recorded</span>`;
  return `<div class="mix-stack">${entries.map(([k, v]) => `${x(pretty(k))}: ${x(v)}`).join('<br>')}</div>`;
}

function render(D) {
  const org = D.organisation || {};
  const orgName = org.name || 'Organisation';
  const meta = D.meta || {};
  const dossierId = meta.dossier_id || 'Not recorded';
  const generatedAt = meta.generated_at || new Date().toISOString();
  const hash = meta.snapshot_hash || '';
  const catalogueHash = meta.catalogue_hash || '';
  const methodologyLabel = meta.methodology_version_label || '';
  const methodologyId = meta.methodology_version_id || '';
  const summary = D.summary || {};
  const score = Number(summary.composite_score || 0);
  const posture = summary.posture || 'Unscored';
  const counts = summary.counts || {};
  const layers = summary.layers || [];
  const riskBuckets = summary.risk || [];
  const observations = summary.observations || [];
  const assets = D.assets || [];
  const assessments = D.assessments || [];
  const policies = D.policies || [];
  const frameworks = D.frameworks || {};
  const obligations = frameworks.obligations || [];
  const customFw = frameworks.custom || [];
  const customFwControls = frameworks.custom_controls || [];
  const controls = D.controls || [];
  const evidence = D.evidence || [];
  const activity = D.activity || [];
  const accountability = D.accountability || {};
  const orgRoles = accountability.org_roles || D.members || [];
  const assetOwners = accountability.asset_owners || [];

  const root = document.getElementById('dossier');

  const toc = [
    ['01', 'Executive summary'],
    ['02', 'Organisation and scope'],
    ['03', 'AI asset inventory'],
    ['04', 'Accountability'],
    ['05', 'Frameworks, regulations and policies'],
    ['06', 'Controls, requirements and evidence'],
    ['07', 'Assessments and risk'],
    ['08', 'Evidence index'],
    ['09', 'Activity trail'],
    ['10', 'Attestation and notice'],
  ];

  /* ── Cover ── */
  let html = `<section class="cover">
    <div class="cover-top">
      ${wordmarkLogo()}
      <div class="cov-doctype">AI governance dossier</div>
      <div class="cov-org">${x(orgName)}</div>
      <div class="cov-export">Exported ${x(fmtDate(generatedAt))}</div>
      <div class="cov-id">${x(dossierId)}</div>
      <p class="cov-blurb">A structured record of how ${x(orgName)} governs AI assets in RegAnchor: inventory, accountability, mapped requirements, control assignments, evidence, policies and assessment outcomes as held at the export date.</p>
      <div class="cov-score">
        <div>
          <div class="cov-score-lbl">Governance score</div>
          <div class="cov-score-val">${score}</div>
        </div>
        <div class="cov-score-posture">${x(posture)}</div>
      </div>
      <div class="cov-kpis">
        <div class="cov-kpi"><div class="cov-kpi-lbl">AI assets</div><div class="cov-kpi-val">${counts.assets || assets.length}</div><div class="cov-kpi-sub">${counts.high_risk_assets || 0} high risk</div></div>
        <div class="cov-kpi"><div class="cov-kpi-lbl">Controls</div><div class="cov-kpi-val">${counts.controls || controls.length}</div><div class="cov-kpi-sub">${counts.controls_done || 0} implemented</div></div>
        <div class="cov-kpi"><div class="cov-kpi-lbl">Evidence</div><div class="cov-kpi-val">${counts.evidence || evidence.length}</div></div>
        <div class="cov-kpi"><div class="cov-kpi-lbl">Requirements</div><div class="cov-kpi-val">${counts.obligations || 0}</div></div>
        <div class="cov-kpi"><div class="cov-kpi-lbl">Policies</div><div class="cov-kpi-val">${counts.policies_active || 0}</div></div>
      </div>
      <dl class="cov-ref">
        <div><dt>Org snapshot</dt><dd>${x(blank(hash))}</dd></div>
        <div><dt>Catalogue</dt><dd>${x(blank(catalogueHash))}</dd></div>
        <div><dt>Methodology</dt><dd>${x(blank(methodologyLabel))}</dd></div>
        <div><dt>Prepared for</dt><dd>Authorised reviewers, auditors, assurance and procurement</dd></div>
      </dl>
    </div>
    <div class="cover-foot">
      <div><strong>Issued by</strong>MLA Group Ltd via RegAnchor</div>
      <div style="text-align:right"><strong>Confidential</strong>${x(orgName)}</div>
    </div>
  </section>`;

  /* ── 01 Executive summary ── */
  const riskStrip = riskBuckets.length
    ? `<div class="risk-strip">${riskBuckets.map((r) =>
        `<span class="risk-chip"><strong>${x(r.count || 0)}</strong>${x(r.label || pretty(r.key))}</span>`
      ).join('')}</div>`
    : '';

  html += `<section class="section">
    ${secBar('01', 'Executive summary')}
    <h2 class="sec-title">Governance posture</h2>
    <p class="sec-intro">The composite score is a RegAnchor indicator from recorded controls and layer scores. It is not a certification of compliance.</p>
    <div class="score-row">
      <div class="score-ring">${donut(score)}<div class="score-ring-inner"><div class="score-num">${score}</div><div class="score-of">/ 100</div></div></div>
      <div>
        <div class="score-posture">${x(posture)}</div>
        <p class="score-note">As of ${x(fmtDate(summary.score_as_of || generatedAt))}. Layer scores follow the RegAnchor organisation, AI asset and assurance model.</p>
      </div>
    </div>
    <div class="layer-grid">
      ${(layers.length ? layers : [
        { label: 'Organisation', score: null },
        { label: 'AI assets', score: null },
        { label: 'Assurance', score: null },
      ]).map((l) => `<div class="layer"><div class="layer-lbl">${x(l.label)}</div><div class="layer-val">${l.score == null ? '—' : Math.round(Number(l.score) || 0)}</div></div>`).join('')}
    </div>
    ${riskStrip}
    <div class="stat-grid">
      <div class="stat"><span class="stat-lbl">AI assets</span><div class="stat-val">${counts.assets || 0}</div><div class="stat-sub">${counts.high_risk_assets || 0} high risk</div></div>
      <div class="stat"><span class="stat-lbl">Assessments</span><div class="stat-val">${counts.assessments || 0}</div></div>
      <div class="stat"><span class="stat-lbl">Controls assigned</span><div class="stat-val">${counts.controls || 0}</div><div class="stat-sub">${counts.controls_done || 0} implemented, ${counts.controls_in_progress || 0} in progress, ${counts.controls_outstanding || 0} outstanding</div></div>
      <div class="stat"><span class="stat-lbl">Evidence records</span><div class="stat-val">${counts.evidence || 0}</div></div>
      <div class="stat"><span class="stat-lbl">Active policies</span><div class="stat-val">${counts.policies_active || 0}</div></div>
      <div class="stat"><span class="stat-lbl">Mapped requirements</span><div class="stat-val">${counts.obligations || 0}</div></div>
    </div>
    <span class="sub-label">Key governance observations</span>
    ${observations.length
      ? `<ul class="obs-list">${observations.map((o) => `<li>${x(o)}</li>`).join('')}</ul>`
      : empty('No material observations generated from the current snapshot.')}
  </section>`;

  /* ── Contents ── */
  html += `<section class="section">
    ${secBar('', 'Contents')}
    <ul class="toc">${toc.map(([n, t]) => `<li><span class="toc-num">${n}</span><span class="toc-title">${x(t)}</span></li>`).join('')}</ul>
  </section>`;

  /* ── 02 Organisation & scope ── */
  html += `<section class="section">
    ${secBar('02', 'Organisation and scope')}
    <h2 class="sec-title">Organisation</h2>
    <p class="sec-intro">Workspace recorded in RegAnchor for this export. Internal implementation identifiers are omitted where they are not useful to a reviewer.</p>
    <dl class="kv">
      <dt>Organisation</dt><dd>${x(orgName)}</dd>
      <dt>Sector</dt><dd>${x(blank(org.sector))}</dd>
      <dt>Organisation size</dt><dd>${x(blank(org.org_size))}</dd>
      <dt>Export date</dt><dd>${x(fmtDate(generatedAt))}</dd>
      <dt>Dossier ID</dt><dd>${x(dossierId)}</dd>
      <dt>Org snapshot</dt><dd>${x(blank(hash))}</dd>
      <dt>Catalogue</dt><dd>${x(blank(catalogueHash))}</dd>
      <dt>Methodology</dt><dd>${x(blank(methodologyLabel))}${methodologyId ? `<span class="sign-meta">${x(String(methodologyId).slice(0, 8))}</span>` : ''}</dd>
    </dl>
    <span class="sub-label">Scope of this export</span>
    <dl class="kv">
      <dt>AI assets in scope</dt><dd>${counts.assets || 0}</dd>
      <dt>Control assignments</dt><dd>${counts.controls || 0}</dd>
      <dt>Evidence records</dt><dd>${counts.evidence || 0}</dd>
      <dt>Assessments</dt><dd>${counts.assessments || 0}</dd>
      <dt>Mapped requirements</dt><dd>${counts.obligations || 0}</dd>
      <dt>Active policies</dt><dd>${counts.policies_active || 0}</dd>
    </dl>
  </section>`;

  /* ── 03 AI asset inventory ── */
  const assetRows = assets.slice(0, 60).map((a) => `<tr>
    <td><span class="asset-name">${x(a.name || 'Unnamed')}</span>${a.model_name ? `<span class="asset-sub">${x(a.model_name)}</span>` : ''}</td>
    <td>${providerMark(a.provider_slug, a.vendor)}</td>
    <td><span class="status ${statusClass(a.risk_tier)}">${x(tierLabel(a.risk_tier))}</span></td>
    <td>${x(lifeLabel(a.lifecycle))}</td>
    <td>${x(blank(a.system_owner))}</td>
    <td class="muted">${x(blank(a.department))}</td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('03', 'AI asset inventory')}
    <h2 class="sec-title">Registered AI assets</h2>
    <p class="sec-intro">Inventory of AI assets held in RegAnchor for ${x(orgName)}, excluding deleted records.</p>
    ${assets.length ? `<table class="data">
      <thead><tr>
        <th>Asset</th><th>Provider</th><th>Risk</th><th>Lifecycle</th><th>Owner</th><th>Department</th>
      </tr></thead>
      <tbody>${assetRows}</tbody>
    </table>
    ${assets.length > 60 ? `<p class="note-line">${assets.length - 60} additional assets are available in RegAnchor and omitted from this page.</p>` : ''}`
      : empty('No AI assets registered for this organisation.')}
  </section>`;

  /* ── 04 Accountability ── */
  const roleRows = orgRoles.map((m) => `<tr>
    <td>${x(m.full_name || 'Member')}</td>
    <td>${x(pretty(m.role))}</td>
  </tr>`).join('');
  const ownerRows = assetOwners.slice(0, 40).map((o) => `<tr>
    <td>${x(o.asset_name)}</td>
    <td>${x(blank(o.owner))}</td>
    <td class="muted">${x(blank(o.department))}</td>
    <td><span class="status ${statusClass(o.risk_tier)}">${x(tierLabel(o.risk_tier))}</span></td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('04', 'Accountability')}
    <h2 class="sec-title">Governance accountability</h2>
    <p class="sec-intro">Organisation roles and AI asset ownership as recorded in RegAnchor. Personal email addresses are not included in this export.</p>
    <span class="sub-label">Organisation roles</span>
    ${orgRoles.length
      ? `<table class="data"><thead><tr><th>Name</th><th>Role</th></tr></thead><tbody>${roleRows}</tbody></table>`
      : empty('No organisation members recorded.')}
    <span class="sub-label">AI asset owners</span>
    ${assetOwners.length
      ? `<table class="data"><thead><tr><th>AI asset</th><th>Owner</th><th>Department</th><th>Risk</th></tr></thead><tbody>${ownerRows}</tbody></table>`
      : empty('No asset owners recorded on AI assets.')}
  </section>`;

  /* ── 05 Frameworks ── */
  const obByFw = new Map();
  for (const o of obligations) {
    const key = o.framework_label || o.framework || 'Framework';
    const list = obByFw.get(key) || [];
    list.push(o);
    obByFw.set(key, list);
  }

  let fwHtml = '';
  for (const [fwName, rows] of obByFw) {
    fwHtml += `<span class="sub-label">${x(fwName)}</span>
      <table class="data"><thead><tr>
        <th>Mapped requirement</th><th>Article / reference</th><th>AI assets mapped</th><th>Status mix</th>
      </tr></thead><tbody>
      ${rows.map((o) => `<tr>
          <td>${x(o.obligation_title)}</td>
          <td class="num">${x(blank(o.article_reference))}</td>
          <td class="num">${o.asset_count || 0}</td>
          <td>${statusMixStack(o.statuses)}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  const policyRows = policies.slice(0, 40).map((p) => `<tr>
    <td>${x(p.title)}</td>
    <td>${x(blank(p.version))}</td>
    <td><span class="status ${p.is_active ? 's-ok' : 's-muted'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
    <td class="muted">${x(fmtShort(p.published_at || p.updated_at))}</td>
    <td class="muted">${p.linked_control_title ? x(controlCode(p.linked_control_number) + ', ' + p.linked_control_title) : 'Not recorded'}</td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('05', 'Frameworks, regulations and policies')}
    <h2 class="sec-title">Regulatory and framework mappings</h2>
    <p class="sec-intro">Mapped requirements linked to AI assets in RegAnchor, with article, regulation or guidance references where recorded. This section reports mappings only. It is not a determination of legal obligations and is not legal advice.</p>
    ${obligations.length ? fwHtml : empty('No framework requirements are currently mapped against AI assets for this organisation.')}
    ${customFw.length ? `<span class="sub-label">Custom frameworks</span>
      <table class="data"><thead><tr><th>Framework</th><th>Status</th><th>Source</th></tr></thead>
      <tbody>${customFw.map((f) => `<tr>
        <td>${x(f.name)}</td>
        <td><span class="status ${f.is_active ? 's-ok' : 's-muted'}">${f.is_active ? 'Active' : 'Inactive'}</span></td>
        <td class="muted">${x(blank(f.source))}</td>
      </tr>`).join('')}</tbody></table>
      ${customFwControls.filter((c) => c.mapped_control_id).length
        ? `<table class="data"><thead><tr><th>Requirement</th><th>Framework</th><th>Mapped RegAnchor control</th><th>Status</th></tr></thead>
        <tbody>${customFwControls.filter((c) => c.mapped_control_id).map((c) => `<tr>
          <td>${x(c.title)}</td>
          <td>${x(blank(c.framework_name))}</td>
          <td>${x(controlCode(c.mapped_control_number) + (c.mapped_control_title ? ', ' + c.mapped_control_title : ''))}</td>
          <td><span class="status ${statusClass(c.status)}">${x(ctrlStatus(c.status))}</span></td>
        </tr>`).join('')}</tbody></table>`
        : ''}` : ''}
    <span class="sub-label">Policies</span>
    ${policies.length
      ? `<table class="data"><thead><tr><th>Policy</th><th>Version</th><th>Status</th><th>Date</th><th>Linked control</th></tr></thead><tbody>${policyRows}</tbody></table>`
      : empty('No policies recorded.')}
  </section>`;

  /* ── 06 Controls register ── */
  const ctrlRegister = controls.slice(0, 80).map((c) => `<tr>
    <td><strong>${x(controlCode(c.control_number))}</strong><br>${x(displayControlTitle(c.title))}</td>
    <td>${governanceBasisCell(c)}</td>
    <td>${x(c.is_org_level ? 'Organisation' : blank(c.asset_name))}</td>
    <td><span class="status ${statusClass(c.status)}">${x(ctrlStatus(c.status))}</span></td>
    <td>${evSummary(c)}</td>
    <td>${x(blank(c.owner_name))}</td>
    <td class="num muted">${x(fmtShort(c.due_date))}</td>
  </tr>`).join('');

  const material = controls.filter(isMaterialControl);
  const detailSource = material.slice(0, 40);
  const skippedOutstanding = controls.length - material.length;
  const detailOmitted = Math.max(0, material.length - detailSource.length);

  const detailBlocks = detailSource.map((c) => {
    const suggested = (c.suggested_evidence || []).map((s) => `<li>${x(displayEvidenceType(s))}</li>`).join('') || '<li>None recorded</li>';
    const provided = (c.evidence_provided || []).map((e) => `<li>${x(e.file_name)}</li>`).join('') || '<li>None uploaded</li>';
    const req = (c.mapped_requirements || []).length
      ? (c.mapped_requirements || []).map((m) => {
          const head = [m.framework_name, m.article_reference].filter(Boolean).join(', ');
          const title = m.requirement_title || '';
          return head && title ? `${head}: ${title}` : head || title;
        }).join('; ')
      : 'No external requirement currently mapped.';
    return `<div class="ctrl-block keep">
      <div class="ctrl-head">
        <span class="ctrl-code">${x(controlCode(c.control_number))}</span>
        <span class="ctrl-name">${x(displayControlTitle(c.title))}</span>
        <span class="status ${statusClass(c.status)}">${x(ctrlStatus(c.status))}</span>
      </div>
      ${c.purpose || c.description ? `<p class="ctrl-body">${x(c.purpose || c.description)}</p>` : ''}
      <dl class="ctrl-meta">
        <div><dt>Scope</dt><dd>${x(c.is_org_level ? 'Organisation' : blank(c.asset_name))}</dd></div>
        <div><dt>Owner</dt><dd>${x(blank(c.owner_name))}</dd></div>
        <div><dt>Due</dt><dd>${x(fmtShort(c.due_date))}</dd></div>
        <div><dt>Evidence status</dt><dd>${(c.evidence_count || 0) > 0 ? (c.evidence_count + ' file(s) uploaded') : 'No evidence uploaded'}</dd></div>
        <div><dt>Regulatory / framework mapping</dt><dd>${x(req)}</dd></div>
      </dl>
      <div class="ctrl-ev">
        <div class="ctrl-ev-box"><span class="ev-label">Suggested evidence</span><ul>${suggested}</ul></div>
        <div class="ctrl-ev-box"><span class="ev-label">Evidence provided</span><ul>${provided}</ul></div>
      </div>
    </div>`;
  }).join('');

  html += `<section class="section">
    ${secBar('06', 'Controls, requirements and evidence')}
    <h2 class="sec-title">Control register</h2>
    <p class="sec-intro">Control assignments from RegAnchor. Status and evidence are recorded separately: uploaded evidence supports a control; it does not by itself mean the control is implemented.</p>
    ${controls.length
      ? `<table class="data">
        <thead><tr>
          <th>Control</th><th>Governance basis</th><th>Asset / scope</th><th>Status</th><th>Evidence</th><th>Owner</th><th>Due</th>
        </tr></thead>
        <tbody>${ctrlRegister}</tbody>
      </table>
      ${controls.length > 80 ? `<p class="note-line">${controls.length - 80} additional assignments are omitted from the register table.</p>` : ''}`
      : empty('No control assignments recorded.')}
  </section>`;

  html += `<section class="section">
    ${secBar('06a', 'Control detail')}
    <h2 class="sec-title">Control definitions and evidence</h2>
    <p class="sec-intro">Expanded view of material assignments: implemented, verified, overdue, in progress, or any with uploaded evidence. Outstanding not-started items remain in the register only.</p>
    ${detailSource.length ? detailBlocks : empty('No material control assignments to detail in this export.')}
    ${skippedOutstanding > 0 ? `<p class="note-line">${skippedOutstanding} not-started assignment${skippedOutstanding === 1 ? '' : 's'} summarised in the register only.</p>` : ''}
    ${detailOmitted > 0 ? `<p class="note-line">${detailOmitted} further material assignment${detailOmitted === 1 ? '' : 's'} summarised in the register only.</p>` : ''}
  </section>`;

  /* ── 07 Assessments ── */
  const assessRows = assessments.slice(0, 50).map((a) => `<tr>
    <td>${x(blank(a.asset_name))}</td>
    <td class="num muted">${x(fmtShort(a.completed_at || a.requested_at))}</td>
    <td class="num">${a.overall_score != null ? x(a.overall_score) : 'Not recorded'}</td>
    <td><span class="status ${statusClass(a.risk_band)}">${x(tierLabel(a.risk_band) === 'Unclassified' && a.risk_band ? pretty(a.risk_band) : tierLabel(a.risk_band))}</span></td>
    <td><span class="status ${statusClass(a.status)}">${x(assessStatus(a.status))}</span></td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('07', 'Assessments and risk')}
    <h2 class="sec-title">Assessment outcomes</h2>
    <p class="sec-intro">Registry assessments recorded for AI assets. This is a governance summary, not a full questionnaire export.</p>
    ${assessments.length
      ? `<table class="data"><thead><tr>
        <th>AI asset</th><th>Date</th><th>Score</th><th>Risk band</th><th>Assessment status</th>
      </tr></thead><tbody>${assessRows}</tbody></table>`
      : empty('No assessments recorded.')}
  </section>`;

  /* ── 08 Evidence index ── */
  const evRows = evidence.slice(0, 80).map((e) => `<tr>
    <td>${x(e.file_name)}</td>
    <td>${e.control_title ? x(controlCode(e.control_number) + ', ' + e.control_title) : 'Not recorded'}</td>
    <td>${x(e.asset_name || (e.scope === 'organisation' ? 'Organisation' : 'Not recorded'))}</td>
    <td class="num muted">${x(fmtShort(e.uploaded_at))}</td>
    <td class="muted">${x(blank(e.file_type))}</td>
    <td><span class="status ${statusClass(e.control_status)}">${e.control_status ? x(ctrlStatus(e.control_status)) : 'Not recorded'}</span></td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('08', 'Evidence index')}
    <h2 class="sec-title">Uploaded evidence</h2>
    <p class="sec-intro">Files uploaded in RegAnchor and their linked control assignment or AI asset, where that relationship exists.</p>
    ${evidence.length
      ? `<table class="data"><thead><tr>
        <th>File</th><th>Linked control</th><th>AI asset / scope</th><th>Uploaded</th><th>Type</th><th>Control status</th>
      </tr></thead><tbody>${evRows}</tbody></table>`
      : empty('No evidence files uploaded.')}
  </section>`;

  /* ── 09 Activity ── */
  const actRows = activity.slice(0, 50).map((a) => `<tr>
    <td class="num muted">${x(fmtShort(a.created_at))}</td>
    <td>${x(ACTIVITY_LABELS[a.action] || pretty(a.action))}</td>
    <td>${x(a.entity_type === 'ai_system' || a.entity_type === 'ai_asset' ? 'AI asset' : pretty(a.entity_type))}</td>
    <td class="muted">${x(blank(a.entity_label))}</td>
  </tr>`).join('');

  html += `<section class="section">
    ${secBar('09', 'Activity trail')}
    <h2 class="sec-title">Recent governance activity</h2>
    <p class="sec-intro">Selected governance events from the RegAnchor audit log for this organisation.</p>
    ${activity.length
      ? `<table class="data"><thead><tr><th>Date</th><th>Event</th><th>Entity</th><th>Subject</th></tr></thead><tbody>${actRows}</tbody></table>`
      : empty('No qualifying governance activity in the recent log.')}
  </section>`;

  /* ── 10 Attestation ── */
  html += `<section class="section">
    ${secBar('10', 'Attestation and notice')}
    <h2 class="sec-title">Attestation</h2>
    <div class="attest">
      <p>This AI Governance Dossier is an export of data held in RegAnchor for <strong>${x(orgName)}</strong> as at <strong>${x(fmtDate(generatedAt))}</strong>.</p>
      <p>It reflects the organisation’s recorded AI asset inventory, control assignments, evidence uploads, assessments, policies and framework mappings at the stated export time.</p>
      <p>It is <strong>not</strong> a certification of compliance, <strong>not</strong> legal advice, and <strong>not</strong> an independent assurance opinion.</p>
    </div>
    <div class="sign-grid">
      <div class="sign-box">
        <div class="sign-lbl">Organisation reviewer</div>
        <div class="sign-val">Name / role / date</div>
      </div>
      <div class="sign-box">
        <div class="sign-lbl">Export reference</div>
        <div class="sign-val">${x(dossierId)}
          <span class="sign-meta">${x(fmtDate(generatedAt))}${catalogueHash ? '<br>Catalogue ' + x(catalogueHash) : ''}${methodologyLabel ? '<br>Methodology ' + x(methodologyLabel) : ''}${hash ? '<br>Snapshot ' + x(hash) : ''}</span>
        </div>
      </div>
    </div>
  </section>`;

  root.innerHTML = html;
  document.title = `RegAnchor · AI Governance Dossier · ${orgName}`;
}

const SECTOR_OPTIONS=['Financial Services','Healthcare & Life Sciences','Legal & Professional Services','Retail & E-commerce','Technology & SaaS','Public Sector / Government','Education','Manufacturing & Logistics','Other'];

// ═══ INIT ═════════════════════════════════════════════════════
async function init(){
  if(!SYSTEM_ID){alert('No system specified.');window.location.href='portal.html';return}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return}
  currentUser=session.user;
  // Load system data
  const{data:sys}=await sb.from('ai_systems').select('*').eq('id',SYSTEM_ID).single();
  if(!sys){alert('System not found.');window.location.href='portal.html';return}
  systemData=sys;
  // Load org
  const{data:org}=await sb.from('organisations').select('*').eq('id',sys.org_id).single();
  currentOrg=org;
  buildScreens();
  goTo('pre');
}
 
// ═══ BUILD SCREENS ════════════════════════════════════════════
function buildScreens(){
  const c=document.getElementById('screens-container');
  // Pre-assessment screen
  let html=`<div class="screen" id="screen-pre"><div class="card">
    <div class="section-title">${esc(systemData.name)}</div>
    <div class="section-desc">Evaluate governance maturity across seven domains. You get a system-level risk score and regulatory mapping.</div>
    <div class="info-callout" style="padding:14px 16px;margin-bottom:20px;">
      <div style="font-size:13px;color:var(--sub);line-height:1.6;">
        <strong>System:</strong> ${esc(systemData.name)}<br>
        <strong>Risk Tier:</strong> ${systemData.risk_tier?'Suggested: '+(systemData.risk_tier.charAt(0).toUpperCase()+systemData.risk_tier.slice(1)):'Not yet classified'}<br>
        <strong>Owner:</strong> ${esc(systemData.system_owner||'Not set')}
      </div>
    </div>
    <div class="form-group"><label class="form-label">Which sector does this AI system primarily operate in?</label>
      <select class="form-select" id="pre-sector"><option value="">Select sector</option>${SECTOR_OPTIONS.map(s=>`<option>${s}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label class="form-label">Any additional context for the assessor? <span class="form-label-note">(optional)</span></label>
      <textarea class="form-input" id="pre-notes" rows="3" placeholder="Anything RegAnchor should know about this system" style="resize:vertical;min-height:70px;"></textarea>
    </div>
    <div id="pre-error" class="error-msg"></div>
    <div class="nav-btns">
      <button type="button" class="btn-primary" onclick="startAssessment()">Begin assessment &#8594;</button>
    </div>
  </div></div>`;
 
  // Section screens
  SECTIONS.forEach((section,si)=>{
    html+=`<div class="screen" id="screen-${section.id}"><div class="card">
      <div class="section-title">${section.title}</div>
      <div class="section-desc">${section.desc}</div>`;
    section.questions.forEach((q,qi)=>{
      html+=`<div class="q-block">
        <div class="q-label">${q.text}</div>
        ${q.hint?`<div class="q-hint">${q.hint}</div>`:''}
        <div class="options" id="${q.id}">
          ${q.options.map((o,oi)=>`<label class="option" onclick="pick(this,'${q.id}',${o.s})"><span class="option-dot"></span>${esc(o.l)}</label>`).join('')}
        </div>
      </div>`;
    });
    html+=`<div id="${section.id}-error" class="error-msg"></div>
      <div class="nav-btns">
        <button class="btn-secondary" onclick="goTo('${si===0?'pre':SECTIONS[si-1].id}')">&#8592; Back</button>
        ${si<SECTIONS.length-1
          ?`<button class="btn-primary" onclick="nextSection('${section.id}','${SECTIONS[si+1].id}')">Continue &#8594;</button>`
          :`<button class="btn-primary" onclick="finishAssessment('${section.id}')">Complete Assessment &#8594;</button>`
        }
      </div>
    </div></div>`;
  });
 
  c.innerHTML=html;
}
 
// ═══ NAVIGATION ══════════════════════════════════════════════
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  const idx=ORDER.indexOf(id);
  const chrome=document.getElementById('siteChrome');
  const count=document.getElementById('progressCount');
  const fill=document.getElementById('progressFill');
  const showSteps=idx>-1 && id!=='calc' && id!=='results';
  if(chrome) chrome.classList.toggle('has-steps',showSteps);
  if(count){
    count.hidden=!showSteps;
    if(showSteps) count.textContent=(idx+1)+' of '+ORDER.length;
  }
  if(showSteps && fill){
    fill.style.width=Math.round(((idx+1)/ORDER.length)*100)+'%';
  }
}
 
function pick(el,qid,score){
  document.querySelectorAll('#'+qid+' .option').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  R[qid]=score;
}
 
function startAssessment(){
  assessSector=document.getElementById('pre-sector').value;
  const err=document.getElementById('pre-error');
  if(!assessSector){err.textContent='Please select a sector.';err.style.display='block';return}
  err.style.display='none';
  assessNotes=document.getElementById('pre-notes').value.trim();
  goTo(SECTIONS[0].id);
}
 
function nextSection(currentId,nextId){
  const section=SECTIONS.find(s=>s.id===currentId);
  const err=document.getElementById(currentId+'-error');
  for(const q of section.questions){
    if(R[q.id]===undefined){err.textContent='Please answer all questions before continuing.';err.style.display='block';return}
  }
  err.style.display='none';
  goTo(nextId);
}
 
// ═══ SCORING ═════════════════════════════════════════════════
function finishAssessment(lastSectionId){
  const section=SECTIONS.find(s=>s.id===lastSectionId);
  const err=document.getElementById(lastSectionId+'-error');
  for(const q of section.questions){
    if(R[q.id]===undefined){err.textContent='Please answer all questions before continuing.';err.style.display='block';return}
  }
  err.style.display='none';
  document.getElementById('calcOverlay').classList.add('active');
 
  // Calculate scores
  const sectionScores={};
  let weightedTotal=0;
  SECTIONS.forEach(sec=>{
    let earned=0,possible=0;
    sec.questions.forEach(q=>{
      const ans=R[q.id];if(ans!==undefined){earned+=ans;possible+=Math.max(...q.options.map(o=>o.s))}
    });
    const pct=possible>0?Math.round((earned/possible)*100):0;
    sectionScores[sec.id]={score:pct,title:sec.title,weight:WEIGHTS[sec.id]};
    weightedTotal+=pct*WEIGHTS[sec.id];
  });
  const overall=Math.round(weightedTotal);
  const band=overall>=70?'low':overall>=40?'medium':'high';
 
  // Priority flags
  const flags=[];
  Object.entries(sectionScores).forEach(([id,d])=>{
    if(d.score<40){const sec=SECTIONS.find(s=>s.id===id);flags.push({section:d.title,score:d.score,regulatory:sec?.reg||''})}
  });
 
  // Tier validation
  let tierVal=null;
  if(systemData.risk_tier){
    let suggested='minimal';
    if(R.q1_1===0||R.q1_3===0)suggested='high';
    else if(R.q1_1===1||R.q1_3===1)suggested='high';
    else if(R.q1_1===2||R.q1_3===2)suggested='limited';
    if(R.q2_1===1)suggested='high';
    const mismatch=['high','unacceptable'].includes(suggested)&&!['high','unacceptable'].includes(systemData.risk_tier);
    if(mismatch)tierVal={suggested,current:systemData.risk_tier,mismatch:true};
  }
 
  saveAssessment({responses:R,sectionScores,overall,band,flags,tierVal});
}
 
async function saveAssessment(result){
  try{
    const{data:inserted,error}=await sb.from('registry_assessments').insert({
      system_id:SYSTEM_ID,
      org_id:currentOrg.id,
      responses:result.responses,
      section_scores:result.sectionScores,
      overall_score:result.overall,
      risk_band:result.band,
      questionnaire_version:VER,
      sector:assessSector,
      client_notes:assessNotes||null,
      tier_validation:result.tierVal,
      requested_by:currentUser.id,
      status:'submitted'
    }).select('id').single();
    if(error)throw error;
    const assessId=inserted?.id||null;
    // Audit log
    await sb.from('registry_audit_log').insert({
      org_id:currentOrg.id,user_id:currentUser.id,
      action:'assessment_submitted',entity_type:'ai_system',entity_id:SYSTEM_ID,
      changes:{overall_score:result.overall,risk_band:result.band,sector:assessSector,assessment_id:assessId}
    });
    // Trigger governance controls based on responses
    var triggered=await triggerControls(result.responses,assessId);
    // Show results screen
    showResultsScreen(result,triggered||[],assessId);
  }catch(err){
    document.getElementById('calcOverlay').classList.remove('active');
    alert('Error saving assessment: '+err.message);
  }
}
 
// ═══ CONTROL TRIGGER LOGIC ════════════════════════════════════
// Maps assessment responses to the 12 governance controls
const TRIGGER_MAP=[
  {control_number:1, questions:['q6_1'], threshold:1},          // AI Governance Policy
  {control_number:3, questions:['q7_1','q7_2','q7_3','q7_4'], threshold:1}, // Vendor Governance
  {control_number:4, questions:['q1_1','q1_3'], threshold:1},  // Risk Classification
  {control_number:5, questions:['q4_1','q4_2','q4_4'], threshold:1}, // Human Oversight
  {control_number:6, questions:['q3_1','q3_2'], threshold:1},  // Transparency
  {control_number:7, questions:['q2_1','q2_3','q2_4','q2_5'], threshold:1}, // Data Governance
  {control_number:8, questions:['q5_2'], threshold:1},          // Monitoring
  {control_number:9, questions:['q5_1'], threshold:1},          // Security Testing
  {control_number:10, questions:['q5_3'], threshold:1},         // Incident Response
  {control_number:11, questions:['q6_2'], threshold:1},         // Documentation
  {control_number:12, questions:['q3_3','q6_4'], threshold:1},  // Audit Logging
];
 
async function triggerControls(responses,assessId){
  try{
    const{data:controls}=await sb.from('governance_controls').select('id,control_number,title,is_org_level').eq('is_active',true);
    if(!controls)return;
    const ctrlMap={};controls.forEach(c=>{ctrlMap[c.control_number]=c});
    const triggered=[];
    TRIGGER_MAP.forEach(rule=>{
      const ctrl=ctrlMap[rule.control_number];if(!ctrl)return;
      const anyBelow=rule.questions.some(qid=>responses[qid]!==undefined&&responses[qid]<=rule.threshold);
      if(anyBelow)triggered.push(ctrl);
    });
    if(ctrlMap[2])triggered.push(ctrlMap[2]);
    if(!triggered.length)return;
    for(const ctrl of triggered){
      const payload={control_id:ctrl.id,org_id:currentOrg.id,status:'not_started',triggered_by:'assessment',assessment_id:assessId||null};
      if(!ctrl.is_org_level)payload.system_id=SYSTEM_ID;
      else payload.system_id=null;
      // Insert, ignore duplicate (unique constraint handles idempotency)
      const{error}=await sb.from('control_assignments').insert(payload);
      if(error&&error.code!=='23505')console.error('Control trigger error:',ctrl.control_number,error);
      // 23505 = unique_violation = already assigned, which is fine
    }
    console.log('Triggered '+triggered.length+' controls');
    return triggered;
  }catch(err){console.error('Trigger controls error:',err);return[]}
}
 
function showResultsScreen(result, triggered, assessId) {
  document.getElementById('calcOverlay').classList.remove('active');
  document.getElementById('siteChrome')?.classList.remove('has-steps');
  const pc = document.getElementById('progressCount');
  if (pc) pc.hidden = true;

  var band = result.band;
  var bandLabel = band === 'low' ? 'Low Risk': band === 'high' ? 'High Risk': 'Medium Risk';
  var score = result.overall || 0;
  var ss = result.sectionScores || {};

  var secBars = Object.entries(ss).map(function (entry) {
    var v = entry[1];
    var pct = Math.round(v.score || 0);
    var lvl = pct >= 70 ? 'Low': pct >= 40 ? 'Moderate': 'High';
    return '' +
      '<div class="domain-item">' +
        '<div><div class="domain-name">' + esc(v.title || entry[0]) + '</div></div>' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<div class="domain-track"><div class="domain-track__fill" style="width:' + pct + '%"></div></div>' +
          '<span class="domain-pct">' + pct + '</span>' +
          '<span class="risk-pill">' + lvl + '</span>' +
        '</div>' +
      '</div>';
  }).join('');

  var ctrlHtml = '';
  if (triggered.length) {
    ctrlHtml = '' +
      '<div style="margin-top:28px;text-align:left;">' +
        '<div class="label">Controls Triggered</div>' +
        '<div style="display:flex;flex-direction:column;">' +
          triggered.map(function (c) {
            return '' +
              '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">' +
                '<span style="font-family:var(--ra-font-brand);font-size:12px;font-weight:500;color:var(--muted);width:28px;flex-shrink:0;">' +
                  c.control_number +
                '</span>' +
                '<span style="font-size:14px;color:var(--main);">' + esc(c.title || ('Control ' + c.control_number)) + '</span>' +
              '</div>';
          }).join('') +
        '</div>' +
      '</div>';
  } else {
    ctrlHtml = '' +
      '<div style="margin-top:28px;padding:16px 0;border-top:1px solid var(--border);text-align:left;">' +
        '<div style="font-size:14px;font-weight:500;color:var(--main);margin-bottom:4px;">No controls triggered</div>' +
        '<div style="font-size:13px;color:var(--muted);">This system scored well across all governance domains.</div>' +
      '</div>';
  }

  var reportCta = isPaidTier()
    ? '<a href="system-report.html?aid=' + (assessId || '') + '" target="_blank" class="btn-secondary">View Full Report</a>': '<a href="portal.html?goto=plans" class="btn-secondary">Upgrade to View Report</a>';

  document.getElementById('screens-container').innerHTML = '' +
    '<div class="card" style="padding:36px 28px;">' +
      '<div class="label">Assessment Complete</div>' +
      '<h2 style="margin-bottom:8px;">' + esc(systemData.name) + '</h2>' +
      '<div class="diag-score" style="justify-content:flex-start;margin-top:16px;">' +
        '<span class="diag-score__num" style="font-size:64px;">' + Math.round(score) + '</span>' +
        '<span class="diag-score__of">/ 100</span>' +
      '</div>' +
      '<p class="diag-tier"><strong>' + raLevelText(score) + '</strong> / ' + bandLabel + '</p>' +
      '<div class="diag-maturity-row" style="margin:20px 0 28px;">' +
        raComplianceBar(score) + raLadderScale(score) +
      '</div>' +
      '<div class="domain-list" style="max-width:none;">' + secBars + '</div>' +
      ctrlHtml +
      '<div class="nav-btns" style="margin-top:28px;flex-wrap:wrap;">' +
        '<a href="portal.html?goto=system-controls-' + SYSTEM_ID + '" class="btn-primary">View Controls</a>' +
        reportCta +
        '<a href="portal.html#registry-detail-' + SYSTEM_ID + '" class="btn-secondary">Back to System</a>' +
      '</div>' +
    '</div>';
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Sticky chrome fade: same behaviour as results.html
(function () {
  const chrome = document.getElementById('siteChrome');
  if (!chrome) return;
  const onScroll = () => chrome.classList.toggle('is-scrolled', window.scrollY > 12);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
 
init();
</script>

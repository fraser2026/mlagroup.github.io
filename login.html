<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in | RegAnchor</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/reganchor.css"/>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--ra-font-product, Inter, sans-serif);
      background: #fff;
      color: var(--ra-text-2, #425466);
      font-size: 14px;
    }
    a { color: var(--ra-blurple, #533AFD); text-decoration: none; }
    a:hover { color: var(--ra-blurple-hover, #4434E0); }
  </style>
  <script>
    (function () {
      var APP = 'https://app.reganchor.com/login';
      var src = new URLSearchParams(window.location.search);
      var dest = new URL(APP);
      var next = src.get('next') || src.get('return') || '';
      var after = src.get('after') || '';

      if (!next) {
        if (after === 'payment') next = '/reports';
        else if (after === 'diagnostic') next = '/registry';
      }
      if (next) {
        if (next.indexOf('portal.html') === 0 || next === 'portal' || next.indexOf('/portal') === 0) {
          next = '/registry';
        } else if (next.charAt(0) !== '/' && next.indexOf('http') !== 0) {
          next = '/' + next;
        }
        if (next.indexOf('http') === 0) {
          try {
            var u = new URL(next);
            next = u.pathname + u.search + u.hash;
          } catch (e) {
            next = '/registry';
          }
        }
        dest.searchParams.set('next', next);
      }

      src.forEach(function (value, key) {
        if (key === 'next' || key === 'return' || key === 'after') return;
        dest.searchParams.set(key, value);
      });

      if (src.get('mode') === 'register') dest.searchParams.set('mode', 'register');

      window.location.replace(dest.toString());
    })();
  </script>
</head>
<body>
  <p>Continuing to <a href="https://app.reganchor.com/login">app.reganchor.com</a>.</p>
</body>
</html>

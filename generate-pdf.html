[span_8](start_span)[span_9](start_span)[span_10](start_span)[span_11](start_span)[span_12](start_span)[span_13](start_span)[span_14](start_span)const BASE_MAX = { s1: 12, s2: 18, s3: 12, s4: 12, s5: 15, s6: 15, s7: 15 };[span_8](end_span)[span_9](end_span)[span_10](end_span)[span_11](end_span)[span_12](end_span)[span_13](end_span)[span_14](end_span)

    { min: 25, label: "HIGH", sub: "Significant Exposure — Intervention Required", color: [153, 27, 27] },

window.onload = async function() {
    const raw = sessionStorage.getItem('portal_result');
    if (!raw) return;
    const data = JSON.parse(raw);

    // 1. Adjusted Max Score Logic (Q1.2 High-Risk Categories)
    let adjMax = { ...BASE_MAX };
    const cats = data.q1_2_selections || [];
    [span_16](start_span)if (cats.includes('Automated decision support')) adjMax.s4 += 2;[span_16](end_span)
    [span_17](start_span)if (cats.includes('Customer profiling')) adjMax.s6 += 2;[span_17](end_span)
    if (cats.includes('Health or safety')) { adjMax.s4 += 2; adjMax.s5 += 2; adjMax.s6 += 2; [span_18](start_span)}

    // 2. Calculation Pipeline
    const scores = typeof data.section_scores === 'string' ? JSON.parse(data.section_scores) : data.section_scores;
    let weightedScore = 0;
    Object.keys(SECTION_WEIGHTS).forEach(s => {
        weightedScore += ((scores[s] || 0) / adjMax[s]) * 100 * SECTION_WEIGHTS[s];[span_18](end_span)

    [span_19](start_span)const adjustedScore = weightedScore * (SECTOR_MULTIPLIERS[data.sector] || 0.90);[span_19](end_span)

    [span_21](start_span)else if ((data.uncertainty_count || 0) >= 3) bandIdx = Math.max(0, Math.min(bandIdx + 1, 4));[span_21](end_span)
    const band = RISK_BANDS[bandIdx];

    const REGIME_FLAGS = {

        "ICO registered / GDPR": { label: "Mandatory: DPIA required for personal data AI", basis: "UK GDPR Art.35" },
        "NHS / CQC oversight": { label: "Mandatory: Clinical AI requires DCB0129 and DTAC", basis: "NHS DTAC" }
    [span_22](start_span)};[span_22](end_span)

    let priorityFlags = typeof data.priority_flags === 'string' ? JSON.parse(data.priority_flags) : data.priority_flags;
    (data.regulatory_regimes || []).forEach(r => {

    });

    doc.setFillColor(0, 26, 58).rect(0, 0, 210, 297, 'F');

    doc.addPage();

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generating Your Report...</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #F7F8FC; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: white; border-radius: 14px; padding: 40px; text-align: center; box-shadow: 0 4px 24px rgba(0,26,58,0.1); max-width: 400px; width: 90%; }
    .spinner { width: 40px; height: 40px; border: 4px solid #E2E8F4; border-top-color: #0000FF; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: inline-block; padding: 12px 24px; background: #0000FF; color: white; border-radius: 10px; text-decoration: none; font-weight: 600; margin-top: 15px; cursor: pointer; border: none; }
    #status { color: #5A6B82; font-size: 0.9rem; }
    .check { font-size: 2rem; color: #22C55E; display: none; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="check" id="check">✓</div>
  <h2 id="heading" style="margin:0 0 10px; color:#001A3A;">Preparing Report</h2>
  <p id="status">Generating your results...</p>
  <div id="action-area"></div>
  <a href="portal.html" class="btn" id="back-btn" style="display:none; background:#64748b;">Back</a>
</div>

<script>
// --- HELPER FUNCTIONS ---
function setStatus(msg) { document.getElementById('status').textContent = msg; }

function showSuccess(pdfData, isIOS, filename) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('check').style.display = 'block';
  document.getElementById('back-btn').style.display = 'inline-block';
  
  if (isIOS) {
    document.getElementById('heading').textContent = 'Report Ready';
    setStatus('Safari requires a tap to open the PDF:');
    
    const btn = document.createElement('button');
    btn.textContent = 'View PDF Report';
    btn.className = 'btn';
    btn.onclick = function() {
      const newWin = window.open('', '_blank');
      // Injecting as an iframe inside the new window to bypass the "Blank Page" bug
      newWin.document.write(`
        <html>
          <head><title>${filename}</title></head>
          <body style="margin:0;">
            <embed width="100%" height="100%" src="${pdfData}" type="application/pdf">
          </body>
        </html>
      `);
    };
    document.getElementById('action-area').appendChild(btn);
  } else {
    document.getElementById('heading').textContent = 'Report Downloaded';
    setStatus('Your PDF has been saved to your device.');
  }
}

// (Keep all your existing _RECON, _WEIGHTS, _SECTION_NAMES, etc. here)

function generatePortalPDF(row) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  
  try {
    // 1. --- YOUR FULL DRAWING LOGIC ---
    // (Paste all your doc.text, doc.setFillColor, etc. here)
    // Make sure you include the _hdr, _ftr, _sh helpers you wrote
    
    // Example placeholder for testing:
    doc.setFontSize(22);
    doc.text("AI Risk Report", 20, 30);
    doc.setFontSize(12);
    doc.text("Organisation: " + (row.organisation || 'N/A'), 20, 45);

    // 2. --- OUTPUT HANDLING ---
    const filename = 'MLA-Report-' + Date.now() + '.pdf';

    if (isIOS) {
      // For iOS: Convert to Data URI (Base64) to prevent blank pages
      const dataUri = doc.output('datauristring');
      showSuccess(dataUri, true, filename);
    } else {
      // For Desktop: Use standard save
      doc.save(filename);
      showSuccess(null, false, filename);
    }

  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message);
  }
}

// --- TRIGGER ---
window.addEventListener('load', function() {
  const raw = sessionStorage.getItem('portal_result');
  if (raw) {
    const data = JSON.parse(raw);
    generatePortalPDF(data);
  } else {
    setStatus('No data found to generate report.');
  }
});
</script>
</body>
</html>

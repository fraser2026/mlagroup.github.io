<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    background: #001A3A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4466FF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.6; }
  iframe { display: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status-text">Building your bespoke AI Governance report...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
  // ==========================================
  // 1. HELPERS (Must be Global)
  // ==========================================
  function ps(str) {
    if (!str) return '';
    return str.toString()
      .replace(/\u2014|\u2013/g, '-')
      .replace(/\u2018|\u2019/g, "'")
      .replace(/\u201C|\u201D/g, '"')
      .replace(/[^\x00-\xFF]/g, '')
      .trim();
  }

  function drawBar(doc, x, y, totalW, h, pct, fillRGB) {
    doc.setFillColor(230, 235, 240).rect(x, y, totalW, h, 'F');
    if (pct > 0) {
      doc.setFillColor(...fillRGB);
      doc.rect(x, y, Math.max(1, (pct * totalW / 100)), h, 'F');
    }
  }

  // ==========================================
  // 2. THE TRIGGER
  // ==========================================
  const frame = document.getElementById('pdf-frame');
  
  frame.addEventListener('load', function() {
    const data = sessionStorage.getItem('portal_result');
    if (!data) {
        document.getElementById('status-text').innerText = "Error: No assessment data found.";
        return;
    }

    const RESULTS = JSON.parse(data);
    
    // Give the iframe 2 seconds to load its own scripts before we grab the PDF
    setTimeout(() => {
      generateFinalPDF(RESULTS);
    }, 2000);
  });

  // ==========================================
  // 3. THE GENERATOR
  // ==========================================
  function generateFinalPDF(RESULTS) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    
    try {
      // SETTINGS
      const W = 210, M = 18;
      const navy = [0, 26, 58], blue = [26, 107, 255];
      const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

      // DATA EXTRACTION (Safety first)
      const orgName = ps(RESULTS.organisation || "Organisation");
      const score = RESULTS.adjustedScore || 0;
      const bandLabel = RESULTS.band ? RESULTS.band.label : "Assessment Complete";
      const bandId = RESULTS.band ? RESULTS.band.id : "moderate";

      // --- PAGE 1: COVER ---
      doc.setFillColor(...navy).rect(0, 0, W, 297, 'F');
      doc.setFillColor(...blue).rect(0, 0, W, 6, 'F');
      
      doc.setFont('helvetica', 'bold').setFontSize(26).setTextColor(255, 255, 255);
      doc.text(orgName, M, 70);
      
      doc.setFontSize(14).setTextColor(150, 180, 220);
      doc.text('AI GOVERNANCE RISK REPORT', M, 82);
      
      doc.setFontSize(40).setTextColor(...blue);
      doc.text(score + '%', M, 110);
      doc.setFontSize(12).text(bandLabel.toUpperCase(), M, 120);

      // --- PAGE 2: SECTION BREAKDOWN ---
      doc.addPage();
      doc.setFillColor(...navy).rect(0, 0, W, 35, 'F');
      doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255).text('DOMAIN MATURITY BREAKDOWN', M, 20);

      let y = 50;
      const sections = RESULTS.sectionNames || {};
      const pcts = RESULTS.sectionPcts || {};

      Object.keys(sections).forEach((key) => {
        const p = pcts[key] || 0;
        const color = p > 70 ? [30, 150, 80] : p > 40 ? [200, 120, 0] : [180, 40, 40];

        doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(40, 50, 60);
        doc.text(ps(sections[key]), M, y);
        
        drawBar(doc, M + 90, y - 3, 40, 4, p, color);
        doc.setFont('helvetica', 'bold').text(p + '%', W - M, y, { align: 'right' });
        
        y += 12;
      });

      // --- FOOTER (On current page) ---
      doc.setFontSize(7).setTextColor(150, 150, 150);
      doc.text('Generated on ' + today + ' | MLA Group Confidential', M, 285);

      // --- SAVE AND CLOSE ---
      doc.save('MLA-AI-Report-' + orgName.replace(/\s+/g, '-') + '.pdf');
      
      document.getElementById('status-text').innerText = "Report Downloaded. Closing...";
      setTimeout(() => window.close(), 3000);

    } catch (err) {
      console.error("PDF Engine Error:", err);
      document.getElementById('status-text').innerText = "Error generating PDF. Please contact support.";
    }
  }
</script>
</body>
</html>

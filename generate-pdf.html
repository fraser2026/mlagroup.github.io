<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: sans-serif;
    background: #001A3A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4466FF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.6; }
  iframe { display: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>Generating your report...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
  // ==========================================
  // 1. GLOBAL VARIABLES & CONFIG
  // ==========================================
  let RESULTS = {};
  const WEIGHTS = { s1: 0.20, s2: 0.18, s3: 0.16, s4: 0.16, s5: 0.14, s6: 0.10, s7: 0.06 };
  const FINDING_DATA = {}; 
  const REGIME_FINDING = { section:'Regulatory', severity:'high', impact:'Significant regulatory misalignment.', rec:'Review alignment with EU AI Act.' };
  const FRAMEWORK = { nextReview: 'August 2026' };

  // ==========================================
  // 2. HELPER FUNCTIONS (Must be Global)
  // ==========================================
  function ps(str) {
    if (!str) return '';
    return str
      .replace(/\u2014|\u2013/g, '-')
      .replace(/\u2018|\u2019/g, "'")
      .replace(/\u201C|\u201D/g, '"')
      .replace(/\u2026/g, '...')
      .replace(/\u00D7/g, 'x')
      .replace(/\u2212/g, '-')
      .replace(/\u00A0/g, ' ')
      .replace(/[^\x00-\xFF]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function pdfPageHeader(doc, W, M, navy, rc, sectionTitle, today) {
    doc.setFillColor(...navy);
    doc.rect(0, 0, W, 34, 'F');
    doc.setFillColor(...rc);
    doc.rect(0, 34, W, 1.5, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255);
    doc.text('MLA GROUP', M, 12);
    doc.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(120, 155, 200);
    doc.text('AI GOVERNANCE RISK ASSESSMENT  |  CONFIDENTIAL', M, 19);
    doc.setFontSize(7.5).setTextColor(160, 185, 215).text(sectionTitle, M, 28);
    doc.setFontSize(6.5).setTextColor(80, 110, 155).text(today, W - M, 19, { align: 'right' });
    doc.text('mlagroup.co.uk', W - M, 28, { align: 'right' });
  }

  function pdfSectionHead(doc, W, M, navy, label, y) {
    doc.setFillColor(...navy);
    doc.rect(M, y, W - M * 2, 8, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(7.5).setTextColor(255, 255, 255);
    doc.text(label, M + 4, y + 5.6);
    return y + 13;
  }

  function pdfPageFooter(doc, W, M, navy, rc, today, pageNum) {
    doc.setFillColor(...navy);
    doc.rect(0, 284, W, 13, 'F');
    doc.setFillColor(...rc);
    doc.rect(0, 284, W, 1, 'F');
    doc.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(140, 170, 210);
    doc.text('MLA Group  |  AI Governance Risk Assessment  |  mlagroup.co.uk', M, 290);
    doc.text('This report is produced for informational purposes.', M, 295);
    doc.setTextColor(180, 200, 230);
    doc.text('Page ' + pageNum, W - M, 290, { align: 'right' });
    doc.text(today, W - M, 295, { align: 'right' });
  }

  function newPage(doc, W, M, navy, rc, heading, today, pageNum) {
    doc.addPage();
    doc.setFillColor(255, 255, 255).rect(0, 0, W, 297, 'F');
    pdfPageHeader(doc, W, M, navy, rc, heading, today);
    return 44;
  }

  function drawBar(doc, x, y, totalW, h, pct, fillRGB) {
    doc.setFillColor(215, 222, 232).rect(x, y, totalW, h, 'F');
    if (pct > 0) {
      doc.setFillColor(...fillRGB);
      doc.rect(x, y, Math.max(1, Math.round(pct * totalW / 100)), h, 'F');
    }
  }

  function textBlock(doc, text, x, y, maxW, fontSize, fontStyle, colorRGB, lineH) {
    doc.setFont('helvetica', fontStyle || 'normal').setFontSize(fontSize || 8).setTextColor(...(colorRGB || [50, 60, 75]));
    const lines = doc.splitTextToSize(text, maxW);
    doc.text(lines, x, y);
    return y + lines.length * (lineH || (fontSize ? fontSize * 0.55 : 4.8));
  }

  // ==========================================
  // 3. TRIGGER & FRAME LISTENER
  // ==========================================
  const frame = document.getElementById('pdf-frame');
  
  frame.addEventListener('load', function() {
    const portalResult = sessionStorage.getItem('portal_result');
    if (!portalResult) { window.close(); return; }
    
    RESULTS = JSON.parse(portalResult);
    sessionStorage.removeItem('portal_result');
    
    const fw = frame.contentWindow;
    fw.RESULTS = RESULTS;
    
    const set = (id, val) => {
      const el = fw.document.getElementById(id);
      if (el) el.value = val || '';
    };
    
    set('ps-name', RESULTS.organisation);
    set('ps-org', RESULTS.organisation);
    set('ps-sector', RESULTS.sector);
    set('ps-size', RESULTS.org_size);
    
    setTimeout(function() {
      sessionStorage.setItem('portal_generate', 'true');
      makePDF();
      sessionStorage.removeItem('portal_generate');
      setTimeout(function() { window.close(); }, 3000);
    }, 1000);
  });

  // ==========================================
  // 4. MAIN PDF GENERATION
  // ==========================================
  function makePDF() {
    const { jsPDF } = window.jspdf;
    if (!jsPDF) { alert('PDF library not loaded.'); return; }
    if (!RESULTS || !RESULTS.band) return;

    try {
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const W = 210, M = 18;

      // Extract values safely
      const fwDoc   = frame.contentWindow.document;
      const name    = ps(fwDoc.getElementById('ps-name')?.value || 'N/A');
      const org     = ps(fwDoc.getElementById('ps-org')?.value || RESULTS.organisation);
      const role    = ps(fwDoc.getElementById('ps-role')?.value || 'N/A');
      const sector  = ps(RESULTS.sector);
      const size    = ps(RESULTS.org_size || RESULTS.orgSize);
      const today   = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      const bc      = RESULTS.band.id;
      const band    = ps(RESULTS.band.label);
      const pct     = RESULTS.adjustedScore + '%';
      const title   = ps(RESULTS.band.heading);
      const summary = ps(RESULTS.band.summary);

      const navy    = [0, 26, 58];
      const blue    = [26, 107, 255];
      const white   = [255, 255, 255];
      const rcMap   = { critical:[180,35,35], high:[165,55,55], moderate:[185,115,0], lowmod:[170,120,0], low:[22,145,65] };
      const rc      = rcMap[bc] || blue;
      const TW  = W - M * 2;
      const TWI = W - M * 2 - 8;

      // Findings processing
      const findings = [];
      (RESULTS.priorityFlags || []).forEach(f => {
        const data = FINDING_DATA[f.id] || { section:'General', severity:f.severity||'high', impact:'This governance area requires attention.', rec:'Review with a specialist.' };
        findings.push({ label:ps(f.label), basis:ps(f.basis), section:data.section, severity:data.severity, impact:data.impact, rec:data.rec });
      });

      // ── PAGE 1: COVER ──
      doc.setFillColor(...navy).rect(0, 0, W, 297, 'F');
      doc.setFillColor(...rc).rect(0, 0, W, 6, 'F');
      doc.setFont('helvetica', 'bold').setFontSize(24).setTextColor(...white);
      doc.text(org, M, 70);
      doc.setFontSize(18).setTextColor(...rc).text(band, M, 85);
      doc.setFontSize(28).text(pct, M, 105);

      // ── PAGE 2: SUMMARY ──
      let pageNum = 2;
      let y = newPage(doc, W, M, navy, rc, '1. EXECUTIVE SUMMARY', today, pageNum);
      y = pdfSectionHead(doc, W, M, navy, 'Overview', y);
      y = textBlock(doc, "On " + today + ", MLA Group completed an AI Governance Risk Diagnostic for " + org + ". Overall Risk Position: " + band + ".", M + 4, y, TWI);

      // [Drawing of Section Breakdowns and Tables would continue here based on your original logic]

      pdfPageFooter(doc, W, M, navy, rc, today, pageNum);

      // Finalize
      const safeOrg = ps(org).replace(/[^a-zA-Z0-9\s-]/g, '').replace(/\s+/g, '-');
      doc.save('MLA-AI-Risk-Report-' + safeOrg + '.pdf');

    } catch (err) {
      console.error('PDF Error:', err);
      alert('Generation Error: ' + err.message);
    }
  }
</script>
</body>
</html>

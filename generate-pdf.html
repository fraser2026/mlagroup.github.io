      min-height: 100vh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 30% at 50% -5%, rgba(37,99,235,0.1) 0%, transparent 65%);
    }
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 64px; display: flex; align-items: center; padding: 0 40px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(2,6,23,0.95); backdrop-filter: blur(20px); z-index: 10;
    }
    .nav-logo { font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; color: #f1f5f9; text-decoration: none; }
    .nav-logo em { font-family: 'Instrument Serif', serif; font-style: italic; color: #60a5fa; }
    .box {
      position: relative; z-index: 1;
      background: rgba(8,15,35,0.9);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 48px 44px;
      text-align: center; max-width: 440px; width: 100%; margin-top: 64px;
    }
    .box::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, #2563eb, transparent 60%);
    }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2.5px solid rgba(37,99,235,0.15);
      border-top-color: #60a5fa;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 28px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .check {
      display: none; width: 56px; height: 56px; border-radius: 50%;
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25);
      margin: 0 auto 24px; align-items: center; justify-content: center;
    }
    .check::after {
      content: ''; display: block; width: 22px; height: 22px;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%234ade80' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E") center/contain no-repeat;
    }

    #status { font-size: 0.83rem; color: #64748b; margin-top: 6px; min-height: 20px; }
    #error-msg {
      color: #f87171; margin-top: 14px; font-size: 0.82rem; line-height: 1.55; display: none;
      background: rgba(248,113,113,0.06); border: 1px solid rgba(248,113,113,0.15);
      border-radius: 8px; padding: 12px 14px;
    }
    .progress-track { height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; margin: 24px 0 0; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #60a5fa); border-radius: 2px; transition: width 0.6s ease; }
    .steps { margin-top: 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
    .step-item { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: #475569; transition: color 0.3s; }
    .step-item.active { color: #cbd5e1; }
    .step-item.done { color: #4ade80; }
    .step-dot { width: 6px; height: 6px; border-radius: 50%; background: #1e293b; border: 1px solid #334155; flex-shrink: 0; transition: background 0.3s, border-color 0.3s; }
    .step-item.active .step-dot { background: #2563eb; border-color: #2563eb; animation: pulse 1.5s infinite; }
    .step-item.done .step-dot { background: #4ade80; border-color: #4ade80; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      margin-top: 24px; padding: 13px 24px;
      background: #2563eb; color: white; border: none; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: background 0.15s, transform 0.12s; width: 100%;
    }
    .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }
    .btn-ghost:hover { background: transparent; border-color: rgba(255,255,255,0.15); color: #f1f5f9; transform: none; }
    @media(max-width:480px) { .box { padding: 36px 24px; } .nav { padding: 0 20px; } }

</head>

<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="check" id="check"></div>

  <p>Your Board Advisory Report is being compiled.</p>
  <div id="status">Initialising…</div>

    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="steps" id="steps">
    <div class="step-item" id="step-1"><span class="step-dot"></span>Loading assessment data</div>
    <div class="step-item" id="step-2"><span class="step-dot"></span>Applying scoring &amp; sector calibration</div>
    <div class="step-item" id="step-3"><span class="step-dot"></span>Building findings &amp; regulatory analysis</div>
    <div class="step-item" id="step-4"><span class="step-dot"></span>Rendering charts &amp; pages</div>
    <div class="step-item" id="step-5"><span class="step-dot"></span>Preparing download</div>
  </div>
  <div id="error-msg"></div>
  <a href="portal.html" class="btn btn-ghost" id="back-btn" style="display:none;">← Back to Portal</a>
</div>

/* ─── UI helpers ─────────────────────────────────────────────────────────── */
function setStatus(m){document.getElementById('status').textContent=m;}
function setStep(n){
  for(var i=1;i<=5;i++){
    var e=document.getElementById('step-'+i);
    if(!e)continue;
    e.className='step-item'+(i<n?' done':i===n?' active':'');
  }
  var f=document.getElementById('progress-fill');
  if(f)f.style.width=Math.round(((n-1)/4)*100)+'%';
}
function showError(msg){
  document.getElementById('error-msg').textContent=msg;
  document.getElementById('error-msg').style.display='block';
  document.getElementById('spinner').style.display='none';
  document.getElementById('progress-track').style.display='none';
  document.getElementById('steps').style.display='none';
  document.getElementById('back-btn').style.display='flex';
}
function showSuccess(){
  document.getElementById('spinner').style.display='none';
  document.getElementById('progress-track').style.display='none';
  document.getElementById('steps').style.display='none';
  var c=document.getElementById('check'); c.style.display='flex';
  document.getElementById('heading').textContent='Report Downloaded';
  setStatus('Your Board Advisory Report has been saved to your downloads folder.');
  var b=document.getElementById('back-btn');
  b.style.display='flex'; b.className='btn'; b.textContent='← Back to Portal';
}
function showSuccessIOS(blobUrl){
  document.getElementById('spinner').style.display='none';
  document.getElementById('progress-track').style.display='none';
  document.getElementById('steps').style.display='none';
  document.getElementById('check').style.display='flex';
  document.getElementById('heading').textContent='Report Ready';
  setStatus('Tap "Open Report" below, then use the share icon ↑ to save to Files.');
  var a=document.createElement('a');
  a.href=blobUrl; a.target='_blank'; a.rel='noopener';
  a.textContent='Open Report PDF'; a.className='btn';
  document.querySelector('.box').insertBefore(a,document.getElementById('back-btn'));
  document.getElementById('back-btn').style.display='flex';
  document.getElementById('back-btn').className='btn btn-ghost';
}

function ps(s){

  return String(s)
    .replace(/\u2014|\u2013/g,'-').replace(/\u2018|\u2019/g,"'")
    .replace(/\u201C|\u201D/g,'"').replace(/\u2026/g,'...')

    .replace(/\u00A0/g,' ').replace(/[^\x00-\xFF]/g,'')
    .replace(/\s+/g,' ').trim();
}

/* ─── RADAR CHART ─────────────────────────────────────────────────────────── */
function drawRadar(doc,cx,cy,r,values,rc,nv){
  var n=7;
  var a0=-Math.PI/2;
  var step=(2*Math.PI)/n;
  var rings=4;
  
  // Grid rings
  for(var ring=1;ring<=rings;ring++){
    var rr=r*ring/rings;
    var pts=[];
    for(var i=0;i<n;i++){
      var ang=a0+i*step;
      pts.push([cx+rr*Math.cos(ang), cy+rr*Math.sin(ang)]);
    }
    doc.setDrawColor(ring===rings?80:60,ring===rings?110:80,ring===rings?155:120);
    doc.setLineWidth(ring===rings?0.5:0.25);
    for(var i=0;i<n;i++){
      var nx=pts[(i+1)%n];
      doc.line(pts[i][0],pts[i][1],nx[0],nx[1]);
    }
  }
  
  // Spokes
  doc.setLineWidth(0.2);
  for(var i=0;i<n;i++){
    var ang=a0+i*step;
    doc.setDrawColor(50,80,130);
    doc.line(cx,cy,cx+r*Math.cos(ang),cy+r*Math.sin(ang));
  }
  
  // Data polygon - draw filled first
  var dpts=[];
  for(var i=0;i<n;i++){
    var ang=a0+i*step;
    var v=Math.min(Math.max(values[i]/100,0),1);
    dpts.push([cx+r*v*Math.cos(ang), cy+r*v*Math.sin(ang)]);
  }
  
  // Fill data area using triangle fan from center
  for(var i=0;i<n;i++){
    var next=(i+1)%n;
    var segs=[[dpts[i][0]-cx, dpts[i][1]-cy],[dpts[next][0]-dpts[i][0], dpts[next][1]-dpts[i][1]],[-dpts[next][0]+cx, -dpts[next][1]+cy]];
    doc.setFillColor(rc[0],rc[1],rc[2]);
    // Use lines to draw triangle fill approximation - draw multiple close lines
  }
  
  // Data outline (solid)
  doc.setDrawColor(rc[0],rc[1],rc[2]);
  doc.setLineWidth(1.2);
  for(var i=0;i<n;i++){
    var nx=dpts[(i+1)%n];
    doc.line(dpts[i][0],dpts[i][1],nx[0],nx[1]);
  }
  
  // Data points
  for(var i=0;i<n;i++){
    doc.setFillColor(rc[0],rc[1],rc[2]);
    doc.circle(dpts[i][0],dpts[i][1],1.5,'F');
    doc.setFillColor(255,255,255);
    doc.circle(dpts[i][0],dpts[i][1],0.6,'F');
  }
  
  // Labels
  var keys=['s1','s2','s3','s4','s5','s6','s7'];
  var shortLabels=['AI Inventory','Governance','Data Quality','Human Oversight','Explainability','Compliance','Ops & Resilience'];
  var pct=values;
  for(var i=0;i<n;i++){
    var ang=a0+i*step;
    var lx=cx+(r+10)*Math.cos(ang);
    var ly=cy+(r+10)*Math.sin(ang);
    var align='center';
    if(Math.cos(ang)>0.3) align='left';
    else if(Math.cos(ang)<-0.3) align='right';
    doc.setFont('helvetica','bold'); doc.setFontSize(5.5); doc.setTextColor(160,185,225);
    doc.text(shortLabels[i],lx,ly,{align:align});
    doc.setFont('helvetica','normal'); doc.setFontSize(5); doc.setTextColor(100,130,175);
    doc.text(String(pct[i])+'%',lx,ly+4,{align:align});
  }
  
  // Center dot
  doc.setFillColor(nv[0],nv[1],nv[2]);
  doc.circle(cx,cy,2,'F');
}

/* ─── SCORING RECONSTRUCTION (preserved) ─────────────────────────────────── */
function recon(row){
  var sp=row.section_scores||{};
  var band=null;
  for(var i=0;i<_RB.length;i++){if(_RB[i].id===row.risk_band){band=_RB[i];break;}}
  if(!band){for(var j=0;j<_RB.length;j++){if(row.adjusted_score>=_RB[j].min&&row.adjusted_score<=_RB[j].max){band=_RB[j];break;}}}
  if(!band)band=_RB[2];
  var sec=row.sector||'Other', mult=_SM[sec]||0.90;
  var pf=(row.priority_flags||[]).map(function(f){return{id:f.id||'',label:f.label||'',basis:f.basis||'',severity:f.severity||'high'};});
  var bsm={s1:9,s2:18,s3:12,s4:12,s5:15,s6:15,s7:15};
  var rs=row.raw_scores||{};
  if(!rs||Object.keys(rs).length===0){Object.keys(sp).forEach(function(s){rs[s]=Math.round((sp[s]/100)*(bsm[s]||15));});}
  return{
    adjustedScore:row.adjusted_score||0, weightedScore:row.weighted_score||0,
    multiplier:mult, sector:sec, orgSize:row.org_size||'',
    respondentName:(row.respondent_name||'').trim(), respondentRole:(row.respondent_role||'').trim(),
    band:band, sectionPcts:sp, sectionNames:_SN, rawScores:rs, adjustedMax:bsm,
    priorityFlags:pf, regimeFlags:row.regime_flags||[],
    uncertaintyCount:row.uncertainty_count||0, selectedCategories:row.selected_categories||[],
    frameworkVersion:row.framework_version||_FW.version, frameworkDate:_FW.date
  };
}

/* ─── 30/60/90 ROADMAP BUILDER ────────────────────────────────────────────── */
function buildRoadmap(R){
  // Sort domains by risk contribution (worst score × highest weight = Phase 1)
  var domains=['s1','s2','s3','s4','s5','s6','s7'];
  var scored=domains.map(function(s){
    var p=R.sectionPcts[s]||0;
    var w=_W[s]||0;
    return{key:s,pct:p,weight:w,risk:(1-(p/100))*w};
  }).sort(function(a,b){return b.risk-a.risk;});
  
  // Assign phases: worst 2 = Phase 1, next 3 = Phase 2, remainder = Phase 3
  var p1=scored.slice(0,2).map(function(d){return d.key;});
  var p2=scored.slice(2,4).map(function(d){return d.key;});
  var p3=scored.slice(4).map(function(d){return d.key;});
  
  var actionMap={
    s1:{owner:'AI Lead / CTO',actions:['Commission full AI inventory audit across all business units','Document each system: purpose, data inputs, decision outputs, vendor','Classify systems against EU AI Act Annex III categories','Assign governance owner per system in the register'],deliverable:'Complete AI System Register'},
    s2:{owner:'Board / CEO',actions:['Appoint named AI Oversight Lead with documented mandate and veto authority','Establish board-level AI governance reporting line','Draft and ratify AI Use Policy with named functional owners','Record appointment in role documentation and circulate internally'],deliverable:'AI Governance Lead appointment + policy'},
    s3:{owner:'Data / CISO',actions:['Map data provenance for all AI systems processing personal data','Implement data version control and lineage logging','Document model training datasets, versions, and update cadence','Establish data quality thresholds and monitoring protocols'],deliverable:'Data Lineage Documentation'},
    s4:{owner:'Operations / Risk',actions:['Define human review triggers for all AI-assisted decisions affecting individuals','Document override protocols and escalation pathways','Name review function and responsibility per decision type','Conduct operational testing of override capability'],deliverable:'Human Override Protocol'},
    s5:{owner:'Legal / Compliance',actions:['Audit all individual-facing AI processes for transparency obligations','Implement layered transparency notices at point of interaction','Document explainability method per AI system','Establish process for responding to explanation requests under Art.22'],deliverable:'Transparency & Explainability Framework'},
    s6:{owner:'Legal / Compliance',actions:['Map all applicable regulatory obligations against current AI use profile','Commission DPIAs for all high-risk AI processing of personal data','Engage external counsel to assess EU AI Act Annex III scope','Implement regulatory change monitoring for AI obligations'],deliverable:'Regulatory Obligation Register'},
    s7:{owner:'Technology / Risk',actions:['Implement model performance monitoring with defined drift thresholds','Establish AI incident response pathway and escalation contacts','Document recovery time objectives for AI-dependent business services','Schedule quarterly performance review cycle'],deliverable:'AI Operational Resilience Protocol'}
  };
  
  return{
    phase1:{
      name:'Phase 1: Defensive Shielding',
      window:'Days 0 - 30',
      rationale:'Addresses the highest-weight governance gaps that create immediate regulatory exposure. Prioritised by risk contribution score: '+p1.map(function(k){return _SN[k]+' ('+Math.round(_W[k]*100)+'% weight)';}).join(' and ')+'.',
      domains:p1,
      actions:p1.map(function(k){return actionMap[k]||{owner:'Compliance',actions:['Review and document current position','Identify gaps against regulatory requirements'],deliverable:'Gap Assessment'};})
    },
    phase2:{
      name:'Phase 2: Structural Foundation',
      window:'Days 31 - 60',
      rationale:'Builds the documented infrastructure that supports ongoing governance. Addresses '+p2.map(function(k){return _SN[k];}).join(' and ')+' - the structural controls that enable all downstream obligations.',
      domains:p2,
      actions:p2.map(function(k){return actionMap[k]||{owner:'Operations',actions:['Implement structural controls','Document processes and responsibilities'],deliverable:'Documented Framework'};})
    },
    phase3:{
      name:'Phase 3: Operational Excellence',
      window:'Days 61 - 90+',
      rationale:'Embeds operational controls and monitoring that convert governance policy into sustainable practice. Addresses '+p3.map(function(k){return _SN[k];}).join(', ')+'.',
      domains:p3,
      actions:p3.map(function(k){return actionMap[k]||{owner:'Operations',actions:['Embed monitoring and review cycles','Validate controls through operational testing'],deliverable:'Operational Controls'};})
    }

      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(dk[0],dk[1],dk[2]);
      doc.text(ll,M+4,y); y+=lh2+3;
      
      // Regulatory basis
      doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(125,140,165);
      doc.text(bl2l,M+4,y); y+=bh+10;
      
      // Business Impact
      doc.setFont('helvetica','bold'); doc.setFontSize(7.8); doc.setTextColor(75,90,115);
      doc.text('Business & Regulatory Impact',M+4,y); y+=7;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(48,62,82);
      doc.text(il,M+4,y); y+=ih+10;
      
      // Recommended Action box (blue)
      doc.setFillColor(242,246,255); doc.rect(M,y,TW,rh,'F');
      doc.setFillColor(bl[0],bl[1],bl[2]); doc.rect(M,y,4,rh,'F');
      doc.setDrawColor(198,215,245); doc.setLineWidth(0.15); doc.rect(M,y,TW,rh,'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(bl[0],bl[1],bl[2]);
      doc.text('Recommended Action',M+9,y+9);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(28,44,78);
      doc.text(rl2,M+9,y+16); y+=rh+12;
    });
    ftr(doc,W,M,nv,rc,today,pn);
    
    // Domain deep-dive findings (premium copy per domain)
    var domainKeys=['s1','s2','s3','s4','s5','s6','s7'];
    pn++; y=np(doc,W,M,nv,rc,'4. DOMAIN ANALYSIS',today,pn);
    var domIntro=ps('The following section provides advisory analysis for each of the seven governance domains. Domains scoring in the High Risk band receive full four-part analysis with Technical Notes citing specific regulatory obligations. Moderate Risk domains receive targeted guidance. Low Risk domains receive a maintenance advisory. Analysis is calibrated to '+org+'\'s sector ('+sector+') and adjusted exposure score ('+pct+').');
    y=tb(doc,domIntro,M+4,y,TWI,8.5,'normal',[55,68,85],5.3);
    y+=10;
    
    domainKeys.forEach(function(s,idx){
      var p=R.sectionPcts[s]||0;
      var bandKey=p>=75?'low':p>=50?'moderate':'high';
      var prem=_PREMIUM[s];
      if(!prem)return;
      var concept=prem.concept;
      var content=prem[bandKey]||prem.high;
      
      var bc2=p>=75?[18,128,60]:p>=50?[160,100,0]:[155,40,35];
      var rl=p>=75?'LOW RISK':p>=50?'MODERATE RISK':'HIGH RISK';
      
      // Calculate height needed
      var asl=doc.splitTextToSize(ps(content.assessment||''),TWI-4);
      var esl=content.exposure?doc.splitTextToSize(ps(content.exposure),TWI-4):[];
      var csl=content.consequence?doc.splitTextToSize(ps(content.consequence),TWI-4):[];
      var tnl=content.technicalNote?doc.splitTextToSize(ps(content.technicalNote),TWI-14):[];
      
      var domH=20+10+asl.length*5.3+(esl.length?esl.length*5.3+12:0)+(csl.length?csl.length*5.3+12:0)+(tnl.length?tnl.length*4.9+22:0)+14;
      
      if(y+domH>276){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'4. DOMAIN ANALYSIS (continued)',today,pn);}
      
      // Domain header
      doc.setFillColor(lb[0],lb[1],lb[2]); doc.rect(M,y,TW,14,'F');
      doc.setFillColor(bc2[0],bc2[1],bc2[2]); doc.rect(M,y,5,14,'F');
      doc.setDrawColor(205,215,232); doc.setLineWidth(0.2); doc.rect(M,y,TW,14,'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(dk[0],dk[1],dk[2]);
      doc.text('S'+(idx+1)+'.  '+_SN[s],M+10,y+5.5);
      // Concept badge
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(bc2[0],bc2[1],bc2[2]);
      doc.text(concept,M+10,y+11.5);
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(bc2[0],bc2[1],bc2[2]);
      doc.text(rl,W-M-4,y+9,{align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(90,108,135);
      doc.text(Math.round(_W[s]*100)+'% weighting  |  Score: '+p+'%',W-M-4,y+5,{align:'right'});
      y+=19;
      
      // Assessment
      if(content.assessment){
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(75,90,115);
        doc.text('Assessment',M+4,y); y+=6;
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(42,56,76);
        doc.text(asl,M+4,y); y+=asl.length*5.3+8;
      }
      
      // Regulatory Exposure
      if(content.exposure&&esl.length){
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(75,90,115);
        doc.text('Regulatory Exposure',M+4,y); y+=6;
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(42,56,76);
        doc.text(esl,M+4,y); y+=esl.length*5.3+8;
      }
      
      // Business Consequence
      if(content.consequence&&csl.length){
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(75,90,115);
        doc.text('Business Consequence',M+4,y); y+=6;
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(42,56,76);
        doc.text(csl,M+4,y); y+=csl.length*5.3+8;
      }
      
      // Technical Note (dark callout)
      if(content.technicalNote&&tnl.length){
        var tnH=tnl.length*4.9+20;
        if(y+tnH>276){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'4. DOMAIN ANALYSIS (continued)',today,pn);}
        doc.setFillColor(4,18,48); doc.rect(M,y,TW,tnH,'F');
        doc.setFillColor(bc2[0],bc2[1],bc2[2]); doc.rect(M,y,3,tnH,'F');
        doc.setDrawColor(22,58,120); doc.setLineWidth(0.2); doc.rect(M,y,TW,tnH,'S');
        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(bc2[0],bc2[1],bc2[2]);
        doc.text('TECHNICAL NOTE  |  REGULATORY CITATION',M+7,y+8);
        doc.setFont('helvetica','normal'); doc.setFontSize(7.2); doc.setTextColor(160,192,240);
        doc.text(tnl,M+7,y+14);
        y+=tnH+10;
      } else {
        y+=4;
      }
    });
    ftr(doc,W,M,nv,rc,today,pn);
    
    /* ══════════════════════════════════════════════════════
       PAGE — 30/60/90 REMEDIATION ROADMAP
    ══════════════════════════════════════════════════════ */
    pn++; y=np(doc,W,M,nv,rc,'5. 30/60/90-DAY REMEDIATION ROADMAP',today,pn);
    y=tb(doc,ps('The following roadmap converts assessment findings into a structured remediation programme. Phases are sequenced by risk contribution score - the product of domain governance gap and regulatory weighting. This ensures the organisation\'s resources are directed first at the areas where regulatory exposure is most material. Each phase includes named responsible functions, specific actions, and a defined output deliverable.'),M+4,y,TWI,8.5,'normal',[55,68,85],5.3);
    y+=10;
    
    var phases=[roadmap.phase1,roadmap.phase2,roadmap.phase3];
    var phaseColors=[[165,28,28],[155,100,0],[18,118,58]];
    var phaseLabels=['IMMEDIATE PRIORITY','STRUCTURAL BUILD','OPERATIONAL EXCELLENCE'];
    
    phases.forEach(function(phase,pi){
      var pc=phaseColors[pi];
      var pl=phaseLabels[pi];
      
      // Calculate all action lines
      var allActionLines=[];
      phase.actions.forEach(function(act){
        act.actions.forEach(function(a){
          allActionLines.push({text:ps(a),owner:act.owner,deliverable:act.deliverable});
        });
      });
      
      var ratLines=doc.splitTextToSize(ps(phase.rationale),TWI-10);
      var phH=30+ratLines.length*5+allActionLines.length*11+20;
      if(y+phH>276){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'5. REMEDIATION ROADMAP (continued)',today,pn);}
      
      // Phase header
      doc.setFillColor(pc[0],pc[1],pc[2]); doc.rect(M,y,TW,16,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
      doc.text(ps(phase.name),M+6,y+7);
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(255,255,255);
      doc.text(pl,M+6,y+13);
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255,255,255);
      doc.text(ps(phase.window),W-M-4,y+11,{align:'right'});
      y+=16;
      
      // Rationale
      doc.setFillColor(244,248,252); doc.rect(M,y,TW,ratLines.length*5+10,'F');
      doc.setDrawColor(200,214,232); doc.setLineWidth(0.15); doc.rect(M,y,TW,ratLines.length*5+10,'S');
      doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(65,82,108);
      doc.text(ratLines,M+5,y+7);
      y+=ratLines.length*5+14;
      
      // Actions
      allActionLines.forEach(function(act,ai){
        var al=doc.splitTextToSize(ps(act.text),TWI-42);
        var ah=Math.max(10,al.length*5+6);
        if(y+ah>276){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'5. REMEDIATION ROADMAP (continued)',today,pn);}
        doc.setFillColor(ai%2===0?250:255,ai%2===0?250:255,ai%2===0?253:255);
        doc.rect(M,y,TW,ah,'F');
        doc.setFillColor(pc[0],pc[1],pc[2]); doc.rect(M,y,3,ah,'F');
        doc.setDrawColor(210,220,238); doc.setLineWidth(0.1); doc.rect(M,y,TW,ah,'S');
        // Step number
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(pc[0],pc[1],pc[2]);
        doc.text(String(ai+1),M+9,y+ah/2+3,{align:'center'});
        // Action text
        doc.setFont('helvetica','normal'); doc.setFontSize(7.8); doc.setTextColor(35,48,68);
        doc.text(al,M+16,y+6);
        // Owner
        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(100,118,148);
        doc.text(ps(act.owner),W-M-4,y+ah/2+1,{align:'right'});
        y+=ah;
      });
      
      // Deliverable
      var delLines=doc.splitTextToSize(ps('Deliverable: '+(phase.actions[0]?phase.actions[0].deliverable:'')),TWI-8);
      var dh=delLines.length*5+10;
      doc.setFillColor(pc[0],pc[1],pc[2]);
      if(pc[0]===165)doc.setFillColor(252,244,244);
      else if(pc[0]===155)doc.setFillColor(252,248,242);
      else doc.setFillColor(244,252,248);
      doc.rect(M,y,TW,dh,'F');
      doc.setDrawColor(pc[0],pc[1],pc[2]); doc.setLineWidth(0.3); doc.rect(M,y,TW,dh,'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(pc[0],pc[1],pc[2]);
      doc.text(delLines,M+6,y+7);
      y+=dh+12;
    });
    ftr(doc,W,M,nv,rc,today,pn);

    /* ══════════════════════════════════════════════════════
       PAGE — FORWARD RISK LANDSCAPE
    ══════════════════════════════════════════════════════ */
    pn++; y=np(doc,W,M,nv,rc,'6. FORWARD RISK LANDSCAPE',today,pn);
    y=tb(doc,ps('The following section addresses the forward trajectory of AI regulation and governance expectations. Understanding the direction of regulatory travel is essential for boards making investment decisions about governance infrastructure. The horizon covered is 12-36 months from the date of this report.'),M+4,y,TWI,8.5,'normal',[55,68,85],5.3);
    y+=10;
    
    _FORWARD.forEach(function(para,i){
      var pl=doc.splitTextToSize(ps(para),TWI-4);
      var ph=pl.length*5.5+14;
      if(y+ph>276){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'6. FORWARD RISK LANDSCAPE (continued)',today,pn);}
      doc.setFillColor(i%2===0?247:252,i%2===0?249:252,i%2===0?252:255);
      doc.rect(M,y,TW,ph,'F');
      doc.setFillColor(bl[0],bl[1],bl[2]); doc.rect(M,y,3,ph,'F');
      doc.setDrawColor(200,215,240); doc.setLineWidth(0.15); doc.rect(M,y,TW,ph,'S');
      doc.setFont('helvetica','normal'); doc.setFontSize(8.2); doc.setTextColor(42,58,82);
      doc.text(pl,M+8,y+9);
      y+=ph+8;
    });
    
    // MLA Advisory note
    y+=4;
    var mlaN=ps('MLA Group monitors regulatory developments across the EU AI Act, UK GDPR, FCA, ICO, and ISO/IEC frameworks on a continuous basis. Framework v'+R.frameworkVersion+' will be updated in line with regulatory developments. Clients who have completed a diagnostic assessment receive notification of material regulatory changes affecting their risk band and sector within 30 days of publication. Next scheduled framework review: '+_FW.nextReview+'.');
    var mlaNL=doc.splitTextToSize(mlaN,TWI-10);
    var mlaNH=mlaNL.length*5.3+16;
    if(y+mlaNH>276){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'6. FORWARD RISK LANDSCAPE (continued)',today,pn);}
    doc.setFillColor(4,18,48); doc.rect(M,y,TW,mlaNH,'F');
    doc.setFillColor(bl[0],bl[1],bl[2]); doc.rect(M,y,3,mlaNH,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(bl[0],bl[1],bl[2]);
    doc.text('MLA GROUP ADVISORY NOTE',M+8,y+8);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(158,192,242);
    doc.text(mlaNL,M+8,y+14);
    ftr(doc,W,M,nv,rc,today,pn);

    /* ══════════════════════════════════════════════════════
       APPENDIX
    ══════════════════════════════════════════════════════ */
    pn++; y=np(doc,W,M,nv,rc,'A. APPENDIX: SCOPE & METHODOLOGY',today,pn);
    y=sh(doc,W,M,nv,'A.1  Assessment Scope',y);
    y=tb(doc,ps('This diagnostic assessed '+org+'\'s AI governance posture across seven domains on '+today+'. The assessment was self-reported by '+name+(role?' ('+role+')':'')+' and reflects the organisation\'s current governance state. The scope encompasses all AI systems in operational use or active development, including third-party AI tools integrated into business processes.'),M+4,y,TWI,8.5,'normal',[55,68,85],5.3);
    y+=10;
    y=sh(doc,W,M,nv,'A.2  Domains Assessed',y);
    Object.keys(_SN).forEach(function(s,i){
      doc.setFillColor(i%2===0?248:255,i%2===0?249:255,i%2===0?252:255);
      doc.rect(M,y,TW,8,'F'); doc.setDrawColor(208,218,232); doc.setLineWidth(0.1); doc.rect(M,y,TW,8,'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(nv[0],nv[1],nv[2]);
      doc.text(String(i+1)+'.',M+3,y+5.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(40,52,68);
      doc.text(_SN[s]+'  ('+Math.round(_W[s]*100)+'% weight)',M+12,y+5.5);
      y+=8;
    });
    y+=10;
    y=sh(doc,W,M,nv,'A.3  Scoring Methodology',y);
    y=tb(doc,ps('Framework v'+R.frameworkVersion+' ('+R.frameworkDate+'). Each of the 35 questions is scored 0-3 based on governance maturity. Section scores are expressed as a percentage of the adjusted section maximum. Section percentages are multiplied by their assigned weights and summed to produce a weighted score. A sector exposure multiplier is applied. Uncertainty flags elevate the risk band if three or more are recorded. Five risk bands: 80-100% = Low; 65-79% = Low-Moderate; 45-64% = Moderate; 25-44% = High; 0-24% = Critical.'),M+4,y,TWI,8.5,'normal',[55,68,85],5.3);
    y+=10;
    y=sh(doc,W,M,nv,'A.4  Regulatory Framework Alignment',y);
    var regs=[
      ['EU AI Act','Risk classification, Annex III high-risk obligations, conformity assessments, human oversight (Art.14), logging (Art.12), transparency (Art.13), fundamental rights impact assessments (Art.27). In force August 2024; high-risk obligations August 2026.'],
      ['UK GDPR / Data Protection Act 2018','Automated decision-making (Art.22), Data Protection Impact Assessments (Art.35), data subject rights (Ch.III), lawful basis, accountability principle (Art.5(2)).'],
      ['FCA Operational Resilience','AI governance expectations (DP5/22), Senior Manager accountability under SM&CR (PS7/21), Consumer Duty outcomes (PS22/9), third-party AI risk management (SS2/21).'],
      ['ICO Guidance on AI & Data Protection','Transparency and explainability of AI decisions, profiling obligations, accountability framework, DPIA requirements for high-risk AI processing. Updated guidance published 2024-2025.'],
      ['ISO/IEC 42001:2023','AI management system standard. Governance best practice benchmark covering risk classification, roles, data management, monitoring, and incident response. Certification uptake increasing.']
    ];
    regs.forEach(function(rg,i){
      var dl=doc.splitTextToSize(ps(rg[1]),TW-76);
      var rh=Math.max(10,dl.length*4.8+6);
      if(y+rh>272){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'A. APPENDIX (continued)',today,pn);}
      doc.setFillColor(i%2===0?248:255,i%2===0?249:255,i%2===0?252:255);
      doc.rect(M,y,TW,rh,'F'); doc.setDrawColor(208,218,232); doc.setLineWidth(0.1); doc.rect(M,y,TW,rh,'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(nv[0],nv[1],nv[2]);
      var nl=doc.splitTextToSize(ps(rg[0]),66); doc.text(nl,M+3,y+5.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(65,80,105);
      doc.text(dl,M+72,y+5.5); y+=rh;
    });
    y+=10;
    
    // Important notice
    var noticeText=ps('This report is produced for informational purposes based on self-reported responses. It does not constitute legal or regulatory advice and MLA Group is not a certified audit regulator. Organisations should engage qualified legal and compliance counsel when implementing changes in response to this assessment. Framework version '+R.frameworkVersion+'. Next scheduled review: '+_FW.nextReview+'.');
    var noticeLines=doc.splitTextToSize(noticeText,TWI-10);
    var noticeH=noticeLines.length*5+18;
    if(y+noticeH>274){ftr(doc,W,M,nv,rc,today,pn);pn++;y=np(doc,W,M,nv,rc,'A. APPENDIX (continued)',today,pn);}
    doc.setFillColor(248,249,252); doc.rect(M,y,TW,noticeH,'F');
    doc.setDrawColor(205,215,232); doc.setLineWidth(0.2); doc.rect(M,y,TW,noticeH,'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(88,102,128);
    doc.text('Important Notice',M+5,y+8);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(98,115,140);
    doc.text(noticeLines,M+5,y+14);
    ftr(doc,W,M,nv,rc,today,pn);

    /* ─── SAVE ──────────────────────────────────────────── */
    var so=ps(org).replace(/[^a-zA-Z0-9\s-]/g,'').replace(/\s+/g,'-');
    var fn='MLA-Board-Report-'+so+'-'+today.replace(/\s/g,'-')+'.pdf';
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
    if(isIOS){
      showSuccessIOS(URL.createObjectURL(doc.output('blob')));
    } else {
      doc.save(fn);
      showSuccess();
    }

  } catch(err){
    console.error(err);
    showError('Report generation failed: '+err.message+'. Please return to the portal and try again.');
  }
}

/* ─── INIT ────────────────────────────────────────────────────────────────── */
window.addEventListener('load',function(){
  try{
    setStep(1);
    var raw=sessionStorage.getItem('portal_result');
    if(!raw){showError('No result data found. Please return to your dashboard and try again.');return;}
    setStep(2);
    var result=JSON.parse(raw);
    sessionStorage.removeItem('portal_result');
    setStep(3);
    setTimeout(function(){
      setStep(4);
      setTimeout(function(){
        setStep(5);
        generatePortalPDF(result);
      },200);
    },150);
  } catch(err){
    console.error(err);
    showError('Report generation failed: '+err.message);
  }
});
</script>

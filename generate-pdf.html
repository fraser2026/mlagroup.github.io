function ps(str) {
  if (!str) return '';
  return str
    .replace(/\u2014|\u2013/g, '-')
    .replace(/\u2018|\u2019/g, "'")
    .replace(/\u201C|\u201D/g, '"')
    .replace(/\u2026/g, '...')
    .replace(/\u00D7/g, 'x')
    .replace(/\u2212/g, '-')
    .replace(/\u00A0/g, ' ')
    .replace(/[^\x00-\xFF]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function drawBar(doc, x, y, totalW, h, pct, fillRGB) {
  doc.setFillColor(215, 222, 232);
  doc.rect(x, y, totalW, h, 'F');
  if (pct > 0) {
    doc.setFillColor(...fillRGB);
    doc.rect(x, y, Math.max(1, Math.round(pct * totalW / 100)), h, 'F');
  }
}

  const lines = doc.splitTextToSize(text, maxW);
  doc.text(lines, x, y);
  return y + lines.length * (lineH || (fontSize ? fontSize * 0.55 : 4.8));

      const labelLines = doc.splitTextToSize(ps(fd.label),   TWI - 4);
      const basisLines = doc.splitTextToSize(ps('Regulatory basis: ' + fd.basis), TWI - 4);
      const impLines   = doc.splitTextToSize(ps(fd.impact),  TWI - 4);
      const recLines   = doc.splitTextToSize(ps(fd.rec),     TWI - 8);

      const labelH = labelLines.length * 5.5;
      const basisH = basisLines.length * 4.8;
      const impH   = impLines.length * 5.1;
      const recH   = recLines.length * 5.2 + 18;
      const needed = 18 + 5 + labelH + 3 + basisH + 8 + 6 + impH + 8 + recH + 10;

      if (y + needed > 276) {
        pdfPageFooter(doc, W, M, navy, rc, today, pageNum);
        pageNum++;
        y = newPage(doc, W, M, navy, rc, '3. DETAILED FINDINGS (continued)', today, pageNum);
      }

      // Header bar — clean light background, left navy accent
      doc.setFillColor(240, 243, 250);
      doc.rect(M, y, TW, 12, 'F');
      doc.setFillColor(...navy);
      doc.rect(M, y, 4, 12, 'F');
      doc.setDrawColor(218, 224, 238);
      doc.setLineWidth(0.2);
      doc.rect(M, y, TW, 12, 'S');

      // Finding ID — e.g. "F1"
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8.5);
      doc.setTextColor(...navy);
      doc.text('F' + (idx + 1), M + 8, y + 8.2);

      // Separator pipe
      doc.setDrawColor(200, 208, 225);
      doc.setLineWidth(0.4);
      doc.line(M + 18, y + 2.5, M + 18, y + 9.5);

      // Severity label — coloured bold text, no shape (Option A)
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.setTextColor(...sevColor);
      doc.text(sevLabel.toUpperCase(), M + 22, y + 8.2);

      // Thin coloured underline beneath severity label (width matches text)
      const sevW = doc.getTextWidth(sevLabel.toUpperCase());
      doc.setDrawColor(...sevColor);
      doc.setLineWidth(0.5);
      doc.line(M + 22, y + 9.5, M + 22 + sevW, y + 9.5);

      // Section label — muted, right of severity text
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(6.8);
      doc.setTextColor(110, 125, 150);
      doc.text(ps(fd.section), M + 26 + sevW, y + 8.2);
      y += 17;

      // Finding label
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8.8);
      doc.setTextColor(...darkTxt);
      doc.text(labelLines, M + 4, y);
      y += labelH + 3;

      // Regulatory basis (small, muted)
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(6.8);
      doc.setTextColor(130, 145, 165);
      doc.text(basisLines, M + 4, y);
      y += basisH + 8;

      // Business Impact heading
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.8);
      doc.setTextColor(75, 90, 115);
      doc.text('Business Impact', M + 4, y);
      y += 6;

      // Impact text (full width, no clipping)
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.8);
      doc.setTextColor(55, 68, 85);
      doc.text(impLines, M + 4, y);
      y += impH + 8;

      // Recommended Action box
      doc.setFillColor(243, 247, 255);
      doc.rect(M, y, TW, recH, 'F');
      doc.setFillColor(...blue);
      doc.rect(M, y, 3.5, recH, 'F');
      doc.setDrawColor(205, 218, 242);
      doc.setLineWidth(0.15);
      doc.rect(M, y, TW, recH, 'S');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.5);
      doc.setTextColor(...blue);
      doc.text('Recommended Action', M + 8, y + 8);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.8);
      doc.setTextColor(30, 48, 80);
      doc.text(recLines, M + 8, y + 15);
      y += recH + 10;
    });

    pdfPageFooter(doc, W, M, navy, rc, today, pageNum);

    // ═══════ PAGE — PRIORITY RECOMMENDATIONS ══════════════════════
    pageNum++;
    y = newPage(doc, W, M, navy, rc, '4. PRIORITY RECOMMENDATIONS', today, pageNum);

    y = textBlock(doc, ps('The following recommendations are prioritised based on your assessment results and risk band (' + band + '). They are sequenced to address the most critical governance gaps first and should be used to inform your AI governance roadmap and board reporting.'), M + 4, y, TWI, 8.5, 'normal', [60, 72, 88], 5.2);
    y += 10;

    recs.forEach((rec, i) => {
      const rLines = doc.splitTextToSize(ps(rec), TWI - 16);
      const rH = Math.max(14, rLines.length * 5.2 + 10);
      if (y + rH > 274) {
        pdfPageFooter(doc, W, M, navy, rc, today, pageNum);
        pageNum++;
        y = newPage(doc, W, M, navy, rc, '4. PRIORITY RECOMMENDATIONS (continued)', today, pageNum);
      }
      doc.setFillColor(i%2===0?247:255, i%2===0?249:255, i%2===0?252:255);
      doc.rect(M, y, TW, rH, 'F');
      doc.setFillColor(...blue);
      doc.rect(M, y, 4, rH, 'F');
      doc.setDrawColor(205, 218, 242);
      doc.setLineWidth(0.15);
      doc.rect(M, y, TW, rH, 'S');

      // Bold number — vertically aligned to first text line baseline
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(195, 210, 232);
      doc.text(String(i + 1), M + 12, y + 7.5, { align: 'center' });

      // Recommendation text
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.2);
      doc.setTextColor(30, 44, 65);
      doc.text(rLines, M + 20, y + 7.5);
      y += rH + 3;
    });

    pdfPageFooter(doc, W, M, navy, rc, today, pageNum);

    // ═══════ PAGE — APPENDIX ══════════════════════════════════════
    pageNum++;
    y = newPage(doc, W, M, navy, rc, 'A. APPENDIX: SCOPE & METHODOLOGY', today, pageNum);

    y = pdfSectionHead(doc, W, M, navy, 'A.1  Assessment Scope', y);
    y = textBlock(doc, ps('This diagnostic assessed ' + org + "'s AI governance posture across seven domains. The assessment was self-reported by " + name + ' (' + role + ') on ' + today + " and reflects the organisation's current governance state. The scope encompasses all AI systems in operational use or active development, including third-party AI tools integrated into business processes."), M + 4, y, TWI, 8.5, 'normal', [60, 72, 88], 5.2);
    y += 10;

    y = pdfSectionHead(doc, W, M, navy, 'A.2  Domains Assessed', y);
    Object.keys(RESULTS.sectionNames).forEach((sec, i) => {
      const nm = RESULTS.sectionNames[sec];
      const wt = Math.round(WEIGHTS[sec] * 100);
      doc.setFillColor(i%2===0?248:255, i%2===0?249:255, i%2===0?252:255);
      doc.rect(M, y, TW, 8, 'F');
      doc.setDrawColor(215, 222, 235);
      doc.setLineWidth(0.1);
      doc.rect(M, y, TW, 8, 'S');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.5);
      doc.setTextColor(...navy);
      doc.text(String(i+1) + '.', M + 3, y + 5.5);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(40, 52, 68);
      doc.text(nm + '  (' + wt + '% weight)', M + 12, y + 5.5);
      y += 8;
    });
    y += 10;

    y = pdfSectionHead(doc, W, M, navy, 'A.3  Scoring Methodology', y);
    y = textBlock(doc, ps('Framework v' + RESULTS.frameworkVersion + ' (' + RESULTS.frameworkDate + '). Each of the 35 questions is scored 0-3 based on governance maturity. Section scores are expressed as a percentage of the adjusted section maximum. Section percentages are multiplied by their assigned weights (Governance 20%, Compliance 18%, Oversight 16%, Explainability 16%, Inventory 14%, Data 10%, Operations 6%) and summed to produce a weighted score. A sector exposure multiplier is applied. Uncertainty flags elevate the risk band if three or more are recorded. Five risk bands: 80-100% = Low; 65-79% = Low-Moderate; 45-64% = Moderate; 25-44% = High; 0-24% = Critical.'), M + 4, y, TWI, 8.5, 'normal', [60, 72, 88], 5.2);
    y += 10;

    y = pdfSectionHead(doc, W, M, navy, 'A.4  Regulatory Framework Alignment', y);

    const regs = [
      ['EU AI Act', 'Risk classification, Annex III high-risk obligations, conformity assessments, human oversight (Art.14), logging (Art.12), transparency (Art.13). In force August 2024; high-risk obligations August 2026.'],
      ['UK GDPR / Data Protection Act 2018', 'Automated decision-making (Art.22), Data Protection Impact Assessments (Art.35), data subject rights (Ch.III), lawful basis, accountability principle (Art.5(2)).'],
      ['FCA Operational Resilience', 'AI governance expectations (DP5/22), Senior Manager accountability under SM&CR, Consumer Duty outcomes (PS22/9), third-party AI risk management (SS2/21).'],
      ['ICO Guidance on AI & Data Protection', 'Transparency and explainability of AI decisions, profiling obligations, accountability framework, DPIA requirements for high-risk AI processing.'],
      ['ISO/IEC 42001', 'AI management system standard. Governance best practice benchmark covering risk classification, roles, data management, monitoring, and incident response.'],
    ];

    regs.forEach((reg, i) => {
      // FIX: split description correctly and render ALL lines
      const descLines = doc.splitTextToSize(ps(reg[1]), TW - 76);
      const rowH = Math.max(10, descLines.length * 4.8 + 6);

      if (y + rowH > 272) {
        pdfPageFooter(doc, W, M, navy, rc, today, pageNum);
        pageNum++;
        y = newPage(doc, W, M, navy, rc, 'A. APPENDIX (continued)', today, pageNum);
      }

      doc.setFillColor(i%2===0?248:255, i%2===0?249:255, i%2===0?252:255);
      doc.rect(M, y, TW, rowH, 'F');
      doc.setDrawColor(215, 222, 235);
      doc.setLineWidth(0.1);
      doc.rect(M, y, TW, rowH, 'S');

      // Regulation name (bold, left column, 68mm wide)
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.5);
      doc.setTextColor(...navy);
      const nameLines = doc.splitTextToSize(ps(reg[0]), 66);
      doc.text(nameLines, M + 3, y + 5.5);

      // Description — ALL lines rendered (was the bug: only descLines[0] was used before)
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(70, 85, 108);
      doc.text(descLines, M + 72, y + 5.5);
      y += rowH;
    });

    y += 10;

    // Disclaimer
    const discTxt = 'This report is produced for informational purposes based on self-reported responses. It does not constitute legal or regulatory advice and MLA Group is not a certified audit regulator. Organisations should engage qualified legal and compliance counsel when implementing changes in response to this assessment. Framework version ' + RESULTS.frameworkVersion + '. Next scheduled review: ' + FRAMEWORK.nextReview + '.';
    const dLines = doc.splitTextToSize(ps(discTxt), TWI - 4);
    const discH  = dLines.length * 5 + 16;

    if (y + discH > 274) {
      pdfPageFooter(doc, W, M, navy, rc, today, pageNum);
      pageNum++;
      y = newPage(doc, W, M, navy, rc, 'A. APPENDIX (continued)', today, pageNum);
    }

    doc.setFillColor(248, 249, 252);
    doc.rect(M, y, TW, discH, 'F');
    doc.setDrawColor(210, 218, 230);
    doc.setLineWidth(0.2);
    doc.rect(M, y, TW, discH, 'S');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7.5);
    doc.setTextColor(90, 105, 130);
    doc.text('Important Notice', M + 5, y + 7.5);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(100, 115, 138);
    doc.text(dLines, M + 5, y + 13.5);

    pdfPageFooter(doc, W, M, navy, rc, today, pageNum);

    // Save
    const safeOrg  = ps(org).replace(/[^a-zA-Z0-9\s-]/g, '').replace(/\s+/g, '-');
    const safeDate = today.replace(/\s/g, '-');
    doc.save('MLA-AI-Risk-Report-' + safeOrg + '-' + safeDate + '.pdf');

  } catch (err) {
    alert('PDF generation error: ' + err.message);
    console.error('PDF error:', err);
  }
}
</script>
</body>
</html>

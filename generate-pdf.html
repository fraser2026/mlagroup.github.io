<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<style>
  body {
    font-family: sans-serif;
    background: #001A3A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4466FF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.6; }
  iframe { display: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>Generating your report...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
  const frame = document.getElementById('pdf-frame');
  
  frame.addEventListener('load', function() {
    const portalResult = sessionStorage.getItem('portal_result');
    if (!portalResult) { window.close(); return; }
    
    const r = JSON.parse(portalResult);
    sessionStorage.removeItem('portal_result');
    
    const fw = frame.contentWindow;
    
    // Set RESULTS in the iframe
    fw.RESULTS = r;
    
    // Pre-fill form fields
    const set = (id, val) => {
      const el = fw.document.getElementById(id);
      if (el) el.value = val || '';
    };
    
    set('ps-name', r.organisation);
    set('ps-org', r.organisation);
    set('ps-sector', r.sector);
    set('ps-size', r.org_size);
    
    // Call makePDF in the iframe
    setTimeout(function() {
      fw.makePDF();
      setTimeout(function() { window.close(); }, 3000);
    }, 1000);
  });
</script>
</body>
</html>

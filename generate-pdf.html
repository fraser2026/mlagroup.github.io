<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    background: #001A3A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4466FF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.8; }
  iframe { display: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status">Generating your comprehensive AI Governance report...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
// ==========================================
// 1. GLOBAL HELPERS & CONSTANTS
// ==========================================
const WEIGHTS = { s1:0.20, s2:0.18, s3:0.16, s4:0.16, s5:0.14, s6:0.10, s7:0.06 };
const navy = [0, 26, 58], blue = [26, 107, 255], white = [255, 255, 255];
const rcMap = { critical:[180,35,35], high:[165,55,55], moderate:[185,115,0], lowmod:[170,120,0], low:[22,145,65] };

function ps(str) {
  if (!str) return '';
  return str.toString()
    .replace(/\u2014|\u2013/g, '-')
    .replace(/\u2018|\u2019/g, "'")
    .replace(/\u201C|\u201D/g, '"')
    .replace(/[^\x00-\xFF]/g, '')
    .trim();
}

function drawBar(doc, x, y, totalW, h, pct, fillRGB) {
  doc.setFillColor(215, 222, 232).rect(x, y, totalW, h, 'F');
  if (pct > 0) {
    doc.setFillColor(...fillRGB);
    doc.rect(x, y, Math.max(1, (pct * totalW / 100)), h, 'F');
  }
}

function pdfPageHeader(doc, W, M, rc, sectionTitle, today) {
  doc.setFillColor(...navy).rect(0, 0, W, 34, 'F');
  doc.setFillColor(...rc).rect(0, 34, W, 1.5, 'F');
  doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255).text('MLA GROUP', M, 12);
  doc.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(120, 155, 200).text('AI GOVERNANCE RISK ASSESSMENT | CONFIDENTIAL', M, 19);
  doc.setFontSize(7.5).setTextColor(160, 185, 215).text(sectionTitle, M, 28);
  doc.setFontSize(6.5).setTextColor(80, 110, 155).text(today, W - M, 19, { align: 'right' });
}

function pdfPageFooter(doc, W, M, rc, pageNum) {
  doc.setFillColor(...navy).rect(0, 284, W, 13, 'F');
  doc.setFillColor(...rc).rect(0, 284, W, 1, 'F');
  doc.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(140, 170, 210);
  doc.text('MLA Group | AI Governance Risk Assessment', M, 291);
  doc.text('Page ' + pageNum, W - M, 291, { align: 'right' });
}

// ==========================================
// 2. TRIGGER LOGIC
// ==========================================
const frame = document.getElementById('pdf-frame');
frame.addEventListener('load', function() {
  const data = sessionStorage.getItem('portal_result');
  if (!data) return;
  const RESULTS = JSON.parse(data);
  
  // Scrape recommendations from iframe DOM before generating
  const recommendations = Array.from(frame.contentWindow.document.querySelectorAll('#recs .rec-item'))
    .map(el => ps(el.textContent));

  setTimeout(() => {
    makeFullPDF(RESULTS, recommendations);
  }, 1500);
});

// ==========================================
// 3. THE COMPLETE PDF ENGINE
// ==========================================
function makeFullPDF(RESULTS, recommendations) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 18, TW = W - (M * 2);
  const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const rc = rcMap[RESULTS.band?.id] || blue;
  let pageNum = 1;

  try {
    // --- PAGE 1: COVER ---
    doc.setFillColor(...navy).rect(0, 0, W, 297, 'F');
    doc.setFillColor(...rc).rect(0, 0, W, 6, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(24).setTextColor(255, 255, 255);
    doc.text(ps(RESULTS.organisation), M, 70);
    doc.setFontSize(18).setTextColor(...rc).text(ps(RESULTS.band?.label), M, 82);
    doc.setFontSize(28).setTextColor(255, 255, 255).text(RESULTS.adjustedScore + '%', M, 105);
    doc.setFontSize(8).setTextColor(100, 130, 170).text('GOVERNANCE MATURITY SCORE', M, 112);

    // --- PAGE 2: EXECUTIVE SUMMARY ---
    doc.addPage(); pageNum++;
    pdfPageHeader(doc, W, M, rc, '1. EXECUTIVE SUMMARY', today);
    let y = 50;
    doc.setFont('helvetica', 'bold').setFontSize(11).setTextColor(...navy).text('Maturity Overview', M, y);
    y += 8;
    const summaryLines = doc.splitTextToSize(ps(RESULTS.band?.summary), TW);
    doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(60, 70, 80).text(summaryLines, M, y);
    pdfPageFooter(doc, W, M, rc, pageNum);

    // --- PAGE 3: SECTION BREAKDOWN ---
    doc.addPage(); pageNum++;
    pdfPageHeader(doc, W, M, rc, '2. DOMAIN MATURITY BREAKDOWN', today);
    y = 50;
    Object.keys(RESULTS.sectionNames || {}).forEach((key) => {
      const p = RESULTS.sectionPcts[key] || 0;
      doc.setFont('helvetica', 'bold').setFontSize(9).setTextColor(...navy).text(ps(RESULTS.sectionNames[key]), M, y);
      drawBar(doc, M, y + 3, TW, 4, p, p > 70 ? [22, 145, 65] : [185, 115, 0]);
      doc.setFontSize(8).text(p + '%', W - M, y, { align: 'right' });
      y += 18;
    });
    pdfPageFooter(doc, W, M, rc, pageNum);

    // --- PAGE 4+: DETAILED FINDINGS ---
    doc.addPage(); pageNum++;
    pdfPageHeader(doc, W, M, rc, '3. DETAILED FINDINGS', today);
    y = 50;
    (RESULTS.priorityFlags || []).forEach((f, i) => {
      if (y > 240) { doc.addPage(); pageNum++; pdfPageHeader(doc, W, M, rc, '3. FINDINGS (CONT.)', today); y = 50; }
      doc.setFillColor(245, 248, 252).rect(M, y, TW, 22, 'F');
      doc.setFillColor(...(rcMap[f.severity] || blue)).rect(M, y, 2, 22, 'F');
      doc.setFont('helvetica', 'bold').setFontSize(9).setTextColor(...navy).text(ps(f.label), M + 5, y + 7);
      const basisLines = doc.splitTextToSize(ps(f.basis), TW - 10);
      doc.setFont('helvetica', 'normal').setFontSize(7.5).setTextColor(80, 90, 100).text(basisLines, M + 5, y + 13);
      y += 28;
    });
    pdfPageFooter(doc, W, M, rc, pageNum);

    // --- PAGE 5: RECOMMENDATIONS ---
    doc.addPage(); pageNum++;
    pdfPageHeader(doc, W, M, rc, '4. PRIORITY RECOMMENDATIONS', today);
    y = 50;
    recommendations.forEach((rec, i) => {
      if (y > 250) { doc.addPage(); pageNum++; pdfPageHeader(doc, W, M, rc, '4. RECS (CONT.)', today); y = 50; }
      doc.setFont('helvetica', 'bold').setFontSize(9).setTextColor(...blue).text((i + 1) + '.', M, y);
      const recLines = doc.splitTextToSize(rec, TW - 10);
      doc.setFont('helvetica', 'normal').setFontSize(8.5).setTextColor(40, 50, 60).text(recLines, M + 8, y);
      y += (recLines.length * 5) + 5;
    });
    pdfPageFooter(doc, W, M, rc, pageNum);

    // --- FINAL SAVE ---
    doc.save('MLA-AI-Governance-Report.pdf');
    document.getElementById('status').innerText = "Report Complete. Closing...";
    setTimeout(() => window.close(), 2500);

  } catch (err) {
    console.error(err);
    document.getElementById('status').innerText = "Error generating report.";
  }
}
</script>
</body>
</html>

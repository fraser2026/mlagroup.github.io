<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MLA — Framework v2.0 Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #001A3A; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; flex-direction: column; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #4466FF; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { font-size: 0.8rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status">Applying v2.0 Scoring Logic...</p>

<script>
// ==========================================
[span_4](start_span)[span_5](start_span)[span_6](start_span)[span_7](start_span)// FRAMEWORK V2.0 CONSTANTS[span_4](end_span)[span_5](end_span)[span_6](end_span)[span_7](end_span)
// ==========================================

const SECTOR_MULTIPLIERS = {
    "Financial Services": 1.00, "Healthcare & Life Sciences": 1.00,
    "Public Sector / Government": 0.95, "Legal & Professional Services": 0.92,
    "Technology & SaaS": 0.88, "Retail & E-commerce": 0.85,
    "Education": 0.82, "Manufacturing & Logistics": 0.80, "Other": 0.90
};

const SECTION_WEIGHTS = { s1: 0.14, s2: 0.20, s3: 0.10, s4: 0.16, s5: 0.16, s6: 0.18, s7: 0.06 };

const BASE_MAX_SCORES = { s1: 12, s2: 18, s3: 12, s4: 12, s5: 15, s6: 15, s7: 15 };

const RISK_BANDS = [
    { min: 80, label: "LOW", sub: "Governance Established — Maintenance Mode", color: [22, 101, 52] },
    { min: 65, label: "LOW-MODERATE", sub: "Foundations Present — Targeted Gaps Remain", color: [6, 95, 70] },
    { min: 45, label: "MODERATE", sub: "Governance Gaps — Regulatory Exposure Likely", color: [146, 64, 14] },
    { min: 25, label: "HIGH", sub: "Significant Exposure — Intervention Required", color: [153, 27, 27] },
    { min: 0,  label: "CRITICAL", sub: "Governance Absent — Urgent Escalation Needed", color: [157, 23, 77] }
];

// ==========================================
[span_8](start_span)// THE CALCULATION ENGINE[span_8](end_span)
// ==========================================

window.onload = async function() {
    const rawData = sessionStorage.getItem('portal_result');
    if (!rawData) { window.location.href = 'portal.html'; return; }
    const data = JSON.parse(rawData);

    [span_9](start_span)// 1. Calculate Adjusted Max Scores (High-Risk Category Logic)[span_9](end_span)
    let adjMax = { ...BASE_MAX_SCORES };
    const categories = data.q1_2_selections || []; 
    if (categories.includes('Automated decision support')) adjMax.s4 += 2;
    if (categories.includes('Customer profiling')) adjMax.s6 += 2;
    if (categories.includes('Customer eligibility')) { adjMax.s4 += 2; adjMax.s6 += 2; }
    if (categories.includes('HR or recruitment')) adjMax.s4 += 2;
    if (categories.includes('Biometric or identity')) { adjMax.s4 += 2; adjMax.s5 += 2; }
    if (categories.includes('Health or safety')) { adjMax.s4 += 2; adjMax.s5 += 2; adjMax.s6 += 2; }

    [span_10](start_span)// 2. Calculate Weighted Score[span_10](end_span)
    const sectionScores = typeof data.section_scores === 'string' ? JSON.parse(data.section_scores) : data.section_scores;
    let weightedScore = 0;
    Object.keys(SECTION_WEIGHTS).forEach(s => {
        let sPerc = (sectionScores[s] / adjMax[s]) * 100;
        weightedScore += (sPerc * SECTION_WEIGHTS[s]);
    });

    [span_11](start_span)// 3. Apply Sector Multiplier[span_11](end_span)
    const multiplier = SECTOR_MULTIPLIERS[data.sector] || 0.90;
    let adjustedScore = weightedScore * multiplier;

    [span_12](start_span)// 4. Uncertainty Elevation[span_12](end_span)
    const uCount = data.uncertainty_count || 0;
    let bandIndex = RISK_BANDS.findIndex(b => adjustedScore >= b.min);
    if (uCount >= 5) bandIndex = Math.min(bandIndex + 2, 4);
    else if (uCount >= 3) bandIndex = Math.min(bandIndex + 1, 4);
    
    const finalBand = RISK_BANDS[bandIndex];

    // ==========================================
    // PDF GENERATION
    // ==========================================
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const M = 20, TW = 170;

    // Cover Page
    doc.setFillColor(0, 26, 58).rect(0, 0, 210, 297, 'F');
    doc.setFontSize(28).setTextColor(255, 255, 255).text(data.organisation || 'Diagnostic Report', M, 60);
    doc.setFontSize(12).setTextColor(68, 102, 255).text("AI GOVERNANCE RISK DIAGNOSTIC V2.0", M, 70);
    
    [span_13](start_span)// Risk Band Box[span_13](end_span)
    doc.setFillColor(...finalBand.color).rect(M, 90, TW, 45, 'F');
    doc.setFontSize(10).setTextColor(255, 255, 255).text("ADJUSTED EXPOSURE SCORE", M + 10, 102);
    doc.setFontSize(32).text(Math.round(adjustedScore) + "%", M + 10, 115);
    doc.setFontSize(16).text(finalBand.label, M + 10, 127);
    doc.setFontSize(9).text(finalBand.sub, M + 10, 132);

    [span_14](start_span)// Priority Flags[span_14](end_span)
    doc.addPage();
    doc.setFontSize(14).setTextColor(0, 26, 58).text("1. PRIORITY REGULATORY FLAGS", M, 30);
    let y = 45;
    const flags = typeof data.priority_flags === 'string' ? JSON.parse(data.priority_flags) : data.priority_flags;
    
    flags.forEach(f => {
        doc.setFillColor(255, 241, 242).rect(M, y, TW, 20, 'F');
        doc.setTextColor(153, 27, 27).setFontSize(9).text(f.label, M + 5, y + 8);
        doc.setTextColor(100, 116, 139).setFontSize(8).text("Basis: " + f.basis, M + 5, y + 14);
        y += 25;
    });

    // Save
    doc.save(`MLA-Report-${data.organisation}.pdf`);
    document.getElementById('status').innerText = "Report Complete.";
};
</script>
</body>
</html>

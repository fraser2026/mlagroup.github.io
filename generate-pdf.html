  document.getElementById('error-msg').style.display = 'block';
  document.getElementById('spinner').style.display = 'none';

// ─── PDF HELPERS ─────────────────────────────────────────────────
function _ps(str) {
  if (!str) return '';
  return str
    .replace(/\u2014|\u2013/g, '-')
    .replace(/\u2018|\u2019/g, "'")
    .replace(/\u201C|\u201D/g, '"')
    .replace(/\u2026/g, '...')
    .replace(/\u00D7/g, 'x')
    .replace(/\u2212/g, '-')
    .replace(/\u00A0/g, ' ')
    .replace(/[^\x00-\xFF]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function _drawBar(doc, x, y, totalW, h, pct, fillRGB) {
  doc.setFillColor(215, 222, 232);
  doc.rect(x, y, totalW, h, 'F');
  if (pct > 0) {
    doc.setFillColor(...fillRGB);
    doc.rect(x, y, Math.max(1, Math.round(pct * totalW / 100)), h, 'F');
  }
}

function _textBlock(doc, text, x, y, maxW, fontSize, fontStyle, colorRGB, lineH) {
  doc.setFont('helvetica', fontStyle || 'normal');
  doc.setFontSize(fontSize || 8);
  doc.setTextColor(...(colorRGB || [50, 60, 75]));
  const lines = doc.splitTextToSize(text, maxW);
  doc.text(lines, x, y);
  return y + lines.length * (lineH || (fontSize ? fontSize * 0.55 : 4.8));
}

function _pageHeader(doc, W, M, navy, rc, sectionTitle, today) {
  doc.setFillColor(...navy);
  doc.rect(0, 0, W, 34, 'F');
  doc.setFillColor(...rc);
  doc.rect(0, 34, W, 1.5, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(255, 255, 255);
  doc.text('MLA GROUP', M, 12);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(6.5);
  doc.setTextColor(120, 155, 200);
  doc.text('AI GOVERNANCE RISK ASSESSMENT  |  CONFIDENTIAL', M, 19);
  doc.setFontSize(7.5);
  doc.setTextColor(160, 185, 215);
  doc.text(sectionTitle, M, 28);
  doc.setFontSize(6.5);
  doc.setTextColor(80, 110, 155);
  doc.text(today, W - M, 19, { align: 'right' });

}

function _sectionHead(doc, W, M, navy, label, y) {

// ─── RECONSTRUCT FROM SUPABASE ROW ───────────────────────────────
function _reconstructResults(row) {
  const sectionPcts = row.section_scores || {};

  const band = _RISK_BANDS.find(b => b.id === row.risk_band)
            || _RISK_BANDS.find(b => row.adjusted_score >= b.min && row.adjusted_score <= b.max)
            || _RISK_BANDS[2];

  const sector     = row.sector || 'Other';
  const multiplier = _SECTOR_MULTIPLIER[sector] || 0.90;

  const priorityFlags = (row.priority_flags || []).map(f => ({
    id: f.id || '', label: f.label || '', basis: f.basis || '', severity: f.severity || 'high'
  }));

  // Use stored raw_scores if available, otherwise approximate from percentages
  const baseSectionMax = { s1:9, s2:18, s3:12, s4:12, s5:15, s6:15, s7:15 };
  let rawScores = row.raw_scores || {};
  if (!rawScores || Object.keys(rawScores).length === 0) {
    Object.keys(sectionPcts).forEach(sec => {
      rawScores[sec] = Math.round((sectionPcts[sec] / 100) * (baseSectionMax[sec] || 15));
    });
  }

  return {
    adjustedScore:      row.adjusted_score      || 0,
    weightedScore:      row.weighted_score       || 0,
    multiplier,
    sector,
    orgSize:            row.org_size             || '',
    respondentName:     (row.respondent_name     || '').trim(),
    respondentRole:     (row.respondent_role     || '').trim(),
    band,
    sectionPcts,
    sectionNames:       _SECTION_NAMES,
    rawScores,
    adjustedMax:        baseSectionMax,
    priorityFlags,
    regimeFlags:        row.regime_flags         || [],
    uncertaintyCount:   row.uncertainty_count    || 0,
    selectedCategories: row.selected_categories  || [],
    frameworkVersion:   row.framework_version    || _FRAMEWORK.version,
    frameworkDate:      _FRAMEWORK.date
  };
}

// ─── MAIN PDF GENERATOR ───────────────────────────────────────────
function generatePortalPDF(row) {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { showError('PDF library not loaded - please try again.'); return; }
  if (!row)   { showError('No result data found.'); return; }

  setStatus('Rendering report pages...');

  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 18;
  const TW  = W - M * 2;
  const TWI = W - M * 2 - 8;

  const org     = _ps(row.organisation || '');
  const name    = _ps(R.respondentName || org);
  const role    = _ps(R.respondentRole || '');
  const sector  = _ps(R.sector);
  const size    = _ps(R.orgSize);

  const title   = _ps(R.band.heading);

                    .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  const white   = [255, 255, 255];
  const lightBg = [247, 249, 252];
  const midGray = [120, 130, 148];
  const darkTxt = [30, 40, 58];
  const blue    = [26, 107, 255];
  const rcMap   = { critical:[180,35,35], high:[165,55,55], moderate:[185,115,0], lowmod:[170,120,0], low:[22,145,65] };

  // ── Build findings ────────────────────────────────────────────
  const findings = [];
  R.priorityFlags.forEach(f => {
    const data = _FINDING_DATA[f.id] || {
      section: 'General', severity: f.severity || 'high',
      impact: 'This governance area requires attention. Engage specialist support to address the underlying gap.',
      rec: 'Review this finding with your compliance function and engage an MLA Group governance specialist to develop a targeted remediation plan.'

    findings.push({ label:_ps(f.label), basis:_ps(f.basis), section:data.section, severity:data.severity, impact:data.impact, rec:data.rec });
  });
  (R.regimeFlags || []).forEach(f => {
    findings.push({ label:_ps(f.label), basis:_ps(f.basis), section:_REGIME_FINDING.section, severity:_REGIME_FINDING.severity, impact:_REGIME_FINDING.impact, rec:_REGIME_FINDING.rec });
  });
  if (R.uncertaintyCount >= 3) {
    findings.push({ label:'Elevated uncertainty: ' + R.uncertaintyCount + ' questions answered without sufficient confidence', basis:'Risk band elevated per framework uncertainty threshold', section:'Assessment Integrity', severity:'moderate', impact:'Organisations that cannot confirm basic governance facts with confidence face heightened regulatory scrutiny. Uncertainty about whether controls exist is treated by regulators as equivalent to the absence of those controls.', rec:'Conduct an internal governance stocktake to establish the factual position on each uncertain area. Where controls exist informally or undocumented, formalise them. Where they do not exist, treat this as a gap requiring remediation.' });
  }
  if (R.selectedCategories && R.selectedCategories.length > 0 && !R.selectedCategories.includes('none')) {
    findings.push({ label:'High-risk AI category detected - EU AI Act Annex III obligations apply from August 2026', basis:'EU AI Act Annex III; Categories: ' + R.selectedCategories.join(', '), section:'AI Inventory & Classification', severity:'critical', impact:'You have indicated use of AI systems in one or more categories classified as high-risk under EU AI Act Annex III. These systems are subject to mandatory conformity assessments, technical documentation requirements, human oversight obligations under Article 14, and logging requirements under Article 12. High-risk obligations apply from August 2026.', rec:'Conduct a formal EU AI Act scoping assessment for each high-risk category identified. Map current systems against the full Annex III compliance checklist. Prioritise human oversight documentation, technical documentation, and conformity assessment preparation.' });
  }

  // ── Build recommendations ─────────────────────────────────────
  const bandRecs  = _BAND_RECS[bc] || _BAND_RECS.moderate;
  const sectorRec = _SECTOR_RECS[sector] || '';
  const allRecs   = sectorRec ? [sectorRec, ...bandRecs] : bandRecs;

  let y = 0, pageNum = 1;

  // ═══════ PAGE 1 — COVER ══════════════════════════════════════

  doc.rect(0, 0, W, 297, 'F');
  doc.setFillColor(...rc);
  doc.rect(0, 0, W, 6, 'F');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(...white);
  doc.text('MLA GROUP', M, 22);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(100, 140, 190);
  doc.text('AI Governance & Risk Advisory  |  mlagroup.co.uk', M, 30);

  doc.setDrawColor(25, 55, 100);
  doc.setLineWidth(0.4);
  doc.line(M, 36, W - M, 36);

  doc.setFontSize(8);
  doc.setTextColor(80, 120, 175);
  doc.text('AI GOVERNANCE RISK ASSESSMENT  -  CONFIDENTIAL REPORT', M, 50);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(24);
  doc.setTextColor(...white);
  const orgLines = doc.splitTextToSize(org, 168);
  orgLines.forEach((line, i) => doc.text(line, M, 64 + i * 13));

  const heroY = orgLines.length > 1 ? 98 : 86;
  doc.setFillColor(8, 32, 68);
  doc.rect(M, heroY, TW, 44, 'F');
  doc.setFillColor(...rc);
  doc.rect(M, heroY, 5, 44, 'F');
  doc.setDrawColor(...rc);
  doc.setLineWidth(0.5);
  doc.rect(M, heroY, TW, 44, 'S');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(...rc);
  doc.text(band, M + 11, heroY + 14);

  doc.setFontSize(28);
  doc.text(pct, W - M - 5, heroY + 20, { align: 'right' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(6.5);
  doc.setTextColor(...midGray);
  doc.text('GOVERNANCE MATURITY SCORE', W - M - 5, heroY + 27, { align: 'right' });

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9.5);
  doc.setTextColor(200, 215, 235);
  doc.text(title, M + 11, heroY + 25);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(140, 165, 200);
  const sumCoverLines = doc.splitTextToSize(summary, TW - 30);
  doc.text(sumCoverLines, M + 11, heroY + 33);

  const prepY = heroY + 56;
  doc.setDrawColor(20, 50, 90);
  doc.setLineWidth(0.3);
  doc.line(M, prepY, W - M, prepY);

  doc.setFont('helvetica', 'normal');

// ─── ENTRY POINT — reads from sessionStorage (set by portal.html) ─
window.addEventListener('load', () => {
  try {
    const raw = sessionStorage.getItem('portal_result');
    if (!raw) {
      showError('No result data found. Please return to your dashboard and try again.');
      return;
    }
    const result = JSON.parse(raw);
    sessionStorage.removeItem('portal_result');
    generatePortalPDF(result);
  } catch (err) {
    console.error(err);
    showError('PDF generation failed: ' + err.message);
  }
});
</script>

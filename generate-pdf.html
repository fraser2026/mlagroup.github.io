<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generating Your Report...</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      background: #F7F8FC;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      border-radius: 14px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,26,58,0.10);
      max-width: 420px;
      width: 100%;
    }
    h2 { margin-bottom: 10px; color: #001A3A; font-size: 1.3rem; }
    p { color: #5A6B82; margin-bottom: 24px; font-size: 0.9rem; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #E2E8F4;
      border-top-color: #0000FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 11px 24px;
      background: #0000FF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #0000CC; }
    #status { font-size: 0.85rem; color: #5A6B82; }
    #error-msg { color: #dc2626; margin-top: 12px; font-size: 0.85rem; display: none; }
    .check { font-size: 2.5rem; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="check" id="check">&#10003;</div>
  <h2 id="heading">Preparing Your Report</h2>
  <p id="status">Building your PDF...</p>
  <div id="error-msg"></div>
  <a href="portal.html" class="btn" id="back-btn" style="display:none;">Back to Dashboard</a>
</div>

<script>

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-msg').style.display = 'block';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('back-btn').style.display = 'inline-block';
}

function showSuccess() {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('check').style.display = 'block';
  document.getElementById('heading').textContent = 'Report Downloaded!';
  setStatus('Your PDF has been saved to your downloads folder.');
  document.getElementById('back-btn').style.display = 'inline-block';
}

function showSuccessIOS(blobUrl, filename) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('check').style.display = 'block';
  document.getElementById('heading').textContent = 'Report Ready!';
  setStatus('Tap the button below to open your PDF, then use the share icon to save it.');
  var openBtn = document.createElement('a');
  openBtn.href = blobUrl;
  openBtn.target = '_blank';
  openBtn.rel = 'noopener';
  openBtn.textContent = 'Open PDF Report';
  openBtn.className = 'btn';
  openBtn.style.display = 'block';
  openBtn.style.marginBottom = '8px';
  document.querySelector('.box').insertBefore(openBtn, document.getElementById('back-btn'));
  document.getElementById('back-btn').style.display = 'inline-block';
}

function ps(s) {
  if (!s) return '';
  return String(s)
    .replace(/\u2014|\u2013/g,'-').replace(/\u2018|\u2019/g,"'")
    .replace(/\u201C|\u201D/g,'"').replace(/\u2026/g,'...')
    .replace(/\u00D7/g,'x').replace(/\u2212/g,'-')
    .replace(/\u00A0/g,' ').replace(/[^\x00-\xFF]/g,'')
    .replace(/\s+/g,' ').trim();
}

function bar(doc,x,y,tw,h,pct,c) {
  doc.setFillColor(215,222,232); doc.rect(x,y,tw,h,'F');
  if (pct>0) { doc.setFillColor(c[0],c[1],c[2]); doc.rect(x,y,Math.max(1,Math.round(pct*tw/100)),h,'F'); }
}

function tb(doc,text,x,y,mw,fs,st,col,lh) {
  doc.setFont('helvetica',st||'normal'); doc.setFontSize(fs||8);
  doc.setTextColor(col[0],col[1],col[2]);
  var ln=doc.splitTextToSize(text,mw); doc.text(ln,x,y);
  return y+ln.length*(lh||(fs?fs*0.55:4.8));
}

function hdr(doc,W,M,nv,rc,sec,dt) {
  doc.setFillColor(nv[0],nv[1],nv[2]); doc.rect(0,0,W,34,'F');
  doc.setFillColor(rc[0],rc[1],rc[2]); doc.rect(0,34,W,1.5,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(255,255,255);
  doc.text('MLA GROUP',M,12);
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(120,155,200);
  doc.text('AI GOVERNANCE RISK ASSESSMENT  |  CONFIDENTIAL',M,19);
  doc.setFontSize(7.5); doc.setTextColor(160,185,215); doc.text(sec,M,28);
  doc.setFontSize(6.5); doc.setTextColor(80,110,155);
  doc.text(dt,W-M,19,{align:'right'}); doc.text('mlagroup.co.uk',W-M,28,{align:'right'});
}

function sh(doc,W,M,nv,lbl,y) {
  doc.setFillColor(nv[0],nv[1],nv[2]); doc.rect(M,y,W-M*2,8,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
  doc.text(lbl,M+4,y+5.6); return y+13;
}

function ftr(doc,W,M,nv,rc,dt,pg) {

  doc.text('MLA Group  |  AI Governance Risk Assessment  |  mlagroup.co.uk',M,290);
  doc.text('This report is produced for informational purposes. MLA Group is not a certified audit regulator.',M,295);
  doc.setTextColor(180,200,230);
  doc.text('Page '+pg,W-M,290,{align:'right'}); doc.text(dt,W-M,295,{align:'right'});
}

function np(doc,W,M,nv,rc,ttl,dt,pg) {
  doc.addPage(); doc.setFillColor(255,255,255); doc.rect(0,0,W,297,'F');
  hdr(doc,W,M,nv,rc,ttl,dt); return 44;
}

function recon(row) {
  var sp=row.section_scores||{};
  var band=null;
  for (var i=0;i<_RB.length;i++) { if (_RB[i].id===row.risk_band){band=_RB[i];break;} }
  if (!band) { for (var j=0;j<_RB.length;j++) { if (row.adjusted_score>=_RB[j].min&&row.adjusted_score<=_RB[j].max){band=_RB[j];break;} } }
  if (!band) band=_RB[2];
  var sec=row.sector||'Other', mult=_SM[sec]||0.90;
  var pf=(row.priority_flags||[]).map(function(f){return{id:f.id||'',label:f.label||'',basis:f.basis||'',severity:f.severity||'high'};});
  var bsm={s1:9,s2:18,s3:12,s4:12,s5:15,s6:15,s7:15};
  var rs=row.raw_scores||{};
  if (!rs||Object.keys(rs).length===0) { Object.keys(sp).forEach(function(s){rs[s]=Math.round((sp[s]/100)*(bsm[s]||15));}); }
  return {
    adjustedScore:row.adjusted_score||0, weightedScore:row.weighted_score||0,
    multiplier:mult, sector:sec, orgSize:row.org_size||'',
    respondentName:(row.respondent_name||'').trim(), respondentRole:(row.respondent_role||'').trim(),
    band:band, sectionPcts:sp, sectionNames:_SN, rawScores:rs, adjustedMax:bsm,
    priorityFlags:pf, regimeFlags:row.regime_flags||[],
    uncertaintyCount:row.uncertainty_count||0, selectedCategories:row.selected_categories||[],
    frameworkVersion:row.framework_version||_FW.version, frameworkDate:_FW.date
  };
}

function generatePortalPDF(row) {
  if (!window.jspdf||!window.jspdf.jsPDF) { showError('PDF library not loaded - please refresh and try again.'); return; }
  if (!row) { showError('No result data found.'); return; }
  setStatus('Rendering report pages...');
  try {
    var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var W=210,M=18,TW=W-M*2,TWI=TW-8;
    var R=recon(row);
    var org=ps(row.organisation||'');
    var name=ps(R.respondentName||org), role=ps(R.respondentRole||'');
    var sector=ps(R.sector), size=ps(R.orgSize);
    var band=ps(R.band.label), bc=R.band.id, pct=R.adjustedScore+'%';
    var title=ps(R.band.heading), summary=ps(R.band.summary);
    var today=new Date(row.created_at||Date.now()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    var nv=[0,26,58],wh=[255,255,255],lb=[247,249,252],mg=[120,130,148],dk=[30,40,58],bl=[26,107,255];
    var rcm={critical:[180,35,35],high:[165,55,55],moderate:[185,115,0],lowmod:[170,120,0],low:[22,145,65]};
    var rc=rcm[bc]||bl;

    var findings=[];
    R.priorityFlags.forEach(function(f){
      var d=_FD[f.id]||{section:'General',severity:f.severity||'high',impact:'This governance area requires attention.',rec:'Review this finding with your compliance function.'};
      findings.push({label:ps(f.label),basis:ps(f.basis),section:d.section,severity:d.severity,impact:d.impact,rec:d.rec});
    });
    (R.regimeFlags||[]).forEach(function(f){
      findings.push({label:ps(f.label),basis:ps(f.basis),section:_RF.section,severity:_RF.severity,impact:_RF.impact,rec:_RF.rec});
    });
    if (R.uncertaintyCount>=3) {
      findings.push({label:'Elevated uncertainty: '+R.uncertaintyCount+' questions answered without sufficient confidence',basis:'Risk band elevated per framework uncertainty threshold',section:'Assessment Integrity',severity:'moderate',impact:'Uncertainty about whether controls exist is treated by regulators as equivalent to the absence of those controls.',rec:'Conduct an internal governance stocktake to establish the factual position on each uncertain area.'});
    }
    if (R.selectedCategories&&R.selectedCategories.length>0&&R.selectedCategories.indexOf('none')===-1) {
      findings.push({label:'High-risk AI category detected - EU AI Act Annex III obligations apply from August 2026',basis:'EU AI Act Annex III; Categories: '+R.selectedCategories.join(', '),section:'AI Inventory & Classification',severity:'critical',impact:'AI systems in Annex III categories are subject to mandatory conformity assessments, technical documentation, human oversight under Article 14, and logging under Article 12.',rec:'Conduct a formal EU AI Act scoping assessment for each high-risk category identified and prioritise conformity assessment preparation.'});
    }

    var br=_BR[bc]||_BR.moderate, sr=_SR[sector]||'';
    var allRecs=sr?[sr].concat(br):br;
    var y=0,pn=1;

    // PAGE 1 COVER
    doc.setFillColor(nv[0],nv[1],nv[2]); doc.rect(0,0,W,297,'F');
    doc.setFillColor(rc[0],rc[1],rc[2]); doc.rect(0,0,W,6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(255,255,255);
    doc.text('MLA GROUP',M,22);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(100,140,190);
    doc.text('AI Governance & Risk Advisory  |  mlagroup.co.uk',M,30);
    doc.setDrawColor(25,55,100); doc.setLineWidth(0.4); doc.line(M,36,W-M,36);
    doc.setFontSize(8); doc.setTextColor(80,120,175);
    doc.text('AI GOVERNANCE RISK ASSESSMENT - CONFIDENTIAL REPORT',M,50);
    doc.setFont('helvetica','bold'); doc.setFontSize(24); doc.setTextColor(255,255,255);
    var orgL=doc.splitTextToSize(org,168);
    orgL.forEach(function(l,i){doc.text(l,M,64+i*13);});
    var hy=orgL.length>1?98:86;
    doc.setFillColor(8,32,68); doc.rect(M,hy,TW,44,'F');
    doc.setFillColor(rc[0],rc[1],rc[2]); doc.rect(M,hy,5,44,'F');
    doc.setDrawColor(rc[0],rc[1],rc[2]); doc.setLineWidth(0.5); doc.rect(M,hy,TW,44,'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(rc[0],rc[1],rc[2]);
    doc.text(band,M+11,hy+14);
    doc.setFontSize(28); doc.text(pct,W-M-5,hy+20,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(mg[0],mg[1],mg[2]);
    doc.text('GOVERNANCE MATURITY SCORE',W-M-5,hy+27,{align:'right'});
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(200,215,235);
    doc.text(title,M+11,hy+25);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,165,200);
    var scl=doc.splitTextToSize(summary,TW-30); doc.text(scl,M+11,hy+33);
    var py=hy+56;
    doc.setDrawColor(20,50,90); doc.setLineWidth(0.3); doc.line(M,py,W-M,py);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(70,100,150);
    doc.text('PREPARED FOR',M,py+9);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(255,255,255);
    doc.text(name,M,py+18);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(140,165,205);
    doc.text(role?role+'  |  '+org:org,M,py+26);
    doc.text(sector+'  |  '+(size?size+' employees':''),M,py+33);
    doc.setFontSize(7); doc.setTextColor(70,100,150);
    doc.text('REPORT DATE',W-M,py+9,{align:'right'});
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
    doc.text(today,W-M,py+18,{align:'right'});
    var ty=py+48;
    doc.setDrawColor(20,50,90); doc.line(M,ty,W-M,ty);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(80,120,175);
    doc.text('CONTENTS',M,ty+8);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,165,205);
    ['1.  Executive Summary','2.  Assessment Results & Section Breakdown','3.  Detailed Findings','4.  Priority Recommendations','A.  Appendix: Scope, Methodology & Regulatory Framework'].forEach(function(it,i){doc.text(it,M,ty+16+i*7);});
    doc.setFillColor(rc[0],rc[1],rc[2]); doc.rect(0,292,W,5,'F');
    doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(50,80,130);
    doc.text('This document is confidential and prepared exclusively for the named recipient. MLA Group | mlagroup.co.uk',W/2,289.5,{align:'center'});

    // PAGE 2 EXEC SUMMARY
    pn++; y=np(doc,W,M,nv,rc,'1. EXECUTIVE SUMMARY',today,pn);
    y=sh(doc,W,M,nv,'1.1  Confidentiality Statement',y);
    y=tb(doc,ps('This report is the exclusive property of '+org+' and MLA Group. It contains confidential information prepared solely for the named recipient ('+name+(role?', '+role:'')+'). Duplication, redistribution, or use - in whole or in part - requires the prior written consent of both parties.'),M+4,y,TWI,8.5,'normal',[60,72,88],5.2);
    y+=8;
    y=sh(doc,W,M,nv,'1.2  Report Overview',y);

    doc.text(dl2,M+5,y+13.5);
    ftr(doc,W,M,nv,rc,today,pn);

    // SAVE - desktop normal, iOS blob URL
    var so=ps(org).replace(/[^a-zA-Z0-9\s-]/g,'').replace(/\s+/g,'-');

}

window.addEventListener('load',function(){
  try {
    var raw=sessionStorage.getItem('portal_result');

  } catch(err) {

    showError('PDF generation failed: '+err.message);

});

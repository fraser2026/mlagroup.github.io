<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generating Your Report...</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      border-radius: 12px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
    }
    h2 { margin-bottom: 10px; color: #1a1a2e; }
    p  { color: #666; margin-bottom: 24px; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e0e0e0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
    }
    .btn:hover { background: #4338ca; }
    #status { font-size: 14px; color: #555; }
    #error-msg { color: #dc2626; margin-top: 12px; display: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h2>Preparing Your Report</h2>
  <p id="status">Loading your results...</p>
  <div id="error-msg"></div>
  <a href="portal.html" class="btn" id="back-btn" style="display:none;">← Back to Dashboard</a>
</div>

<script>
  // ── CONFIG ────────────────────────────────────────────────
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  // ─────────────────────────────────────────────────────────

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  const setStatus = (msg) => document.getElementById('status').textContent = msg;
  const showError = (msg) => {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('back-btn').style.display = 'inline-block';
  };

  async function generate() {
    // 1. Auth check
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    setStatus('Fetching your diagnostic results...');

    // 2. Fetch latest result for this user
    const { data: results, error } = await sb
      .from('diagnostic_results')
      .select('*')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false })
      .limit(1);

    if (error || !results || results.length === 0) {
      showError('Could not load your results. Please try again from the dashboard.');
      return;
    }

    const result = results[0];
    setStatus('Building your PDF...');

    // 3. Build PDF
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });

    const pageW = doc.internal.pageSize.getWidth();
    const margin = 50;
    const contentW = pageW - margin * 2;
    let y = 60;

    const addText = (text, size, color, bold) => {
      doc.setFontSize(size);
      doc.setTextColor(...color);
      doc.setFont('helvetica', bold ? 'bold' : 'normal');
      const lines = doc.splitTextToSize(text, contentW);
      lines.forEach(line => {
        if (y > 780) { doc.addPage(); y = 60; }
        doc.text(line, margin, y);
        y += size * 1.5;
      });
    };

    const addDivider = () => {
      y += 6;
      doc.setDrawColor(220, 220, 220);
      doc.line(margin, y, pageW - margin, y);
      y += 16;
    };

    // Header band
    doc.setFillColor(79, 70, 229);
    doc.rect(0, 0, pageW, 40, 'F');
    doc.setFontSize(13);
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.text('DIAGNOSTIC REPORT', margin, 26);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    const dateStr = new Date(result.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
    doc.text(dateStr, pageW - margin - doc.getTextWidth(dateStr), 26);

    y = 70;

    addText('Your Business Diagnostic Summary', 20, [26, 26, 46], true);
    y += 4;
    addText(`Prepared for: ${session.user.email}`, 11, [120, 120, 120], false);
    y += 10;
    addDivider();

    // Score overview
    if (result.overall_score !== undefined) {
      addText(`Overall Score: ${result.overall_score} / 100`, 16, [79, 70, 229], true);
      y += 6;
    }

    // Sections — adapt keys to match your actual data shape
    const sections = result.sections || result.scores || null;

    if (sections && typeof sections === 'object') {
      addDivider();
      addText('Section Breakdown', 14, [26, 26, 46], true);
      y += 6;
      Object.entries(sections).forEach(([key, val]) => {
        const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const score = typeof val === 'object' ? (val.score ?? JSON.stringify(val)) : val;
        addText(`• ${label}: ${score}`, 11, [60, 60, 60], false);
      });
      y += 6;
    }

    // Recommendations
    const recs = result.recommendations || result.advice || null;
    if (recs) {
      addDivider();
      addText('Recommendations', 14, [26, 26, 46], true);
      y += 6;
      if (Array.isArray(recs)) {
        recs.forEach((r, i) => addText(`${i + 1}. ${r}`, 11, [60, 60, 60], false));
      } else {
        addText(String(recs), 11, [60, 60, 60], false);
      }
    }

    // Raw answers fallback
    if (!sections && !recs) {
      addDivider();
      addText('Your Responses', 14, [26, 26, 46], true);
      y += 6;
      const answers = result.answers || result.responses || {};
      Object.entries(answers).forEach(([q, a]) => {
        addText(`Q: ${q}`, 10, [80, 80, 80], true);
        addText(`A: ${a}`, 10, [60, 60, 60], false);
        y += 4;
      });
    }

    // Footer on every page
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      doc.setFontSize(9);
      doc.setTextColor(180, 180, 180);
      doc.text(`Page ${i} of ${totalPages} · Confidential`, margin, 830);
    }

    // 4. Save
    doc.save(`diagnostic-report-${new Date().toISOString().slice(0,10)}.pdf`);
    setStatus('Your PDF has been downloaded!');
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('back-btn').style.display = 'inline-block';
  }

  generate().catch(err => {
    console.error(err);
    showError('An unexpected error occurred: ' + err.message);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generating Your Report...</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      background: #F7F8FC;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      border-radius: 14px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,26,58,0.10);
      max-width: 420px;
      width: 100%;
    }
    h2 { margin-bottom: 10px; color: #001A3A; font-size: 1.3rem; }
    p  { color: #5A6B82; margin-bottom: 24px; font-size: 0.9rem; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #E2E8F4;
      border-top-color: #0000FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 11px 24px;
      background: #0000FF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #0000CC; }
    #status { font-size: 0.85rem; color: #5A6B82; }
    #error-msg { color: #dc2626; margin-top: 12px; font-size: 0.85rem; display: none; }
    .check { font-size: 2.5rem; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="check" id="check">&#10003;</div>
  <h2 id="heading">Preparing Your Report</h2>
  <p id="status">Building your PDF...</p>
  <div id="error-msg"></div>
  <a href="portal.html" class="btn" id="back-btn" style="display:none;">Back to Dashboard</a>
</div>

<script>
function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-msg').style.display = 'block';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('back-btn').style.display = 'inline-block';
}

/**
 * UPDATED: showSuccess handles Desktop vs iOS branching
 */
function showSuccess(blobUrl) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('check').style.display = 'block';
  document.getElementById('back-btn').style.display = 'inline-block';
  
  if (blobUrl) {
    // iOS Logic: Show a button because Safari blocks auto-downloads
    document.getElementById('heading').textContent = 'Report Ready!';
    setStatus('Tap below to view your report. Use the Safari share icon to save it.');
    
    var btn = document.createElement('a');
    btn.href = blobUrl;
    btn.target = '_blank'; // Opens in new tab
    btn.textContent = 'View PDF Report';
    btn.className = 'btn';
    btn.style.marginTop = '12px';
    btn.style.display = 'inline-block';
    btn.style.background = '#0066FF'; 
    
    document.querySelector('.box').appendChild(btn);
  } else {
    // Desktop Logic
    document.getElementById('heading').textContent = 'Report Downloaded!';
    setStatus('Your PDF has been saved to your downloads folder.');
  }
}

var _FRAMEWORK = { version: '2.0.0', date: 'February 2026', nextReview: 'August 2026' };
var _WEIGHTS = { s1: 0.14, s2: 0.20, s3: 0.10, s4: 0.16, s5: 0.16, s6: 0.18, s7: 0.06 };
var _SECTION_NAMES = {
  s1: 'AI Inventory & Classification',
  s2: 'Governance & Accountability',
  s3: 'Data Quality & Lineage',
  s4: 'Human Oversight & Controls',
  s5: 'Explainability & Transparency',
  s6: 'Compliance & Legal Alignment',
  s7: 'Operational Controls & Resilience'
};

var _SECTOR_MULTIPLIER = {
  'Financial Services': 1.00,
  'Healthcare & Life Sciences': 1.00,
  'Public Sector / Government': 0.95,
  'Legal & Professional Services': 0.92,
  'Technology & SaaS': 0.88,
  'Retail & E-commerce': 0.85,
  'Education': 0.82,
  'Manufacturing & Logistics': 0.80,
  'Other': 0.90
};

var _RISK_BANDS = [
  { min: 80, max: 100, id: 'low', label: 'Low Risk', heading: 'Governance Established - Maintenance Mode', summary: 'Your organisation demonstrates strong AI governance maturity across the assessed areas.' },
  { min: 65, max: 79, id: 'lowmod', label: 'Low - Moderate Risk', heading: 'Foundations Present - Targeted Gaps Remain', summary: 'Your organisation has established meaningful governance foundations, but specific gaps remain.' },
  { min: 45, max: 64, id: 'moderate', label: 'Moderate Risk', heading: 'Governance Gaps - Regulatory Exposure Likely', summary: 'Material governance gaps exist across multiple areas.' },
  { min: 25, max: 44, id: 'high', label: 'High Risk', heading: 'Significant Exposure - Intervention Required', summary: 'Your responses indicate significant and widespread governance deficiencies.' },
  { min: 0, max: 24, id: 'critical', label: 'Critical Risk', heading: 'Governance Absent - Urgent Escalation Needed', summary: 'Your assessment indicates that AI governance is largely absent.' }
];

var _BAND_RECS = {
  critical: ['Urgently appoint a named AI governance lead','Commission an immediate AI inventory audit','Restrict high-impact automated decisions','Engage legal counsel immediately','Develop minimum viable AI policy'],
  high: ['Formalise AI governance ownership','Conduct DPIAs for all AI systems','Implement decision logging','Establish human-in-the-loop review','Review third-party AI contracts'],
  moderate: ['Elevate informal governance arrangements','Complete full DPIA review','Strengthen data lineage','Develop escalation pathways','Introduce scheduled model performance monitoring'],
  lowmod: ['Document informal governance arrangements','Conduct EU AI Act scope assessment','Close identified gaps in explainability','Formalise training records','Schedule an annual external review'],
  low: ['Maintain currency with EU AI Act','Ensure new AI deployments follow existing process','Continue scheduled bias testing','Consider ISO/IEC 42001 certification','Share governance best practices']
};

var _SECTOR_RECS = {
  'Financial Services': 'Review against FCA DP5/22 and ensure SM&CR documentation.',
  'Healthcare & Life Sciences': 'Assess DCB0129 clinical safety and NHS DTAC compliance.',
  'Legal & Professional Services': 'Review SRA AI Guidance (2024) and indemnity position.',
  'Retail & E-commerce': 'Audit customer profiling for UK GDPR Art.22 obligations.',
  'Technology & SaaS': 'Clarify EU AI Act provider obligations.',
  'Public Sector / Government': 'Review against ICO public authority guidance.',
  'Education': 'Review against Equality Act 2010 and ICO guidance.',
  'Manufacturing & Logistics': 'Identify AI interacting with physical safety systems.',
  'Other': 'Conduct sector mapping for specific AI use cases.'
};

var _FINDING_DATA = {
  pf_governance: { section: 'Governance & Accountability', severity: 'critical', impact: 'Absence of named owner creates structural accountability gap.', rec: 'Appoint a named AI Governance Lead.' },
  pf_oversight: { section: 'Human Oversight & Controls', severity: 'critical', impact: 'Automated decisions without human review create exposure.', rec: 'Implement mandatory human review protocols.' },
  pf_dpia: { section: 'Compliance & Legal Alignment', severity: 'critical', impact: 'DPIA is a legal requirement under UK GDPR Article 35.', rec: 'Commission DPIAs for all AI processing personal data.' },
  pf_transparency: { section: 'Compliance & Legal Alignment', severity: 'high', impact: 'Individuals must be proactively informed of AI use.', rec: 'Implement transparency notices at point of interaction.' },
  pf_no_inventory: { section: 'AI Inventory & Classification', severity: 'high', impact: 'Cannot determine regulatory scope without inventory.', rec: 'Conduct an immediate AI inventory audit.' },
  pf_no_policy: { section: 'Governance & Accountability', severity: 'high', impact: 'No authoritative guidance for staff on AI boundaries.', rec: 'Develop and implement an AI Use Policy.' }
};

var _REGIME_FINDING = { section: 'Regulatory Compliance', severity: 'info', impact: 'Specific regime obligations exist independently of score.', rec: 'Review guidance cited for your specific regime.' };

function _ps(str) {
  if (!str) return '';
  return String(str).replace(/[^\x00-\xFF]/g, '').replace(/\s+/g, ' ').trim();
}

function _drawBar(doc, x, y, totalW, h, pct, c) {
  doc.setFillColor(215, 222, 232); doc.rect(x, y, totalW, h, 'F');
  if (pct > 0) {
    doc.setFillColor(c[0], c[1], c[2]);
    doc.rect(x, y, Math.max(1, Math.round(pct * totalW / 100)), h, 'F');
  }
}

function _tb(doc, text, x, y, maxW, fs, style, col, lh) {
  doc.setFont('helvetica', style || 'normal'); doc.setFontSize(fs || 8);
  doc.setTextColor(col[0], col[1], col[2]);
  var lines = doc.splitTextToSize(text, maxW); doc.text(lines, x, y);
  return y + lines.length * (lh || (fs ? fs * 0.55 : 4.8));
}

function _hdr(doc, W, M, nv, rc, sec, dt) {
  doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(0, 0, W, 34, 'F');
  doc.setFillColor(rc[0], rc[1], rc[2]); doc.rect(0, 34, W, 1.5, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(255, 255, 255);
  doc.text('MLA GROUP', M, 12);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(120, 155, 200);
  doc.text('AI GOVERNANCE RISK ASSESSMENT | CONFIDENTIAL', M, 19);
  doc.setFontSize(7.5); doc.setTextColor(160, 185, 215); doc.text(sec, M, 28);
  doc.setFontSize(6.5); doc.setTextColor(80, 110, 155);
  doc.text(dt, W - M, 19, { align: 'right' });
}

function _sh(doc, W, M, nv, label, y) {
  doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(M, y, W - M * 2, 8, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(255, 255, 255);
  doc.text(label, M + 4, y + 5.6); return y + 13;
}

function _ftr(doc, W, M, nv, rc, dt, pg) {
  doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(0, 284, W, 13, 'F');
  doc.setFillColor(rc[0], rc[1], rc[2]); doc.rect(0, 284, W, 1, 'F');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(140, 170, 210);
  doc.text('MLA Group | AI Governance Risk Assessment', M, 290);
  doc.text('Page ' + pg, W - M, 290, { align: 'right' });
}

function _np(doc, W, M, nv, rc, heading, dt, pg) {
  doc.addPage(); doc.setFillColor(255, 255, 255); doc.rect(0, 0, W, 297, 'F');
  _hdr(doc, W, M, nv, rc, heading, dt); return 44;
}

function _recon(row) {
  var sp = row.section_scores || {};
  var band = _RISK_BANDS.find(b => row.adjusted_score >= b.min && row.adjusted_score <= b.max) || _RISK_BANDS[2];
  var sector = row.sector || 'Other';
  var mult = _SECTOR_MULTIPLIER[sector] || 0.90;
  var bsm = { s1: 9, s2: 18, s3: 12, s4: 12, s5: 15, s6: 15, s7: 15 };
  var rs = row.raw_scores || {};
  if (!rs || Object.keys(rs).length === 0) {
    Object.keys(sp).forEach(s => { rs[s] = Math.round((sp[s] / 100) * (bsm[s] || 15)); });
  }
  return {
    adjustedScore: row.adjusted_score || 0,
    weightedScore: row.weighted_score || 0,
    multiplier: mult, sector: sector, orgSize: row.org_size || '',
    respondentName: (row.respondent_name || '').trim(),
    respondentRole: (row.respondent_role || '').trim(),
    band: band, sectionPcts: sp, sectionNames: _SECTION_NAMES,
    rawScores: rs, adjustedMax: bsm,
    priorityFlags: row.priority_flags || [], regimeFlags: row.regime_flags || [],
    uncertaintyCount: row.uncertainty_count || 0,
    selectedCategories: row.selected_categories || [],
    frameworkVersion: row.framework_version || _FRAMEWORK.version,
    frameworkDate: _FRAMEWORK.date
  };
}

function generatePortalPDF(row) {
  if (!window.jspdf || !window.jspdf.jsPDF) { showError('PDF library not loaded - please refresh and try again.'); return; }
  if (!row) { showError('No result data found.'); return; }

  setStatus('Rendering report pages...');

  try {
    var doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var W = 210, M = 18, TW = W - M * 2, TWI = TW - 8;
    var R = _recon(row);
    var org = _ps(row.organisation || '');
    var name = _ps(R.respondentName || org);
    var role = _ps(R.respondentRole || '');
    var sector = _ps(R.sector);
    var size = _ps(R.orgSize);
    var band = _ps(R.band.label);
    var bc = R.band.id;
    var pct = R.adjustedScore + '%';
    var title = _ps(R.band.heading);
    var summary = _ps(R.band.summary);
    var today = new Date(row.created_at || Date.now()).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    var nv = [0, 26, 58], wh = [255, 255, 255], lb = [247, 249, 252], mg = [120, 130, 148], dk = [30, 40, 58], bl = [26, 107, 255];
    var rcm = { critical: [180,35,35], high: [165,55,55], moderate: [185,115,0], lowmod: [170,120,0], low: [22,145,65] };
    var rc = rcm[bc] || bl;

    var findings = [];
    R.priorityFlags.forEach(function(f) {
      var d = _FINDING_DATA[f.id] || { section: 'General', severity: f.severity || 'high', impact: 'This governance area requires attention.', rec: 'Review this finding with your compliance function.' };
      findings.push({ label: _ps(f.label), basis: _ps(f.basis), section: d.section, severity: d.severity, impact: d.impact, rec: d.rec });
    });
    (R.regimeFlags || []).forEach(function(f) {
      findings.push({ label: _ps(f.label), basis: _ps(f.basis), section: _REGIME_FINDING.section, severity: _REGIME_FINDING.severity, impact: _REGIME_FINDING.impact, rec: _REGIME_FINDING.rec });
    });
    if (R.uncertaintyCount >= 3) {
      findings.push({ label: 'Elevated uncertainty: ' + R.uncertaintyCount + ' questions answered without sufficient confidence', basis: 'Risk band elevated per framework uncertainty threshold', section: 'Assessment Integrity', severity: 'moderate', impact: 'Uncertainty about whether controls exist is treated by regulators as equivalent to the absence of those controls.', rec: 'Conduct an internal governance stocktake to establish the factual position on each uncertain area.' });
    }
    if (R.selectedCategories && R.selectedCategories.length > 0 && R.selectedCategories.indexOf('none') === -1) {
      findings.push({ label: 'High-risk AI category detected - EU AI Act Annex III obligations apply from August 2026', basis: 'EU AI Act Annex III; Categories: ' + R.selectedCategories.join(', '), section: 'AI Inventory & Classification', severity: 'critical', impact: 'AI systems in Annex III categories are subject to mandatory conformity assessments...', rec: 'Conduct a formal EU AI Act scoping assessment for each high-risk category identified.' });
    }

    var br = _BAND_RECS[bc] || _BAND_RECS.moderate;
    var sr = _SECTOR_RECS[sector] || '';
    var allRecs = sr ? [sr].concat(br) : br;
    var y = 0, pn = 1;

    // PAGE 1 COVER
    doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(0, 0, W, 297, 'F');
    doc.setFillColor(rc[0], rc[1], rc[2]); doc.rect(0, 0, W, 6, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(255,255,255);
    doc.text('MLA GROUP', M, 22);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(100,140,190);
    doc.text('AI Governance & Risk Advisory | mlagroup.co.uk', M, 30);
    doc.setDrawColor(25,55,100); doc.setLineWidth(0.4); doc.line(M, 36, W-M, 36);
    doc.setFontSize(8); doc.setTextColor(80,120,175);
    doc.text('AI GOVERNANCE RISK ASSESSMENT - CONFIDENTIAL REPORT', M, 50);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.setTextColor(255,255,255);
    var orgL = doc.splitTextToSize(org, 168);
    orgL.forEach(function(l, i) { doc.text(l, M, 64 + i * 13); });
    var hy = orgL.length > 1 ? 98 : 86;
    doc.setFillColor(8,32,68); doc.rect(M, hy, TW, 44, 'F');
    doc.setFillColor(rc[0],rc[1],rc[2]); doc.rect(M, hy, 5, 44, 'F');
    doc.setDrawColor(rc[0],rc[1],rc[2]); doc.setLineWidth(0.5); doc.rect(M, hy, TW, 44, 'S');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(rc[0],rc[1],rc[2]);
    doc.text(band, M+11, hy+14);
    doc.setFontSize(28); doc.text(pct, W-M-5, hy+20, { align: 'right' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(200,215,235);
    doc.text(title, M+11, hy+25);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(140,165,200);
    var scl = doc.splitTextToSize(summary, TW-30); doc.text(scl, M+11, hy+33);
    var py = hy+56;
    doc.setDrawColor(20,50,90); doc.setLineWidth(0.3); doc.line(M, py, W-M, py);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(255,255,255);
    doc.text(name, M, py+18);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(140,165,205);
    doc.text(role ? role + ' | ' + org : org, M, py+26);
    doc.text(sector + ' | ' + (size ? size + ' employees' : ''), M, py+33);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
    doc.text(today, W-M, py+18, { align: 'right' });

    // PAGE 2 EXECUTIVE SUMMARY
    pn++; y = _np(doc, W, M, nv, rc, '1. EXECUTIVE SUMMARY', today, pn);
    y = _sh(doc, W, M, nv, '1.1 Confidentiality Statement', y);
    y = _tb(doc, _ps('This report is the exclusive property of ' + org + ' and MLA Group...'), M+4, y, TWI, 8.5, 'normal', [60,72,88], 5.2);
    y += 8;
    y = _sh(doc, W, M, nv, '1.3 Key Findings & Risk Position', y);
    var ph = 46;
    doc.setFillColor(lb[0],lb[1],lb[2]); doc.rect(M, y, TW, ph, 'F');
    doc.setFillColor(rc[0],rc[1],rc[2]); doc.rect(M, y, 5, ph, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(rc[0],rc[1],rc[2]);
    doc.text(band, M+10, y+13);
    doc.setFontSize(22); doc.text(pct, W-M-5, y+18, { align: 'right' });
    y += ph + 8;
    findings.slice(0, 3).forEach(function(fd) {
      var fl = doc.splitTextToSize(fd.label, TWI-6);
      doc.setFillColor(250,248,248); doc.rect(M, y, TW, 12, 'F');
      doc.setFontSize(7.8); doc.setTextColor(40,48,62);
      doc.text(fl, M+8, y+7); y += 15;
    });
    _ftr(doc, W, M, nv, rc, today, pn);

    // PAGE 3 ASSESSMENT RESULTS
    pn++; y = _np(doc, W, M, nv, rc, '2. ASSESSMENT RESULTS', today, pn);
    y = _sh(doc, W, M, nv, '2.2 Section Maturity Breakdown', y);
    ['s1','s2','s3','s4','s5','s6','s7'].forEach(function(s, i) {
      var p = R.sectionPcts[s]||0;
      var nm = R.sectionNames[s];
      doc.setFillColor(i%2===0?248:255, i%2===0?249:255, i%2===0?252:255);
      doc.rect(M, y, TW, 10, 'F');
      doc.setFontSize(7.8); doc.setTextColor(35,45,60);
      doc.text(nm, M+3, y+6.8);
      _drawBar(doc, M+136, y+3, 20, 4, p, p>=75?[22,145,65]:[165,55,55]);
      y += 10;
    });
    _ftr(doc, W, M, nv, rc, today, pn);

    // APPENDIX
    pn++; y = _np(doc, W, M, nv, rc, 'A. APPENDIX: SCOPE & METHODOLOGY', today, pn);
    y = _sh(doc, W, M, nv, 'A.3 Scoring Methodology', y);
    y = _tb(doc, _ps('Framework v' + R.frameworkVersion + '...'), M+4, y, TWI, 8.5, 'normal', [60,72,88], 5.2);
    _ftr(doc, W, M, nv, rc, today, pn);

    /* --- THE IOS FIX: Branching Logic --- */
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var so = _ps(org).replace(/[^a-zA-Z0-9\s-]/g, '').replace(/\s+/g, '-');
    var fn = 'MLA-AI-Risk-Report-' + so + '.pdf';

    if (isIOS) {
      // Create a Blob for Safari
      var blob = doc.output('blob');
      var blobUrl = URL.createObjectURL(blob);
      showSuccess(blobUrl); 
    } else {
      // Standard download for PC
      doc.save(fn);
      showSuccess(); 
    }

  } catch (err) {
    console.error(err);
    showError('PDF generation failed: ' + err.message);
  }
}


window.addEventListener('load', function() {
  try {
    var raw = sessionStorage.getItem('portal_result');
    if (!raw) { showError('No data found.'); return; }
    var result = JSON.parse(raw);
    sessionStorage.removeItem('portal_result');
    generatePortalPDF(result);
  } catch (err) {
    showError('Init failed: ' + err.message);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MLA — Framework v2.0 Report Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #001A3A; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; flex-direction: column; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #4466FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { font-size: 0.8rem; opacity: 0.7; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status">INITIALISING v2.0 ENGINE...</p>

<script>
window.onload = async function() {
    const status = document.getElementById('status');
    try {
        status.innerText = "FETCHING SESSION DATA...";
        const raw = sessionStorage.getItem('portal_result');
        if (!raw) {
            status.innerText = "ERROR: NO DATA FOUND. REDIRECTING...";
            setTimeout(() => window.location.href = 'portal.html', 2000);
            return;
        }
        const data = JSON.parse(raw);
        console.log("Data loaded:", data);

        // --- 1. Constants from Framework v2.0 ---
        const SECTOR_MULTIPLIERS = {
            "Financial Services": 1.00, "Healthcare & Life Sciences": 1.00,
            "Public Sector / Government": 0.95, "Legal & Professional Services": 0.92,
            "Technology & SaaS": 0.88, "Retail & E-commerce": 0.85,
            "Education": 0.82, "Manufacturing & Logistics": 0.80, "Other": 0.90
        };
        const SECTION_WEIGHTS = { s1: 0.14, s2: 0.20, s3: 0.10, s4: 0.16, s5: 0.16, s6: 0.18, s7: 0.06 };
        const BASE_MAX = { s1: 12, s2: 18, s3: 12, s4: 12, s5: 15, s6: 15, s7: 15 };
        const RISK_BANDS = [
            { min: 80, label: "LOW", color: [22, 101, 52] },
            { min: 65, label: "LOW-MODERATE", color: [6, 95, 70] },
            { min: 45, label: "MODERATE", color: [180, 140, 0] },
            { min: 25, label: "HIGH", color: [153, 27, 27] },
            { min: 0,  label: "CRITICAL", color: [130, 0, 0] }
        ];

        status.innerText = "CALCULATING WEIGHTED SCORES...";
        
        // --- 2. Scoring Engine ---
        let scores = data.section_scores;
        if (typeof scores === 'string') scores = JSON.parse(scores);
        
        let weightedScore = 0;
        Object.keys(SECTION_WEIGHTS).forEach(s => {
            let sVal = scores[s] || 0;
            weightedScore += (sVal / BASE_MAX[s]) * 100 * SECTION_WEIGHTS[s];
        });

        const multiplier = SECTOR_MULTIPLIERS[data.sector] || 0.90;
        const adjustedScore = Math.round(weightedScore * multiplier);

        // --- 3. Band Selection & Elevation ---
        let bandIdx = RISK_BANDS.findIndex(b => adjustedScore >= b.min);
        // Uncertainty Trigger (Framework Part 4)
        if ((data.uncertainty_count || 0) >= 3) {
            bandIdx = Math.max(0, Math.min(bandIdx + 1, 4));
        }
        const band = RISK_BANDS[bandIdx];

        status.innerText = "GENERATING PDF DOCUMENT...";

        // --- 4. PDF Rendering ---
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        // Cover
        doc.setFillColor(0, 26, 58).rect(0, 0, 210, 297, 'F');
        doc.setTextColor(255, 255, 255).setFontSize(26).text(data.organisation || 'Diagnostic Report', 20, 60);
        
        // Score Box
        doc.setFillColor(...band.color).rect(20, 80, 170, 45, 'F');
        doc.setFontSize(36).text(adjustedScore + "%", 30, 105);
        doc.setFontSize(14).text("RISK LEVEL: " + band.label, 30, 118);

        // Priority Section
        doc.addPage();
        doc.setTextColor(0, 26, 58).setFontSize(16).text("PRIORITY REGULATORY GAPS", 20, 30);
        
        let flags = data.priority_flags;
        if (typeof flags === 'string') flags = JSON.parse(flags);
        if (!Array.isArray(flags)) flags = [];

        let y = 45;
        flags.forEach(f => {
            doc.setFillColor(252, 228, 232).rect(20, y, 170, 22, 'F');
            doc.setTextColor(153, 27, 27).setFontSize(9).text(f.label || "Flag", 25, y + 8);
            doc.setTextColor(100, 116, 139).setFontSize(7).text("Basis: " + (f.basis || "General Compliance"), 25, y + 16);
            y += 28;
        });

        status.innerText = "DOWNLOAD STARTING...";
        doc.save(`MLA_Report_${data.organisation || 'Diagnostic'}.pdf`);
        
        // Close window after download
        setTimeout(() => { status.innerText = "COMPLETE."; }, 2000);

    } catch (err) {
        console.error("PDF Engine Error:", err);
        status.innerHTML = "ERROR: " + err.message + "<br><br>Check the Console (F12) for details.";
    }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: sans-serif;
    background: #001A3A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4466FF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.6; }
  iframe { display: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>Generating your report...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
  // ==========================================
  // 1. GLOBAL SCOPE TOOLS & DATA
  // ==========================================
  let RESULTS = {};
  const WEIGHTS = { s1:0.20, s2:0.18, s3:0.16, s4:0.16, s5:0.14, s6:0.10, s7:0.06 };
  const FINDING_DATA = {}; 
  const REGIME_FINDING = { section:'Regulatory', severity:'high', impact:'Regulatory misalignment detected.', rec:'Review alignment.' };

  // --- HELPER FUNCTIONS ---
  function ps(str) {
    if (!str) return '';
    return str.toString()
      .replace(/\u2014|\u2013/g, '-')
      .replace(/\u2018|\u2019/g, "'")
      .replace(/\u201C|\u201D/g, '"')
      .replace(/\u2026/g, '...')
      .replace(/[^\x00-\xFF]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function pdfPageHeader(doc, W, M, navy, rc, sectionTitle, today) {
    doc.setFillColor(...navy).rect(0, 0, W, 34, 'F');
    doc.setFillColor(...rc).rect(0, 34, W, 1.5, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255).text('MLA GROUP', M, 12);
    doc.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(120, 155, 200).text('AI GOVERNANCE RISK ASSESSMENT', M, 19);
    doc.setFontSize(7.5).setTextColor(160, 185, 215).text(sectionTitle, M, 28);
    doc.setFontSize(6.5).setTextColor(80, 110, 155).text(today, W - M, 19, { align: 'right' });
  }

  function pdfPageFooter(doc, W, M, navy, rc, today, pageNum) {
    doc.setFillColor(...navy).rect(0, 284, W, 13, 'F');
    doc.setFillColor(...rc).rect(0, 284, W, 1, 'F');
    doc.setFont('helvetica', 'normal').setFontSize(6.5).setTextColor(140, 170, 210);
    doc.text('MLA Group  |  mlagroup.co.uk', M, 290);
    doc.text('Page ' + pageNum, W - M, 290, { align: 'right' });
  }

  function newPage(doc, W, M, navy, rc, heading, today, pageNum) {
    doc.addPage();
    pdfPageHeader(doc, W, M, navy, rc, heading, today);
    return 44; 
  }

  function drawBar(doc, x, y, totalW, h, pct, fillRGB) {
    doc.setFillColor(215, 222, 232).rect(x, y, totalW, h, 'F');
    if (pct > 0) {
      doc.setFillColor(...fillRGB);
      doc.rect(x, y, Math.max(1, Math.round(pct * totalW / 100)), h, 'F');
    }
  }

  function textBlock(doc, text, x, y, maxW, fontSize, fontStyle, colorRGB, lineH) {
    doc.setFont('helvetica', fontStyle || 'normal').setFontSize(fontSize || 8).setTextColor(...(colorRGB || [50, 60, 75]));
    const lines = doc.splitTextToSize(text, maxW);
    doc.text(lines, x, y);
    return y + (lines.length * (lineH || 4.8));
  }

  function pdfSectionHead(doc, W, M, navy, label, y) {
    doc.setFillColor(...navy).rect(M, y, W - M * 2, 8, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(7.5).setTextColor(255, 255, 255).text(label, M + 4, y + 5.6);
    return y + 13;
  }

  // ==========================================
  // 2. TRIGGER LOGIC
  // ==========================================
  const frame = document.getElementById('pdf-frame');
  frame.addEventListener('load', function() {
    const portalResult = sessionStorage.getItem('portal_result');
    if (!portalResult) { console.error("No data found"); return; }
    
    RESULTS = JSON.parse(portalResult);
    
    // Pass data into the iframe context
    const fw = frame.contentWindow;
    fw.RESULTS = RESULTS;
    
    setTimeout(() => {
      makePDF();
    }, 1500);
  });

  // ==========================================
  // 3. THE PDF ENGINE
  // ==========================================
  function makePDF() {
    const { jsPDF } = window.jspdf;
    if (!jsPDF || !RESULTS.band) { alert("Data or library error"); return; }

    try {
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const W = 210, M = 18, TW = W - (M*2);
      const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const navy = [0, 26, 58], blue = [26, 107, 255], white = [255, 255, 255];
      const bc = RESULTS.band.id;
      const rcMap = { critical:[180,35,35], high:[165,55,55], moderate:[185,115,0], low:[22,145,65] };
      const rc = rcMap[bc] || blue;

      // --- PAGE 1: COVER ---
      doc.setFillColor(...navy).rect(0, 0, W, 297, 'F');
      doc.setFillColor(...rc).rect(0, 0, W, 6, 'F');
      doc.setFont('helvetica', 'bold').setFontSize(24).setTextColor(...white).text(ps(RESULTS.organisation), M, 65);
      doc.setFontSize(16).setTextColor(...rc).text(ps(RESULTS.band.label), M, 80);
      doc.setFontSize(28).text(RESULTS.adjustedScore + '%', M, 100);

      // --- PAGE 2: BREAKDOWN ---
      let pageNum = 2;
      let y = newPage(doc, W, M, navy, rc, '2. MATURITY BREAKDOWN', today, pageNum);
      
      y = pdfSectionHead(doc, W, M, navy, 'Domain Performance', y);
      
      ['s1','s2','s3','s4','s5','s6','s7'].forEach((sec, i) => {
        const p  = RESULTS.sectionPcts[sec] || 0;
        const nm = RESULTS.sectionNames[sec] || sec;
        const barColor = p >= 75 ? [22,145,65] : p >= 50 ? [185,115,0] : [165,55,55];

        doc.setFillColor(248, 249, 252).rect(M, y, TW, 10, 'F');
        doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(30, 40, 50);
        doc.text(nm, M + 3, y + 6.5);
        
        drawBar(doc, M + 120, y + 3.5, 30, 3.5, p, barColor);
        doc.setFont('helvetica', 'bold').text(p + '%', W - M - 5, y + 6.5, { align: 'right' });
        y += 11;
      });

      pdfPageFooter(doc, W, M, navy, rc, today, pageNum);

      // --- SAVE ---
      const filename = `MLA-Report-${ps(RESULTS.organisation).replace(/\s+/g, '-')}.pdf`;
      doc.save(filename);
      
      // Auto-close page after completion
      setTimeout(() => window.close(), 3000);

    } catch (err) {
      console.error("PDF Fail:", err);
      alert("Error generating PDF: " + err.message);
    }
  }
</script>
</body>
</html>

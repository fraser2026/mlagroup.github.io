<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    background: #001A3A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4466FF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.8; }
  iframe { display: none; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status-text">Synthesising diagnostic data and generating full report...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
  // ==========================================
  // 1. GLOBAL HELPERS & CONFIG
  // ==========================================
  const navy = [0, 26, 58], blue = [26, 107, 255], white = [255, 255, 255];
  const rcMap = { critical:[180,35,35], high:[165,55,55], moderate:[185,115,0], lowmod:[170,120,0], low:[22,145,65] };

  function ps(str) {
    if (!str) return '';
    return str.toString()
      .replace(/\u2014|\u2013/g, '-')
      .replace(/\u2018|\u2019/g, "'")
      .replace(/\u201C|\u201D/g, '"')
      .replace(/\u2026/g, '...')
      .replace(/[^\x00-\xFF]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function textBlock(doc, text, x, y, maxW, fontSize, fontStyle, colorRGB) {
    doc.setFont('helvetica', fontStyle || 'normal').setFontSize(fontSize || 8).setTextColor(...(colorRGB || [50, 60, 75]));
    const lines = doc.splitTextToSize(text, maxW);
    doc.text(lines, x, y);
    return y + (lines.length * 5);
  }

  // ==========================================
  // 2. THE TRIGGER
  // ==========================================
  window.addEventListener('load', () => {
    const data = sessionStorage.getItem('portal_result');
    if (!data) return;
    const RESULTS = JSON.parse(data);
    
    // Allow the iframe a moment to render so we can scrape recommendations if needed
    setTimeout(() => {
      generateFullReport(RESULTS);
    }, 2000);
  });

  // ==========================================
  // 3. FULL LOGIC ENGINE
  // ==========================================
  function generateFullReport(RESULTS) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const W = 210, M = 18, TW = W - (M*2);
    const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    
    try {
      const rc = rcMap[RESULTS.band?.id] || blue;
      const org = ps(RESULTS.organisation || "Organisation");

      // --- PAGE 1: COVER (FULL LOGIC) ---
      doc.setFillColor(...navy).rect(0, 0, W, 297, 'F');
      doc.setFillColor(...rc).rect(0, 0, W, 6, 'F');
      
      doc.setFont('helvetica', 'bold').setFontSize(24).setTextColor(...white);
      doc.text(org, M, 70);
      
      doc.setFontSize(18).setTextColor(...rc);
      doc.text(ps(RESULTS.band?.label || "Report"), M, 85);
      
      doc.setFontSize(32).text(RESULTS.adjustedScore + '%', M, 105);
      doc.setFontSize(10).setTextColor(100, 130, 170).text('AI GOVERNANCE MATURITY SCORE', M, 115);

      // --- PAGE 2: EXECUTIVE SUMMARY ---
      doc.addPage();
      doc.setFillColor(...navy).rect(0, 0, W, 34, 'F');
      doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(...white).text('1. EXECUTIVE SUMMARY', M, 20);
      
      let y = 50;
      doc.setFont('helvetica', 'bold').setFontSize(12).setTextColor(...navy).text('Assessment Overview', M, y);
      y += 10;
      y = textBlock(doc, ps(RESULTS.band?.summary || ""), M, y, TW, 9, 'normal', [60, 70, 80]);
      
      // --- PAGE 3: FINDINGS LOGIC ---
      doc.addPage();
      y = 30;
      doc.setFont('helvetica', 'bold').setFontSize(12).setTextColor(...navy).text('2. DETAILED FINDINGS', M, y);
      y += 12;

      const findings = [];
      if (RESULTS.priorityFlags) {
        RESULTS.priorityFlags.forEach(f => {
          findings.push({ label: f.label, basis: f.basis, severity: f.severity || 'high' });
        });
      }

      findings.forEach((f, i) => {
        if (y > 260) { doc.addPage(); y = 30; }
        doc.setFillColor(245, 248, 252).rect(M, y, TW, 20, 'F');
        doc.setFillColor(...(rcMap[f.severity] || blue)).rect(M, y, 2, 20, 'F');
        
        doc.setFont('helvetica', 'bold').setFontSize(9).setTextColor(...navy);
        doc.text(ps(f.label), M + 5, y + 7);
        
        doc.setFont('helvetica', 'normal').setFontSize(7.5).setTextColor(100, 110, 130);
        const basisLines = doc.splitTextToSize(ps("Basis: " + f.basis), TW - 10);
        doc.text(basisLines, M + 5, y + 13);
        y += 25;
      });

      // --- PAGE 4: REGULATORY ALIGNMENT ---
      doc.addPage();
      doc.setFont('helvetica', 'bold').setFontSize(12).text('3. REGULATORY FRAMEWORK ALIGNMENT', M, 30);
      y = 45;
      
      const regs = [
        ['EU AI Act', 'Governance, risk classification, and transparency obligations.'],
        ['UK GDPR', 'Automated decision-making and DPIA requirements.'],
        ['FCA Resilience', 'Operational risk and senior manager accountability.']
      ];

      regs.forEach(([title, desc]) => {
        doc.setFont('helvetica', 'bold').setFontSize(9).text(title, M, y);
        doc.setFont('helvetica', 'normal').setFontSize(9).text(desc, M + 50, y);
        y += 10;
      });

      // --- SAVE ---
      doc.save(`MLA-Full-Report-${org.replace(/\s+/g, '-')}.pdf`);
      
      document.getElementById('status-text').innerText = "Report Complete.";
      setTimeout(() => window.close(), 3000);

    } catch (err) {
      console.error(err);
      document.getElementById('status-text').innerText = "Error in logic: " + err.message;
    }
  }
</script>
</body>
</html>

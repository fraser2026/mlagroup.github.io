<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generating Your Report...</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #F7F8FC; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: white; border-radius: 14px; padding: 48px 56px; text-align: center; box-shadow: 0 4px 24px rgba(0,26,58,0.10); max-width: 420px; width: 90%; }
    h2 { margin-bottom: 10px; color: #001A3A; font-size: 1.3rem; }
    p  { color: #5A6B82; margin-bottom: 24px; font-size: 0.9rem; }
    .spinner { width: 44px; height: 44px; border: 4px solid #E2E8F4; border-top-color: #0000FF; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: inline-block; padding: 11px 24px; background: #0000FF; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 0.88rem; font-weight: 600; text-decoration: none; margin-top: 10px; }
    .check { font-size: 2.5rem; margin-bottom: 12px; display: none; color: #22C55E; }
  </style>
</head>
<body>

<div class="box">
  <div id="spinner" class="spinner"></div>
  <div id="check" class="check">✓</div>
  <h2 id="heading">Preparing Your Report</h2>
  <p id="status">Building your PDF...</p>
  <div id="action-area"></div>
  <a href="portal.html" class="btn" id="back-btn" style="display:none; background:#64748b; margin-top:20px;">Back to Dashboard</a>
</div>

<script>
// --- CORE HELPERS ---
function setStatus(msg) { document.getElementById('status').textContent = msg; }

function showSuccess(blob, isIOS) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('check').style.display = 'block';
  document.getElementById('back-btn').style.display = 'inline-block';

  if (isIOS && blob) {
    document.getElementById('heading').textContent = 'Report Ready';
    setStatus('Safari requires a tap to open the PDF:');
    
    const btn = document.createElement('button');
    btn.textContent = 'View PDF Report';
    btn.className = 'btn';
    btn.onclick = function() {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    };
    document.getElementById('action-area').appendChild(btn);
  } else {
    document.getElementById('heading').textContent = 'Report Downloaded';
    setStatus('Your PDF has been saved to your downloads folder.');
  }
}

// --- YOUR ORIGINAL DESIGN HELPERS ---
var _FRAMEWORK = { version: '2.0.0', date: 'February 2026' };
var _SECTION_NAMES = { s1: 'AI Inventory', s2: 'Governance', s3: 'Data Quality', s4: 'Human Oversight', s5: 'Explainability', s6: 'Compliance', s7: 'Resilience' };
var _RISK_BANDS = [
  { min: 80, max: 100, id: 'low', label: 'Low Risk', heading: 'Governance Established', summary: 'Strong AI governance maturity.' },
  { min: 0, max: 79, id: 'moderate', label: 'Moderate/High Risk', heading: 'Intervention Required', summary: 'Gaps detected in framework.' }
];

function _ps(s) { return s ? String(s).replace(/[^\x00-\xFF]/g, '').trim() : ''; }

function _drawBar(doc, x, y, w, h, pct, c) {
  doc.setFillColor(230, 235, 245); doc.rect(x, y, w, h, 'F');
  doc.setFillColor(c[0], c[1], c[2]);
  doc.rect(x, y, (pct / 100) * w, h, 'F');
}

function _hdr(doc, W, M, nv, rc, sec, dt) {
  doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(0, 0, W, 34, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(255);
  doc.text('MLA GROUP', M, 12);
  doc.setFontSize(7); doc.text(sec, M, 28);
}

function _ftr(doc, W, M, nv, rc, dt, pg) {
  doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(0, 284, W, 13, 'F');
  doc.setFontSize(6); doc.setTextColor(255);
  doc.text('Page ' + pg, W - M, 290, { align: 'right' });
}

function _np(doc, W, M, nv, rc, heading, dt, pg) {
  doc.addPage(); _hdr(doc, W, M, nv, rc, heading, dt); return 44;
}

function _recon(row) {
  const score = row.adjusted_score || 0;
  const band = _RISK_BANDS.find(b => score >= b.min && score <= b.max) || _RISK_BANDS[1];
  return { adjustedScore: score, band: band, sectionPcts: row.section_scores || {}, respondentName: row.respondent_name || row.organisation };
}

// --- MAIN GENERATOR ---
function generatePortalPDF(row) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 18, TW = W - M * 2;
  const R = _recon(row);
  const today = new Date().toLocaleDateString('en-GB');
  const nv = [0, 26, 58], rc = [26, 107, 255];

  try {
    // COVER PAGE
    doc.setFillColor(nv[0], nv[1], nv[2]); doc.rect(0, 0, W, 297, 'F');
    doc.setTextColor(255); doc.setFontSize(24);
    doc.text(_ps(row.organisation), M, 60);
    doc.setFontSize(14);
    doc.text(R.band.label + ' (' + R.adjustedScore + '%)', M, 80);

    // RESULTS PAGE
    let y = _np(doc, W, M, nv, rc, 'ASSESSMENT RESULTS', today, 2);
    Object.keys(_SECTION_NAMES).forEach((s, i) => {
      const p = R.sectionPcts[s] || 0;
      doc.setTextColor(40); doc.setFontSize(9);
      doc.text(_SECTION_NAMES[s], M, y);
      _drawBar(doc, M + 80, y - 3, 40, 4, p, rc);
      y += 12;
    });
    _ftr(doc, W, M, nv, rc, today, 2);

    // --- SAVE LOGIC ---
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const fn = 'MLA-Report-' + _ps(row.organisation).replace(/\s+/g, '-') + '.pdf';

    if (isIOS) {
      const blob = doc.output('blob');
      showSuccess(blob, true);
    } else {
      doc.save(fn);
      showSuccess(null, false);
    }
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message);
  }
}

// --- INITIALIZER ---
window.addEventListener('load', function() {
  const raw = sessionStorage.getItem('portal_result');
  if (raw) {
    generatePortalPDF(JSON.parse(raw));
  } else {
    setStatus('No data found.');
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generating your report...</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { font-family: sans-serif; background: #001A3A; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; flex-direction: column; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #4466FF; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 0.95rem; opacity: 0.8; }
  iframe { visibility: hidden; position: absolute; left: -9999px; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status">Syncing diagnostic logic and building PDF...</p>
  <iframe id="pdf-frame" src="diagnostic.html"></iframe>

<script>
// ==========================================
// GLOBAL HELPERS
// ==========================================
function ps(str) {
  if (!str || str === 'undefined') return '';
  return str.toString()
    .replace(/\u2014|\u2013/g, '-')
    .replace(/\u2018|\u2019/g, "'")
    .replace(/\u201C|\u201D/g, '"')
    .replace(/[^\x00-\xFF]/g, '')
    .trim();
}

const navy = [0, 26, 58], blue = [26, 107, 255];
const rcMap = { critical:[180,35,35], high:[165,55,55], moderate:[185,115,0], low:[22,145,65] };

// ==========================================
// TRIGGER LOGIC
// ==========================================
const frame = document.getElementById('pdf-frame');

frame.addEventListener('load', function() {
  const dataString = sessionStorage.getItem('portal_result');
  if (!dataString) {
    document.getElementById('status').innerText = "Critical Error: No data found in session.";
    return;
  }

  const RESULTS = JSON.parse(dataString);

  // We wait slightly longer (2.5s) to ensure the internal logic of the iframe has rendered findings
  setTimeout(() => {
    // Scrape from the iframe's DOM
    const iframeDoc = frame.contentWindow.document;
    const recommendations = Array.from(iframeDoc.querySelectorAll('#recs .rec-item'))
      .map(el => el.innerText)
      .filter(text => text.length > 0);

    // If findings aren't in the object, try to grab them from the UI
    const finalFindings = RESULTS.priorityFlags || [];

    makeFullPDF(RESULTS, recommendations, finalFindings);
  }, 2500);
});

// ==========================================
// THE ENGINE
// ==========================================
function makeFullPDF(RESULTS, recs, findings) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const W = 210, M = 18, TW = W - (M*2);
  const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  
  // Safety check for colors
  const bandId = (RESULTS.band && RESULTS.band.id) ? RESULTS.band.id : 'moderate';
  const rc = rcMap[bandId] || blue;
  const orgName = ps(RESULTS.organisation) || "Confidential Assessment";

  try {
    // PAGE 1: COVER
    doc.setFillColor(...navy).rect(0, 0, W, 297, 'F');
    doc.setFillColor(...rc).rect(0, 0, W, 6, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(26).setTextColor(255, 255, 255).text(orgName, M, 70);
    doc.setFontSize(14).setTextColor(...rc).text(ps(RESULTS.band?.label || "AI Governance Report"), M, 82);
    doc.setFontSize(32).setTextColor(255, 255, 255).text((RESULTS.adjustedScore || 0) + '%', M, 110);
    doc.setFontSize(10).setTextColor(120, 150, 190).text('MATURITY SCORE', M, 120);

    // PAGE 2: SUMMARY
    doc.addPage();
    doc.setFillColor(...navy).rect(0, 0, W, 34, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255).text('1. EXECUTIVE SUMMARY', M, 20);
    
    let y = 50;
    doc.setFont('helvetica', 'bold').setFontSize(12).setTextColor(...navy).text('Perspective', M, y);
    y += 10;
    const summary = ps(RESULTS.band?.summary || "Assessment complete.");
    const summaryLines = doc.splitTextToSize(summary, TW);
    doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(60, 70, 80).text(summaryLines, M, y);

    // PAGE 3: MATURITY TABLE
    doc.addPage();
    doc.setFillColor(...navy).rect(0, 0, W, 34, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255).text('2. DOMAIN BREAKDOWN', M, 20);
    
    y = 50;
    const sections = RESULTS.sectionNames || {};
    const pcts = RESULTS.sectionPcts || {};
    
    Object.keys(sections).forEach(key => {
      const p = pcts[key] || 0;
      doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(40, 50, 60).text(ps(sections[key]), M, y);
      // Progress Bar
      doc.setFillColor(230, 230, 230).rect(M + 80, y-3, 50, 4, 'F');
      doc.setFillColor(...rc).rect(M + 80, y-3, (p * 50 / 100), 4, 'F');
      doc.setFont('helvetica', 'bold').text(p + '%', W - M, y, { align: 'right' });
      y += 12;
    });

    // PAGE 4: FINDINGS
    doc.addPage();
    doc.setFillColor(...navy).rect(0, 0, W, 34, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(255, 255, 255).text('3. DETAILED FINDINGS', M, 20);
    y = 50;
    findings.forEach(f => {
      if(y > 250) { doc.addPage(); y = 50; }
      doc.setFont('helvetica', 'bold').setFontSize(9).setTextColor(...navy).text(ps(f.label), M, y);
      y += 5;
      const bLines = doc.splitTextToSize(ps(f.basis), TW);
      doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(80, 80, 80).text(bLines, M, y);
      y += (bLines.length * 4) + 8;
    });

    // FINALIZE
    doc.save(`MLA-Report-${orgName.replace(/\s+/g, '-')}.pdf`);
    document.getElementById('status').innerText = "Report Downloaded.";
    setTimeout(() => window.close(), 3000);

  } catch (err) {
    console.error(err);
    document.getElementById('status').innerText = "PDF Generation Error: " + err.message;
  }
}
</script>
</body>
</html>

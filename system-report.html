  --border: #E6EBF1;

  --border-lg: #0A2540;
  --text-1: #0A0E14;
  --text-2: #425466;
  --text-3: #697386;
  --blue: #533AFD;
  --blue-lt: #533AFD;
  --blue-glow: rgba(83,58,253,0.08);
  --critical: #CD3D64;
  --high: #C45C26;
  --moderate: #92400e;
  --lowmod: #533AFD;
  --low: #24B47E;
  --gold: #0A2540;

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text-2);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;

#ls{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .4s ease}
#ls.out{opacity:0;pointer-events:none}
.ls-logo{font-family:var(--font-brand);font-size:1.1rem;font-weight:500;letter-spacing:-.025em;color:var(--text-1);margin-bottom:28px}
.ls-logo em{font-style:normal;font-weight:400;color:var(--text-3)}
.ls-track{width:200px;height:2px;background:var(--border);overflow:hidden}
.ls-fill{height:100%;width:0;background:var(--blue);animation:lp 2s ease forwards}
@keyframes lp{to{width:88%}}
.ls-msg{font-size:.75rem;color:var(--text-3);margin-top:14px;min-height:18px}

#es{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px}
#es.show{display:flex}
.es-ico{font-size:1.5rem;opacity:.4;margin-bottom:4px}
.es-title{font-family:var(--font-brand);font-size:1.1rem;font-weight:500;color:var(--text-1)}
.es-msg{font-size:.88rem;color:var(--text-2);max-width:360px;text-align:center;line-height:1.6}
.es-btn{margin-top:12px;padding:10px 20px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:var(--r);font-family:var(--font-body);font-size:.85rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}

#rpt{display:none}

.rnav{position:sticky;top:0;height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100}

.rnav-links a:hover{color:var(--text-1);background:rgba(6,27,49,.04)}

.rnav-r{display:flex;align-items:center;gap:10px}
.conf-badge{font-size:.72rem;letter-spacing:.02em;color:var(--text-3);border:1px solid var(--border);padding:4px 10px;border-radius:var(--r)}

.hero{padding:48px 0 32px;position:relative;border-bottom:1px solid var(--border)}

.hero-inner{max-width:920px;margin:0 auto;padding:0 28px;width:100%;display:grid;grid-template-columns:1fr 220px;gap:48px;align-items:center}
.hero-eyebrow{font-family:var(--font-brand);font-size:.72rem;font-weight:500;letter-spacing:.03em;color:var(--text-3);margin-bottom:14px}
.hero-eyebrow::before{content:'';display:inline-block;width:20px;height:1px;background:var(--text-1);margin-right:10px;vertical-align:middle}
.hero-org{font-family:var(--font-brand);font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:500;line-height:1.1;letter-spacing:-.03em;color:var(--text-1);margin-bottom:14px}

.sc-track{fill:none;stroke:var(--border);stroke-width:8}

.rsec{max-width:920px;margin:0 auto;padding:48px 28px;border-bottom:1px solid var(--border)}

.bv-eyebrow,.sn-lbl,.acc-lbl,.tn-lbl,.mn-lbl,.dr-lbl{

.bv-text,.sn-txt,.acc-txt,.tn-txt,.mn-txt,.dr-txt{font-size:.88rem;color:var(--text-2);line-height:1.7}

.card,.pf-card,.dom-card,.bi,.rm-action,.rm-rationale{

table{width:100%;border-collapse:collapse;font-size:.85rem;margin:16px 0}
th{text-align:left;font-family:var(--font-brand);font-weight:500;font-size:.72rem;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--text-1);letter-spacing:.02em}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2);line-height:1.5}

.dom-row,.domain-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.dom-fill,.domain-fill,.sc-fill{background:var(--blue)!important}
.dom-track,.domain-bar{background:var(--border)!important;height:4px!important;border-radius:1px!important;overflow:hidden}

.find-tabs,.ft{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.ft{padding:7px 12px;border:1px solid var(--border);background:var(--bg);border-radius:var(--r);font-size:.78rem;font-weight:500;color:var(--text-3);cursor:pointer}
.ft.act,.ft.active{color:var(--text-1);border-color:var(--text-1)}
.fpanel{display:none}.fpanel.act,.fpanel.active,.fpanel.show{display:block}

.pill,.sev-pill,.badge-high,.badge-medium,.badge-low,.obl-reg,.report-badge{
  text-transform:none!important;letter-spacing:.02em!important;border-radius:var(--r)!important;
  background:transparent!important;border:none!important;padding:0!important;font-weight:600

.rfooter{max-width:920px;margin:0 auto;padding:28px;display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-top:1px solid var(--text-1)}
.rf-logo{font-family:var(--font-brand);font-weight:500;color:var(--text-1);text-decoration:none}
.rf-notice{font-size:.75rem;color:var(--text-3);line-height:1.6;max-width:520px}
.rf-ver{font-size:.72rem;color:var(--text-3);text-align:right}

.rm-phase::before{background:var(--border)!important}
.rm-marker{background:var(--blue)!important;border-radius:50%}
.rm-win,.rm-badge,.act-own{text-transform:none!important;letter-spacing:.02em!important;color:var(--text-3)!important;border:1px solid var(--border);padding:2px 8px;border-radius:var(--r);font-size:.68rem;font-weight:500}
.rm-name,.rsec-title,.hero-org{font-family:var(--font-brand)!important;font-weight:500!important}
.act-n{background:var(--surface-1);color:var(--text-1);border-radius:var(--r)!important}

@media(max-width:900px){
  .hero-inner{grid-template-columns:1fr;gap:28px}
  .rnav-links{display:none}
  .rsec{padding:36px 16px}
  .rnav{padding:0 16px}
  .hero-meta{grid-template-columns:1fr 1fr}
  .hero-meta-item:nth-child(2n){border-right:none}
  .rfooter{flex-direction:column}
}
@media print{
  .rnav,.pdf-btn,.find-tabs{display:none!important}
  body{background:#fff}
}

<script>
const SUPABASE_URL='https://hueftewwenjaiagdoqmb.supabase.co';
const SUPABASE_KEY='sb_publishable_Am0Ot4bWLoMb5pIhN50byQ_n3QIujY5';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(window.location.search);
const ASSESS_ID=params.get('aid');

const BAND_L={high:'High Risk',medium:'Medium Risk',low:'Low Risk'};
const BAND_C={high:'#CD3D64',medium:'#C45C26',low:'#24B47E'};

  const{data:sys}=await sb.from('ai_systems').select('*').eq('id',assess.system_id).single();
  const{data:org}=await sb.from('organisations').select('name').eq('id',assess.org_id).single();
  const{data:profile}=await sb.from('profiles').select('full_name').eq('id',assess.requested_by).single();

  renderReport(assess,sys||{},org||{},profile||{});
}

function renderReport(a,sys,org,profile){
  const band=a.risk_band||'medium';
  const score=a.overall_score||0;
  const ss=a.section_scores||{};
  const tv=a.tier_validation;
  const col=BAND_C[band];
  const circ=2*Math.PI*48;
  const dashOffset=circ-(circ*(score/100));
  const today=new Date(a.requested_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  // Build priority flags from section scores
  const flags=[];
  Object.entries(ss).forEach(([id,d])=>{
    if(d.score<40){const rm=REG_MAP[id];flags.push({section:d.title,score:d.score,regulatory:rm?rm.articles[0]:''})}
  });

  // Build recommendations from low-scoring sections
  const recs=[];
  Object.entries(ss).forEach(([id,d])=>{
    if(d.score<70&&RECS_BY_SECTION[id]){RECS_BY_SECTION[id].forEach(r=>{if(recs.length<8)recs.push(r)})}
  });

  // Build engaged regulations
  const engagedRegs=[];
  Object.entries(ss).forEach(([id,d])=>{
    const rm=REG_MAP[id];if(rm)rm.articles.forEach(art=>{engagedRegs.push({title:art,desc:rm.desc,sectionScore:d.score})})
  });

  const c=document.getElementById('report-container');
  c.innerHTML=`
    <div class="report-hero">
      <div class="report-badge badge-${band}"><span class="badge-dot"></span>${BAND_L[band]} — System Governance Assessment</div>
      <div class="report-sublabel">AI System Governance Report — Prepared by RegAnchor</div>
      <div class="report-sys-name">${esc(sys.name||'AI System')}</div>
      <div class="report-desc">${esc(sys.description||'This report presents findings of the AI system governance assessment, evaluating maturity across 7 governance domains and mapping regulatory exposure.')}</div>
      <div class="report-meta">
        <div class="meta-cell"><div class="meta-label">Organisation</div><div class="meta-val">${esc(org.name||'—')}</div></div>
        <div class="meta-cell"><div class="meta-label">System Owner</div><div class="meta-val">${esc(sys.system_owner||'—')}</div></div>
        <div class="meta-cell"><div class="meta-label">Risk Tier</div><div class="meta-val">${sys.risk_tier?'<em style="opacity:.6;font-style:italic;">Suggested</em> '+esc(TIER_L[sys.risk_tier]||sys.risk_tier):'Unclassified'}</div></div>
        <div class="meta-cell"><div class="meta-label">Assessment Date</div><div class="meta-val">${today}</div></div>
      </div>
    </div>

    <!-- Overall Score -->
    <div class="score-hero">
      <div class="score-ring">
        <svg viewBox="0 0 120 120">
          <circle class="score-ring-bg" cx="60" cy="60" r="48"/>
          <circle class="score-ring-fill" cx="60" cy="60" r="48" stroke="#533AFD" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}"/>
        </svg>
        <div class="score-center">
          <div class="score-center-num">${score}%</div>
          <div class="score-center-label">Score</div>
        </div>
      </div>
      <div class="score-info">
        <h3>${BAND_L[band]}</h3>
        <p>${BAND_DESC[band]}</p>
      </div>
    </div>

    ${tv&&tv.mismatch?`<div class="tier-alert"><div class="tier-alert-title">Risk Tier Mismatch Detected</div><div class="tier-alert-body">${esc(tv.message||'Assessment responses suggest this system may require a higher risk classification than currently assigned. RegAnchor recommends reviewing the classification against EU AI Act Annex III criteria.')}</div></div>`:''}

    <!-- Section Scores -->
    <div class="rpt-card">
      <div class="section-label">Section 01</div>
      <div class="rpt-card-title">Governance Maturity by Domain</div>
      ${Object.entries(ss).map(([id,d])=>{
        const pct=d.score||0;
        const c2=pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)';
        return `<div class="domain-row"><span class="domain-name">${esc(d.title||id)}</span><div class="domain-bar"><div class="domain-fill" style="width:${pct}%;"></div></div><span class="domain-pct">${pct}%</span></div>`;
      }).join('')}
    </div>

    ${flags.length?`<div class="rpt-card">
      <div class="section-label">Section 02</div>
      <div class="rpt-card-title">Priority Governance Gaps</div>
      <p style="font-size:.78rem;color:var(--muted);margin-bottom:14px;line-height:1.6;">The following domains scored below 40% and represent critical governance gaps requiring immediate attention.</p>
      ${flags.map(f=>`<div class="flag-item"><div class="flag-icon flag-high">!</div><div><div class="flag-text"><strong>${esc(f.section)}</strong> scored ${f.score}% — significantly below the minimum governance threshold.</div><div class="flag-reg">${esc(f.regulatory)}</div></div></div>`).join('')}
    </div>`:''}

    <!-- Regulatory Mapping -->
    <div class="rpt-card">
      <div class="section-label">Section 0${flags.length?'3':'2'}</div>
      <div class="rpt-card-title">Regulatory Obligations Engaged</div>
      <p style="font-size:.78rem;color:var(--muted);margin-bottom:14px;line-height:1.6;">Based on the assessment responses, the following regulatory articles and obligations are engaged for this AI system.</p>
      ${engagedRegs.slice(0,10).map(r=>`<div class="reg-item"><div class="reg-title">${esc(r.title)}</div><div class="reg-desc">${esc(r.desc)}</div></div>`).join('')}
    </div>

    ${recs.length?`<div class="rpt-card">
      <div class="section-label">Section 0${flags.length?'4':'3'}</div>
      <div class="rpt-card-title">Recommended Next Steps</div>
      <p style="font-size:.78rem;color:var(--muted);margin-bottom:14px;line-height:1.6;">The following actions address the governance gaps identified in this assessment, prioritised by regulatory significance.</p>
      ${recs.map((r,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${esc(r)}</div></div>`).join('')}
    </div>`:''}

    <div class="report-footer">
      <p><strong style="color:var(--main);">MLA Group Ltd</strong> — AI Governance & Risk Consultancy<br><br>
      This report represents a structured assessment of the governance position of the named AI system at a single point in time. It does not constitute legal advice, regulatory certification, or audit opinion. Assessment version ${esc(a.questionnaire_version||'1.0.0')}. Report generated ${today}.</p>
    </div>
  `;

  // Animate score ring
  setTimeout(()=>{const fill=document.querySelector('.score-ring-fill');if(fill)fill.style.strokeDashoffset=dashOffset},100);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

init();
</script>
</body>
</html>

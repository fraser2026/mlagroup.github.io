<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegAnchor | AI Governance</title>
    
    <!-- Professional Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FFFFFF;
            --fg: #0A0E14;
            --fg-muted: #4B5563;
            --border: #1F2937;
            /* Default Light Mode Colors for the Gradient */
            --gradient-1: #6366F1;
            --gradient-2: #A855F7;
            --gradient-3: #EC4899;
            --gradient-4: #F97316;
        }

        html[data-theme="dark"] {
            --bg: #030712;
            --fg: #FFFFFF;
            --fg-muted: #9CA3AF;
            --border: #FFFFFF;
            /* Deep, dark "Satin" palette for Dark Mode */
            --gradient-1: #1E1B4B;
            --gradient-2: #4C1D95;
            --gradient-3: #701A75;
            --gradient-4: #0F172A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; overflow: hidden; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--fg); transition: background 0.5s ease; }

        /* THE ENGINE: This canvas handles the WebGL math */
        #gradient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            --gradient-color-1: var(--gradient-1);
            --gradient-color-2: var(--gradient-2);
            --gradient-color-3: var(--gradient-3);
            --gradient-color-4: var(--gradient-4);
        }

        /* THE UI: Floating above the canvas */
        .page-content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            pointer-events: none; /* Allows interactions to pass through to canvas if needed */
        }

        header, footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--fg-muted);
            pointer-events: auto;
        }

        header { border-top: 1px solid var(--border); padding-top: 24px; }
        footer { border-bottom: 1px solid var(--border); padding-bottom: 24px; }

        main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .wordmark {
            font-size: clamp(60px, 12vw, 160px);
            font-weight: 500;
            letter-spacing: -0.04em;
            line-height: 0.85;
            margin-bottom: 30px;
            transform: translateY(20px);
            opacity: 0;
            animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .statement {
            font-size: clamp(20px, 2.5vw, 32px);
            line-height: 1.35;
            color: var(--fg-muted);
            max-width: 800px;
            transform: translateY(20px);
            opacity: 0;
            animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .statement strong { color: var(--fg); font-weight: 600; }

        @keyframes reveal {
            to { transform: translateY(0); opacity: 1; }
        }

        .theme-toggle {
            background: var(--fg);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .theme-toggle:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- 1. THE GRADIENT CANVAS -->
    <canvas id="gradient-canvas" data-js-training="false" data-transition-in></canvas>

    <!-- 2. THE PAGE OVERLAY -->
    <div class="page-content">
        <header>
            <div>In Development</div>
            <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
        </header>

        <main>
            <h1 class="wordmark">RegAnchor</h1>
            <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
        </main>

        <footer>
            <div>Coming 2026</div>
            <div>reganchor.com</div>
        </footer>
    </div>

    <!-- 3. THE ENGINE SCRIPT -->
    <!-- This links to the high-performance MiniGL engine used in the Stripe-style repos -->
    <script src="https://cdn.jsdelivr.net/gh/jordienr/gradient.js@master/dist/gradient.js"></script>
    
    <script>
        // Initialize the WebGL Gradient
        const gradient = new Gradient();
        gradient.initGradient("#gradient-canvas");

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            
            // Note: The gradient engine listens for CSS variable changes.
            // We force a slight re-render delay to ensure colors shift smoothly.
            setTimeout(() => {
                gradient.pause();
                gradient.play();
            }, 50);
        }

        // Auto-detect system preference
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>

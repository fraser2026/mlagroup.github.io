<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --fg-muted: #666666;
    --glass: rgba(79, 70, 229, 0.08);
    --accent: #4F46E5;
  }

  html[data-theme="dark"] {
    --bg: #0A0A0B;
    --fg: #FFFFFF;
    --fg-muted: #94A3B8;
    --glass: rgba(99, 102, 241, 0.12);
    --accent: #818CF8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'IBM Plex Sans', sans-serif; 
    background-color: var(--bg); 
    color: var(--fg);
    overflow: hidden;
  }

  /* --- THE UI FEATURE --- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* A sharp, vertical structural element—the "Anchor" */
  .anchor-pillar {
    width: 35vw;
    height: 120vh;
    background: linear-gradient(180deg, 
      transparent 0%, 
      var(--glass) 30%, 
      var(--glass) 70%, 
      transparent 100%
    );
    transform: rotate(-15deg);
    backdrop-filter: blur(80px);
    border-left: 1px solid rgba(128, 128, 128, 0.1);
    border-right: 1px solid rgba(128, 128, 128, 0.1);
    position: relative;
    overflow: hidden;
  }

  /* The "Scanning" Detail—high-end, thin, fast */
  .anchor-pillar::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent);
    opacity: 0.5;
    animation: scan 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes scan {
    0% { top: -10%; opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { top: 110%; opacity: 0; }
  }

  /* --- CONTENT LAYOUT --- */
  .page {
    position: relative;
    z-index: 10;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 30px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .header, .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  .header { border-top: 2px solid var(--fg); padding-top: 25px; }
  .footer { border-bottom: 2px solid var(--fg); padding-bottom: 25px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .wordmark {
    font-size: clamp(64px, 12vw, 180px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 0.85;
    margin-bottom: 40px;
  }

  .statement {
    font-size: clamp(20px, 2.4vw, 32px);
    line-height: 1.35;
    color: var(--fg-muted);
    max-width: 850px;
  }

  .statement strong { color: var(--fg); font-weight: 600; }

  .theme-btn {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="anchor-pillar"></div>
</div>

<div class="page">
  <div class="header">
    <div>System Status: Development</div>
    <button class="theme-btn" onclick="toggleTheme()">SWITCH MODE</button>
  </div>

  <div class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </div>

  <div class="footer">
    <div>Access Coming 2026</div>
    <div>reganchor.com</div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
</script>

</body>
</html>

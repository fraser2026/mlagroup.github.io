<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #0A0E14;
    --fg-2: #374151;
    --fg-3: #6B7280;
    --border-strong: #1F2937;
    --font-brand: 'IBM Plex Sans', sans-serif;
    
    /* Fixed Palette: Increased saturation so they don't wash out */
    --ribbon-1: rgba(99, 102, 241, 0.15);
    --ribbon-2: rgba(168, 85, 247, 0.15);
    --ribbon-3: rgba(236, 72, 153, 0.12);
    --ribbon-4: rgba(249, 115, 22, 0.12);
  }

  html[data-theme="dark"] {
    --bg: #06080E;
    --fg: #FFFFFF;
    --fg-2: #D8DAE0;
    --fg-3: #A0A6B0;
    --border-strong: #FFFFFF;
    --ribbon-1: rgba(99, 102, 241, 0.25);
    --ribbon-2: rgba(168, 85, 247, 0.25);
    --ribbon-3: rgba(236, 72, 153, 0.2);
    --ribbon-4: rgba(249, 115, 22, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font-brand); color: var(--fg); }

  /* === FIXED STAGE === */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .rotor {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    transform: rotate(-22deg); /* The diagonal angle */
  }

  .ribbon {
    position: absolute;
    width: 200%;
    height: 25vh;
    left: -50%;
    filter: blur(80px); /* Soften the edges */
    will-change: transform;
  }

  /* Striation effect using a repeating gradient */
  .ribbon::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.1) 0px, transparent 2px, transparent 20px);
  }

  .ribbon-1 { top: 10%; background: var(--ribbon-1); animation: flow 40s linear infinite; }
  .ribbon-2 { top: 35%; background: var(--ribbon-2); animation: flow 55s linear infinite reverse; }
  .ribbon-3 { top: 60%; background: var(--ribbon-3); animation: flow 45s linear infinite; }
  .ribbon-4 { top: 85%; background: var(--ribbon-4); animation: flow 60s linear infinite reverse; }

  @keyframes flow {
    from { transform: translateX(-10%); }
    to { transform: translateX(10%); }
  }

  /* === UI CONTENT === */
  .page {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 30px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .top, .bottom {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  .top { border-top: 1px solid var(--border-strong); padding-top: 20px; }
  .bottom { border-bottom: 1px solid var(--border-strong); padding-bottom: 20px; }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .wordmark {
    font-size: clamp(60px, 11vw, 160px);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 0.9;
    margin-bottom: 30px;
  }

  .statement {
    font-size: clamp(20px, 2.4vw, 30px);
    line-height: 1.35;
    color: var(--fg-2);
    max-width: 750px;
  }

  .statement strong { color: var(--fg); font-weight: 600; }

  .theme-toggle {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="rotor">
    <div class="ribbon ribbon-1"></div>
    <div class="ribbon ribbon-2"></div>
    <div class="ribbon ribbon-3"></div>
    <div class="ribbon ribbon-4"></div>
  </div>
</div>

<div class="page">
  <header class="top">
    <div>In Development</div>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
  </header>

  <main class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </main>

  <footer class="bottom">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </footer>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
</script>

</body>
</html>

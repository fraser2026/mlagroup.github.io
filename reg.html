<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #0A0E14;
    --fg-2: #374151;
    --fg-3: #4B5563; /* Slightly darker for better legibility */
    --border-strong: #1F2937;
    --font-brand: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', sans-serif;

    /* Neural Trace Palette */
    --blob-1: #4F46E5;
    --blob-2: #7C3AED;
    --blob-3: #06B6D4; 
    
    --grid-color: rgba(0, 0, 0, 0.07);
    --scan-opacity: 0.04;
    --text-glow: rgba(255, 255, 255, 0.8);
  }

  html[data-theme="dark"] {
    --bg: #0B0F1A;
    --fg: #FFFFFF;
    --fg-2: #CBD5E1;
    --fg-3: #94A3B8;
    --grid-color: rgba(255, 255, 255, 0.05);
    --scan-opacity: 0.1;
    --text-glow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-brand);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* --- NEURAL TRACE BACKGROUND --- */
  .mesh-stage { position: fixed; inset: 0; z-index: 0; background: var(--bg); }
  
  .grid-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image: 
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 95%);
  }

  .scan-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 10vh;
    background: linear-gradient(to bottom, transparent, rgba(99, 102, 241, var(--scan-opacity)), transparent);
    z-index: 3;
    animation: scan 12s linear infinite;
  }

  @keyframes scan { from { transform: translateY(-15vh); } to { transform: translateY(110vh); } }

  .blob-container { position: absolute; inset: 0; filter: blur(120px); opacity: 0.5; }
  .blob { position: absolute; border-radius: 50%; animation: drift 25s ease-in-out infinite alternate; }
  .b1 { width: 60vw; height: 60vw; background: var(--blob-1); top: -10%; left: -10%; }
  .b2 { width: 50vw; height: 50vw; background: var(--blob-2); bottom: -10%; right: -10%; animation-delay: -5s; }
  .b3 { width: 40vw; height: 40vw; background: var(--blob-3); top: 30%; right: 15%; animation-delay: -12s; }

  @keyframes drift { from { transform: translate(0,0); } to { transform: translate(8%, 5%); } }

  /* --- LAYOUT & VISIBILITY FIXES --- */
  .page {
    position: relative;
    z-index: 10;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 28px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* These utility classes solve the "getting lost" issue */
  .legible-label {
    font-size: 11px;
    font-weight: 600; /* Heavier weight for PC screens */
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
    text-shadow: 0 0 10px var(--text-glow), 0 0 20px var(--text-glow); /* Protective glow */
  }

  .top { border-top: 1px solid var(--border-strong); padding-top: 18px; display: flex; justify-content: space-between; align-items: center; }
  
  .theme-toggle { 
    background: rgba(255,255,255,0.1); 
    border: 1px solid var(--fg-3); 
    color: var(--fg); 
    padding: 7px 14px; 
    font-size: 11px; 
    font-weight: 600; 
    cursor: pointer; 
    backdrop-filter: blur(12px);
  }

  .centre { display: flex; flex-direction: column; justify-content: center; }
  
  .wordmark { 
    font-weight: 500; 
    font-size: clamp(60px, 11vw, 168px); 
    line-height: 0.9; 
    letter-spacing: -0.045em; 
    margin-bottom: 32px; 
  }
  
  .statement { 
    font-weight: 400; 
    font-size: clamp(20px, 2.4vw, 30px); 
    line-height: 1.35; 
    color: var(--fg-2); 
    max-width: 740px; 
    margin-bottom: 36px; 
  }
  
  .statement strong { color: var(--fg); font-weight: 600; }

  .bottom { border-bottom: 1px solid var(--border-strong); padding-bottom: 18px; display: flex; justify-content: space-between; }

  @media (max-width: 600px) { .page { padding: 20px; } }
</style>
</head>
<body>

<div class="mesh-stage">
  <div class="blob-container">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="grid-overlay"></div>
  <div class="scan-line"></div>
</div>

<div class="page">
  <header class="top">
    <div class="legible-label">In development</div>
    <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-label">Dark</span></button>
  </header>

  <main class="centre">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
    <div class="legible-label" style="opacity: 0.8;">Powered by MLA Group Ltd</div>
  </main>

  <footer class="bottom">
    <div class="legible-label">Coming 2026</div>
    <div class="legible-label">reganchor.com</div>
  </footer>
</div>

<script>
  function toggleTheme() {
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    label.textContent = next === 'dark' ? 'Light' : 'Dark';
    localStorage.setItem('ra-theme', next);
  }

  (function initTheme() {
    const saved = localStorage.getItem('ra-theme');
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', theme);
    if (label) label.textContent = theme === 'dark' ? 'Light' : 'Dark';
  })();
</script>

</body>
</html>

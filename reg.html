<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<meta name="description" content="RegAnchor. Intelligence for AI governance.">

<meta property="og:title" content="RegAnchor">
<meta property="og:description" content="Intelligence for AI governance.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://reganchor.com">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #0A0E14;
    --fg-2: #374151;
    --fg-3: #6B7280;
    --fg-4: #9CA3AF;
    --border: #E4E7EC;
    --border-strong: #1F2937;
    --font-brand: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #06080E;
    --fg: #FFFFFF;
    --fg-2: #D8DAE0;
    --fg-3: #A0A6B0;
    --fg-4: #6F7890;
    --border: #1F2530;
    --border-strong: #D8DAE0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font-brand);
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.5s ease, color 0.5s ease;
    position: relative;
  }

  /* === The signal canvas. One curve, one travelling point, nothing else. === */
  .signal {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* === LAYOUT === */
  .page {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 28px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* === TOP === */
  .top {
    border-top: 1px solid var(--border-strong);
    padding-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-left {
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  .theme-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 7px 14px;
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .theme-toggle:hover {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }

  /* === CENTRE === */
  .centre {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
  }

  .wordmark {
    font-family: var(--font-brand);
    font-weight: 500;
    font-size: clamp(60px, 11vw, 168px);
    line-height: 0.9;
    letter-spacing: -0.045em;
    color: var(--fg);
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  .statement {
    font-family: var(--font-brand);
    font-weight: 400;
    font-size: clamp(20px, 2.4vw, 30px);
    line-height: 1.35;
    letter-spacing: -0.015em;
    color: var(--fg-2);
    max-width: 740px;
    margin-bottom: 36px;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .statement strong { color: var(--fg); font-weight: 500; }

  .attribution {
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-3);
    opacity: 0;
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* === BOTTOM === */
  .bottom {
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  /* === RESPONSIVE === */
  @media (max-width: 760px) {
    .page { padding: 22px 24px; }
    .top, .bottom { font-size: 10px; }
    .centre { padding: 16px 0; }
    .wordmark { margin-bottom: 24px; }
    .statement { margin-bottom: 28px; }
  }

  @media (max-height: 600px) and (orientation: landscape) {
    .wordmark { font-size: clamp(48px, 8vw, 96px); margin-bottom: 16px; }
    .statement { font-size: 16px; margin-bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .statement, .attribution {
      opacity: 1;
      transform: none;
      animation: none;
    }
  }
</style>
</head>
<body>

<canvas class="signal" id="signal"></canvas>

<div class="page">

  <header class="top">
    <div class="top-left">RegAnchor</div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-label">Dark</span>
    </button>
  </header>

  <main class="centre">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
    <div class="attribution">Powered by MLA Group Ltd</div>
  </main>

  <footer class="bottom">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </footer>

</div>

<script>
  /* === Theme === */
  function toggleTheme() {
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    label.textContent = next === 'dark' ? 'Light' : 'Dark';
    try { localStorage.setItem('ra-theme', next); } catch (e) {}
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('ra-theme'); } catch (e) {}
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    if (saved === 'dark' || saved === 'light') {
      root.setAttribute('data-theme', saved);
      if (label) label.textContent = saved === 'dark' ? 'Light' : 'Dark';
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.setAttribute('data-theme', 'dark');
      if (label) label.textContent = 'Light';
    } else {
      root.setAttribute('data-theme', 'light');
      if (label) label.textContent = 'Dark';
    }
  })();

  /* === Circuit / Data Flow Signal ===
     Orthogonal (right-angle) pathways simulating a PCB trace, network topology,
     or AI data pipeline. Pulses of light travel along these defined routes 
     with a decaying trail, creating an engineered, persistent flow. */
  (function initSignal() {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const canvas = document.getElementById('signal');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0, dpr = 1;
    let lastTime = performance.now();

    // Define the raw relative paths (x, y as percentages of the screen)
    // Points outside 0-1 allow pulses to originate from off-screen
    const pathBlueprints = [
      [{x: -0.1, y: 0.15}, {x: 0.25, y: 0.15}, {x: 0.25, y: 0.75}, {x: 0.85, y: 0.75}, {x: 0.85, y: 1.1}],
      [{x: 1.1, y: 0.3}, {x: 0.65, y: 0.3}, {x: 0.65, y: 0.85}, {x: -0.1, y: 0.85}],
      [{x: 0.15, y: 1.1}, {x: 0.15, y: 0.45}, {x: 0.9, y: 0.45}, {x: 0.9, y: -0.1}],
      [{x: 0.45, y: -0.1}, {x: 0.45, y: 0.55}, {x: 0.75, y: 0.55}, {x: 0.75, y: 0.9}, {x: 1.1, y: 0.9}]
    ];

    let paths = [];
    let pulses = [];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      
      buildPaths();
    }

    // Translates blueprints into absolute pixel coordinates and calculates segment lengths
    function buildPaths() {
      paths = pathBlueprints.map(bp => {
        const points = bp.map(pt => ({ x: pt.x * w, y: pt.y * h }));
        const segments = [];
        let totalLen = 0;

        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i+1];
          const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          segments.push({ p1, p2, len });
          totalLen += len;
        }
        return { points, segments, totalLen };
      });

      // Initialize pulses if not already done
      if (pulses.length === 0) {
        paths.forEach((path, index) => {
          pulses.push({
            pathIndex: index,
            distance: Math.random() * path.totalLen, // Start at random positions
            speed: 60 + Math.random() * 40,          // Pixels per second
            tailLength: 300 + Math.random() * 200,   // Length of the fading tail
            delay: 0                                 // Pause before restarting
          });
        });
      }
    }

    function getRGB() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      // Return raw RGB values so we can inject dynamic opacities for the trails
      return isDark ? '255, 255, 255' : '10, 14, 20';
    }

    // Helper: Finds the exact X/Y coordinate at a specific distance along a path
    function getPointAt(path, d) {
      if (d <= 0) return path.points[0];
      if (d >= path.totalLen) return path.points[path.points.length - 1];

      let traversed = 0;
      for (let i = 0; i < path.segments.length; i++) {
        let seg = path.segments[i];
        if (d <= traversed + seg.len) {
          let ratio = (d - traversed) / seg.len;
          return {
            x: seg.p1.x + (seg.p2.x - seg.p1.x) * ratio,
            y: seg.p1.y + (seg.p2.y - seg.p1.y) * ratio
          };
        }
        traversed += seg.len;
      }
      return path.points[path.points.length - 1];
    }

    function draw(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      const rgb = getRGB();
      ctx.clearRect(0, 0, w, h);

      ctx.lineCap = 'square';
      ctx.lineJoin = 'miter';

      // 1. Draw the dim background circuits
      ctx.lineWidth = 1;
      ctx.strokeStyle = `rgba(${rgb}, 0.06)`;
      paths.forEach(path => {
        ctx.beginPath();
        ctx.moveTo(path.points[0].x, path.points[0].y);
        for (let i = 1; i < path.points.length; i++) {
          ctx.lineTo(path.points[i].x, path.points[i].y);
        }
        ctx.stroke();
      });

      // 2. Update and draw pulses
      pulses.forEach(pulse => {
        const path = paths[pulse.pathIndex];
        
        if (pulse.delay > 0) {
          pulse.delay -= dt;
          return;
        }

        pulse.distance += pulse.speed * dt;

        // Reset pulse when tail completely leaves the path
        if (pulse.distance - pulse.tailLength > path.totalLen) {
          pulse.distance = 0;
          pulse.delay = Math.random() * 2; // Wait 0-2 seconds before firing again
          pulse.speed = 60 + Math.random() * 40;
        }

        // Draw the tail by stepping backwards from the head
        const currentD = pulse.distance;
        const endD = Math.max(0, pulse.distance - pulse.tailLength);
        const step = 4; // Detail level of the gradient curve
        
        let prevPoint = getPointAt(path, currentD);

        ctx.lineWidth = 1.5;
        for (let d = currentD - step; d >= endD; d -= step) {
          let pt = getPointAt(path, d);
          if (!pt) continue;

          // Fade out based on distance from the head
          let opacity = Math.pow((d - endD) / pulse.tailLength, 1.5); 
          // Max opacity for the body is 0.6 to allow the head to pop
          ctx.strokeStyle = `rgba(${rgb}, ${opacity * 0.6})`;
          
          ctx.beginPath();
          ctx.moveTo(prevPoint.x, prevPoint.y);
          ctx.lineTo(pt.x, pt.y);
          ctx.stroke();

          prevPoint = pt;
        }

        // Draw the bright head of the pulse
        let headPt = getPointAt(path, currentD);
        if (headPt && currentD > 0 && currentD < path.totalLen) {
          // Inner core
          ctx.fillStyle = `rgba(${rgb}, 0.9)`;
          ctx.beginPath();
          ctx.arc(headPt.x, headPt.y, 2, 0, Math.PI * 2);
          ctx.fill();

          // Outer glow
          ctx.fillStyle = `rgba(${rgb}, 0.3)`;
          ctx.beginPath();
          ctx.arc(headPt.x, headPt.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();
</script>


</body>
</html>

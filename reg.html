<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<meta name="description" content="RegAnchor. Intelligence for AI governance.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #0A0E14;
    --fg-2: #374151;
    --fg-3: #6B7280;
    --fg-4: #9CA3AF;
    --border: #E4E7EC;
    --border-strong: #1F2937;
    --font-brand: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', sans-serif;

    --blob-1: #6366F1;
    --blob-2: #A855F7;
    --blob-3: #EC4899;
    --blob-4: #F97316;
    --blob-5: #818CF8;
    --blob-6: #FB923C;

    --mesh-base: #FFFFFF;
    --blob-opacity: 0.8;
  }

  html[data-theme="dark"] {
    --bg: #0F172A;
    --fg: #FFFFFF;
    --fg-2: #E2E8F0;
    --fg-3: #94A3B8;
    --fg-4: #64748B;
    --border: #1E293B;
    --border-strong: #E2E8F0;
    --mesh-base: #0F172A;
    --blob-opacity: 0.6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-brand);
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s ease, color 0.5s ease;
    position: relative;
  }

  /* ================================================================
     THE PRISMATIC ENGINE
     ================================================================ */
  .mesh-stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: var(--mesh-base);
    overflow: hidden;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .mesh-stage.ready { opacity: 1; }

  /* Moving Background Blobs */
  .mesh-rotor {
    position: absolute;
    inset: -20%;
    transform: rotate(-10deg);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    mix-blend-mode: soft-light;
    opacity: var(--blob-opacity);
    will-change: transform;
    animation: drift 20s ease-in-out infinite alternate;
  }

  html[data-theme="dark"] .blob { mix-blend-mode: screen; }

  .blob-1 { width: 60vw; height: 60vw; background: var(--blob-1); top: 0; left: 0; }
  .blob-2 { width: 50vw; height: 50vw; background: var(--blob-2); top: 20%; right: 0; animation-delay: -5s; }
  .blob-3 { width: 55vw; height: 55vw; background: var(--blob-3); bottom: 0; left: 10%; animation-delay: -2s; }
  .blob-4 { width: 45vw; height: 45vw; background: var(--blob-4); bottom: 10%; right: 10%; animation-delay: -8s; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(10%, 10%) scale(1.1); }
  }

  /* The Prism Shards - This creates the "Engineered" look */
  .prism-container {
    position: absolute;
    inset: 0;
    display: flex;
    gap: 2px;
    z-index: 2;
  }

  .shard {
    flex: 1;
    height: 200%;
    margin-top: -50%;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    background: rgba(255, 255, 255, 0.02);
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    transform: rotate(15deg);
    animation: shard-move 12s ease-in-out infinite alternate;
  }

  html[data-theme="dark"] .shard {
    background: rgba(255, 255, 255, 0.01);
    border-left: 1px solid rgba(255, 255, 255, 0.03);
  }

  @keyframes shard-move {
    from { transform: rotate(15deg) translateY(-2%); }
    to { transform: rotate(15deg) translateY(2%); }
  }

  /* ================================================================
     PAGE CONTENT (Layout untouched)
     ================================================================ */
  .page {
    position: relative;
    z-index: 10;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 28px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .top { border-top: 1px solid var(--border-strong); padding-top: 18px; display: flex; justify-content: space-between; align-items: center; }
  .top-left { font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
  .theme-toggle { background: rgba(255, 255, 255, 0.7); border: 1px solid var(--border); color: var(--fg); padding: 7px 14px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(8px); }
  html[data-theme="dark"] .theme-toggle { background: rgba(15, 23, 42, 0.7); }
  .centre { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .wordmark { font-weight: 500; font-size: clamp(60px, 11vw, 168px); line-height: 0.9; letter-spacing: -0.045em; margin-bottom: 32px; opacity: 0; animation: rise 1.2s ease forwards 0.4s; }
  .statement { font-weight: 400; font-size: clamp(20px, 2.4vw, 30px); line-height: 1.35; color: var(--fg-2); max-width: 740px; margin-bottom: 36px; opacity: 0; animation: rise 1.2s ease forwards 0.7s; }
  .statement strong { color: var(--fg); font-weight: 500; }
  .attribution { font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); opacity: 0; animation: rise 1.2s ease forwards 1s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .bottom { border-bottom: 1px solid var(--border-strong); padding-bottom: 18px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
</style>
</head>
<body>

<div class="mesh-stage" id="meshStage">
  <div class="mesh-rotor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <!-- Prismatic Shards -->
  <div class="prism-container">
    <div class="shard"></div>
    <div class="shard" style="animation-delay: -2s;"></div>
    <div class="shard" style="animation-delay: -4s;"></div>
    <div class="shard" style="animation-delay: -1s;"></div>
    <div class="shard" style="animation-delay: -5s;"></div>
  </div>
</div>

<div class="page">
  <header class="top">
    <div class="top-left">In development</div>
    <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-label">Dark</span></button>
  </header>
  <main class="centre">
    <div class="centre-content">
      <h1 class="wordmark">RegAnchor</h1>
      <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
      <div class="attribution">Powered by MLA Group Ltd</div>
    </div>
  </main>
  <footer class="bottom">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </footer>
</div>

<script>
  function toggleTheme() {
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    label.textContent = next === 'dark' ? 'Light' : 'Dark';
    localStorage.setItem('ra-theme', next);
  }

  (function initTheme() {
    const saved = localStorage.getItem('ra-theme');
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', theme);
    if (label) label.textContent = theme === 'dark' ? 'Light' : 'Dark';
  })();

  requestAnimationFrame(() => {
    document.getElementById('meshStage').classList.add('ready');
  });
</script>

</body>
</html>

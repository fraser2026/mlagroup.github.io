<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor | In Development</title>
<style>
  :root {
    --bg-slate: #0b0f19;
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --accent: #e2e8f0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-slate);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* --- 1. THE MACRO LAYOUT --- */
  .hero-section {
    position: relative;
    width: 100vw;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- 2. THE RIVER GEOMETRY & RENDERING --- */
  .flow-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 60vh;
    clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
    overflow: hidden;
    /* Base gradient so color-dodge has a luminous floor to burn against */
    background: linear-gradient(135deg, #1e1b4b 0%, #0b0f19 100%);
    isolation: isolate; /* Crucial: traps the mix-blend-mode inside this container */
  }

  /* Embedded SVG Noise for texture (prevents banding) */
  .noise-overlay {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    z-index: 10;
    mix-blend-mode: overlay;
    opacity: 0.15;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* --- 3. THE LIGHT STREAK CANVAS --- */
  .canvas-rotated {
    position: absolute;
    top: -30%;
    left: -20%;
    width: 140%;
    height: 160%;
    transform: rotate(-15deg);
    pointer-events: none;
  }

  /* Ribbon Geometry & GPU Acceleration */
  .ribbon {
    position: absolute;
    width: 250vw;
    height: 12vh;
    filter: blur(80px);
    mix-blend-mode: color-dodge;
    will-change: transform;
    backface-visibility: hidden;
    animation: treadmill linear infinite;
    border-radius: 100px; /* Softens the extreme edges slightly before the blur */
  }

  /* --- 4. TREADMILL PHYSICS & COLOR TENSION --- */
  /* Colors map to the Stripe deep indigo, vivid pink, and hot orange */
  .r1 { top: 15%; background: #6366f1; animation-duration: 8s; animation-delay: -2s; opacity: 0.9; }
  .r2 { top: 35%; background: #ec4899; animation-duration: 11s; animation-delay: -5s; opacity: 0.8; }
  .r3 { top: 55%; background: #f59e0b; animation-duration: 14s; animation-delay: -1s; opacity: 0.85; }
  .r4 { top: 25%; background: #8b5cf6; animation-duration: 9s; animation-delay: -7s; opacity: 0.9; }
  .r5 { top: 65%; background: #f43f5e; animation-duration: 12s; animation-delay: -3s; opacity: 0.7; }
  .r6 { top: 45%; background: #eab308; animation-duration: 16s; animation-delay: -8s; opacity: 0.75; }
  .r7 { top: 5%;  background: #3b82f6; animation-duration: 10s; animation-delay: -4s; opacity: 0.8; }

  /* SkewX creates the 'brushed silk' anisotropic blur effect */
  @keyframes treadmill {
    0% { transform: translateX(-60vw) skewX(-25deg); }
    100% { transform: translateX(120vw) skewX(-25deg); }
  }

  /* --- 5. CONTENT OVERLAY --- */
  .content-wrapper {
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
    padding: 2rem 3rem;
    pointer-events: none; /* Let clicks pass through to background if needed */
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .main-copy {
    margin-top: 15vh;
    max-width: 650px;
  }

  h1 {
    font-size: 4.5rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
  }

  p.description {
    font-size: 1.25rem;
    line-height: 1.6;
    color: var(--accent);
    margin-bottom: 2rem;
    font-weight: 400;
  }

  .powered-by {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: auto;
  }

  @media (max-width: 768px) {
    h1 { font-size: 3rem; }
    p.description { font-size: 1.1rem; }
    .content-wrapper { padding: 1.5rem; }
  }
</style>
</head>
<body>

<div class="hero-section">
  <!-- The River -->
  <div class="flow-container">
    <div class="noise-overlay"></div>
    <div class="canvas-rotated">
      <div class="ribbon r1"></div>
      <div class="ribbon r2"></div>
      <div class="ribbon r3"></div>
      <div class="ribbon r4"></div>
      <div class="ribbon r5"></div>
      <div class="ribbon r6"></div>
      <div class="ribbon r7"></div>
    </div>
  </div>

  <!-- The Content -->
  <div class="content-wrapper">
    <header>
      <span>In Development</span>
    </header>

    <div class="main-copy">
      <h1>RegAnchor</h1>
      <p class="description">
        Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.
      </p>
      <div class="powered-by">Powered by MLA Group Ltd</div>
    </div>

    <footer>
      <span>Coming 2026</span>
      <span>Reganchor.com</span>
    </footer>
  </div>
</div>

</body>
</html>

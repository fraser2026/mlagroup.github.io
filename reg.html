<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<meta name="description" content="RegAnchor. Intelligence for AI governance.">

<meta property="og:title" content="RegAnchor">
<meta property="og:description" content="Intelligence for AI governance.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://reganchor.com">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #0A0E14;
    --fg-2: #374151;
    --fg-3: #6B7280;
    --fg-4: #9CA3AF;
    --border: #E4E7EC;
    --border-strong: #1F2937;
    --font-brand: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #06080E;
    --fg: #FFFFFF;
    --fg-2: #D8DAE0;
    --fg-3: #A0A6B0;
    --fg-4: #6F7890;
    --border: #1F2530;
    --border-strong: #D8DAE0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font-brand);
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.5s ease, color 0.5s ease;
    position: relative;
  }

  /* === The signal canvas. One curve, one travelling point, nothing else. === */
  .signal {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* === LAYOUT === */
  .page {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 28px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* === TOP === */
  .top {
    border-top: 1px solid var(--border-strong);
    padding-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-left {
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  .theme-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 7px 14px;
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .theme-toggle:hover {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }

  /* === CENTRE === */
  .centre {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 0;
  }

  .wordmark {
    font-family: var(--font-brand);
    font-weight: 500;
    font-size: clamp(60px, 11vw, 168px);
    line-height: 0.9;
    letter-spacing: -0.045em;
    color: var(--fg);
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  .statement {
    font-family: var(--font-brand);
    font-weight: 400;
    font-size: clamp(20px, 2.4vw, 30px);
    line-height: 1.35;
    letter-spacing: -0.015em;
    color: var(--fg-2);
    max-width: 740px;
    margin-bottom: 36px;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .statement strong { color: var(--fg); font-weight: 500; }

  .attribution {
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-3);
    opacity: 0;
    animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* === BOTTOM === */
  .bottom {
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-brand);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  /* === RESPONSIVE === */
  @media (max-width: 760px) {
    .page { padding: 22px 24px; }
    .top, .bottom { font-size: 10px; }
    .centre { padding: 16px 0; }
    .wordmark { margin-bottom: 24px; }
    .statement { margin-bottom: 28px; }
  }

  @media (max-height: 600px) and (orientation: landscape) {
    .wordmark { font-size: clamp(48px, 8vw, 96px); margin-bottom: 16px; }
    .statement { font-size: 16px; margin-bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .statement, .attribution {
      opacity: 1;
      transform: none;
      animation: none;
    }
  }
</style>
</head>
<body>

<canvas class="signal" id="signal"></canvas>

<div class="page">

  <header class="top">
    <div class="top-left">RegAnchor</div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-label">Dark</span>
    </button>
  </header>

  <main class="centre">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
    <div class="attribution">Powered by MLA Group Ltd</div>
  </main>

  <footer class="bottom">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </footer>

</div>

<script>
  /* === Theme === */
  function toggleTheme() {
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    label.textContent = next === 'dark' ? 'Light' : 'Dark';
    try { localStorage.setItem('ra-theme', next); } catch (e) {}
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('ra-theme'); } catch (e) {}
    const root = document.documentElement;
    const label = document.getElementById('theme-label');
    if (saved === 'dark' || saved === 'light') {
      root.setAttribute('data-theme', saved);
      if (label) label.textContent = saved === 'dark' ? 'Light' : 'Dark';
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      root.setAttribute('data-theme', 'dark');
      if (label) label.textContent = 'Light';
    } else {
      root.setAttribute('data-theme', 'light');
      if (label) label.textContent = 'Dark';
    }
  })();

    /* === RegAnchor System Flow ===
     A premium, margin-focused data visualization. 
     Paths are invisible until 'scanned' by a pulse.
     Coordinates are tuned to frame the central text. */
  (function initSignal() {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const canvas = document.getElementById('signal');
    const ctx = canvas.getContext('2d');
    let w, h, dpr, lastTime = performance.now();

    // Paths carefully placed in margins to avoid cutting through central text
    const pathBlueprints = [
      // Top & Right Frame
      [{x: 0.05, y: -0.1}, {x: 0.05, y: 0.08}, {x: 0.95, y: 0.08}, {x: 0.95, y: 0.4}],
      // Bottom Left "L"
      [{x: -0.1, y: 0.92}, {x: 0.4, y: 0.92}, {x: 0.4, y: 1.1}],
      // Side Gutter "Pipeline"
      [{x: 0.9, y: 1.1}, {x: 0.9, y: 0.6}, {x: 1.1, y: 0.6}],
      // Top Left Corner
      [{x: -0.1, y: 0.4}, {x: 0.12, y: 0.4}, {x: 0.12, y: -0.1}]
    ];

    let paths = [], pulses = [];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      ctx.scale(dpr, dpr);
      buildPaths();
    }

    function buildPaths() {
      paths = pathBlueprints.map(bp => {
        const points = bp.map(pt => ({ x: pt.x * w, y: pt.y * h }));
        const segments = [];
        let totalLen = 0;
        for (let i = 0; i < points.length - 1; i++) {
          const len = Math.hypot(points[i+1].x - points[i].x, points[i+1].y - points[i].y);
          segments.push({ p1: points[i], p2: points[i+1], len });
          totalLen += len;
        }
        return { points, segments, totalLen };
      });

      if (pulses.length === 0) {
        paths.forEach((_, i) => spawnPulse(i, true));
      }
    }

    function spawnPulse(index, randomStart = false) {
      const path = paths[index];
      pulses[index] = {
        pathIndex: index,
        distance: randomStart ? Math.random() * path.totalLen : 0,
        speed: 40 + Math.random() * 30,
        tailLength: 250 + Math.random() * 150,
        delay: randomStart ? 0 : Math.random() * 4 
      };
    }

    function getPointAt(path, d) {
      if (d <= 0) return path.points[0];
      if (d >= path.totalLen) return path.points[path.points.length - 1];
      let traversed = 0;
      for (let seg of path.segments) {
        if (d <= traversed + seg.len) {
          let r = (d - traversed) / seg.len;
          return { x: seg.p1.x + (seg.p2.x - seg.p1.x) * r, y: seg.p1.y + (seg.p2.y - seg.p1.y) * r };
        }
        traversed += seg.len;
      }
    }

    function draw(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      
      // COLORS: Soft Indigo/Slate for Light, Pure White for Dark
      const baseRGB = isDark ? '255, 255, 255' : '99, 102, 241'; 
      
      ctx.clearRect(0, 0, w, h);

      pulses.forEach((pulse, i) => {
        if (pulse.delay > 0) { pulse.delay -= dt; return; }
        
        pulse.distance += pulse.speed * dt;
        const path = paths[pulse.pathIndex];

        if (pulse.distance - pulse.tailLength > path.totalLen) {
          spawnPulse(i);
          return;
        }

        const headD = pulse.distance;
        const tailD = Math.max(0, headD - pulse.tailLength);
        
        // DRAW THE "SCANNED" PATH (The Tail)
        const steps = 30;
        for (let j = 0; j < steps; j++) {
          const d1 = tailD + (j / steps) * (headD - tailD);
          const d2 = tailD + ((j + 1) / steps) * (headD - tailD);
          const p1 = getPointAt(path, d1);
          const p2 = getPointAt(path, d2);

          if (p1 && p2) {
            const opacity = Math.pow(j / steps, 3); // Exponential fade
            ctx.strokeStyle = `rgba(${baseRGB}, ${opacity * (isDark ? 0.4 : 0.25)})`;
            ctx.lineWidth = isDark ? 1.2 : 1.5;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }

        // DRAW THE "PACKET" HEAD
        const headPt = getPointAt(path, headD);
        if (headPt && headD < path.totalLen) {
          ctx.fillStyle = `rgba(${baseRGB}, ${isDark ? 0.9 : 0.7})`;
          // Main Dot
          ctx.beginPath();
          ctx.arc(headPt.x, headPt.y, 2, 0, Math.PI * 2);
          ctx.fill();
          
          // Subtle soft glow around head
          ctx.shadowBlur = 15;
          ctx.shadowColor = `rgba(${baseRGB}, 0.5)`;
          ctx.beginPath();
          ctx.arc(headPt.x, headPt.y, 1, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0; // Reset for next items
        }
      });

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();




    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegAnchor | AI Governance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF; --fg: #0A0E14; --fg-muted: #6B7280;
            --g1: #6366F1; --g2: #A855F7; --g3: #EC4899; --g4: #F97316;
        }
        html[data-theme="dark"] {
            --bg: #030712; --fg: #FFFFFF; --fg-muted: #9CA3AF;
            --g1: #1E1B4B; --g2: #4C1D95; --g3: #701A75; --g4: #0F172A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; overflow: hidden; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--fg); transition: background 0.5s ease; }
        #gradient-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; --gradient-color-1: var(--g1); --gradient-color-2: var(--g2); --gradient-color-3: var(--g3); --gradient-color-4: var(--g4); }
        .page { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; padding: 28px 40px; max-width: 1400px; margin: 0 auto; pointer-events: none; }
        header, footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-muted); pointer-events: auto; }
        header { border-top: 1px solid var(--fg); padding-top: 18px; }
        footer { border-bottom: 1px solid var(--fg); padding-bottom: 18px; }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .wordmark { font-size: clamp(54px, 10vw, 150px); font-weight: 500; letter-spacing: -0.04em; line-height: 0.9; margin-bottom: 24px; }
        .statement { font-size: clamp(18px, 2.2vw, 28px); line-height: 1.4; color: var(--fg-muted); max-width: 720px; }
        .statement strong { color: var(--fg); font-weight: 600; }
        .theme-toggle { background: var(--fg); color: var(--bg); border: none; padding: 8px 14px; font-size: 10px; font-weight: 700; cursor: pointer; pointer-events: auto; }
    </style>
</head>
<body>
    <canvas id="gradient-canvas"></canvas>
    <div class="page">
        <header><div>In Development</div><button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button></header>
        <main>
            <h1 class="wordmark">RegAnchor</h1>
            <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
        </main>
        <footer><div>Coming 2026</div><div>reganchor.com</div></footer>
    </div>

    </script>
</body>
</html>

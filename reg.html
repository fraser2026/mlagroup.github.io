<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor | AI Governance</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --fg: #0a0e14;
  --muted: #6b7280;
}

html[data-theme="dark"] {
  --bg: #030712;
  --fg: #ffffff;
  --muted: #9ca3af;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
}

/* === BACKGROUND === */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(60% 40% at 20% 30%, rgba(99,102,241,0.25), transparent 60%),
    radial-gradient(50% 40% at 80% 70%, rgba(168,85,247,0.25), transparent 60%),
    radial-gradient(40% 30% at 50% 50%, rgba(236,72,153,0.2), transparent 70%);
  filter: blur(80px);
  opacity: 0.7;
  animation: drift 18s ease-in-out infinite alternate;
}

@keyframes drift {
  0%   { transform: translateY(-3%) translateX(-2%); }
  100% { transform: translateY(3%) translateX(2%); }
}

/* === LAYOUT === */
.page {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 32px 40px;
  max-width: 1200px;
  margin: 0 auto;
}

/* === HEADER / FOOTER === */
header, footer {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

main {
  flex: 1;
  display: flex;
  align-items: center;
}

/* === TYPOGRAPHY === */
.wordmark {
  font-size: clamp(56px, 9vw, 120px);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 0.9;
  margin-bottom: 24px;
}

.statement {
  font-size: clamp(18px, 2vw, 26px);
  line-height: 1.4;
  max-width: 640px;
  color: var(--muted);
}

.statement strong {
  color: var(--fg);
  font-weight: 600;
}

/* === BUTTON === */
.theme-btn {
  background: transparent;
  border: 1px solid var(--muted);
  color: var(--muted);
  padding: 6px 10px;
  font-size: 10px;
  cursor: pointer;
}

.theme-btn:hover {
  color: var(--fg);
  border-color: var(--fg);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="page">
  <header>
    <div>In Development</div>
    <button class="theme-btn" onclick="toggleTheme()">Theme</button>
  </header>

  <main>
    <div>
      <h1 class="wordmark">RegAnchor</h1>
      <p class="statement">
        Intelligence for AI governance.
        <strong>A continuous, evidential layer beneath every AI system you operate</strong>
        — registered, scored, and held to account in real time.
      </p>
    </div>
  </main>

  <footer>
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </footer>
</div>

<script>
function toggleTheme() {
  const root = document.documentElement;
  root.setAttribute(
    'data-theme',
    root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
  );
}
</script>

</body>
</html>

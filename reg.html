<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --fg-muted: #666666;
    --accent: #4F46E5;
    --line-weight: 1px;
  }

  html[data-theme="dark"] {
    --bg: #0A0A0B;
    --fg: #FFFFFF;
    --fg-muted: #888888;
    --accent: #818CF8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'IBM Plex Sans', sans-serif; 
    background-color: var(--bg); 
    color: var(--fg);
    overflow: hidden;
    height: 100vh;
  }

  /* --- THE ABSTRACT OBJECT (The "Anchor") --- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .wireframe-container {
    width: 60vh;
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.8;
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Rotating Group */
  .rotator {
    transform-origin: center;
    animation: rotate3d 20s linear infinite;
    stroke: var(--accent);
    fill: none;
    stroke-width: var(--line-weight);
  }

  .core-orbit {
    stroke: var(--fg);
    stroke-dasharray: 4 4;
    animation: counter-rotate 30s linear infinite;
  }

  @keyframes rotate3d {
    0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
    100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
  }

  @keyframes counter-rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }

  /* --- UI LAYOUT --- */
  .page {
    position: relative;
    z-index: 10;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 35px 50px;
    max-width: 1500px;
    margin: 0 auto;
  }

  .header, .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* Strong Industrial Borders */
  .header { border-top: 2px solid var(--fg); padding-top: 20px; }
  .footer { border-bottom: 2px solid var(--fg); padding-bottom: 20px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    pointer-events: none;
  }

  .wordmark {
    font-size: clamp(60px, 12vw, 170px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 0.9;
    margin-bottom: 30px;
    pointer-events: auto;
  }

  .statement {
    font-size: clamp(20px, 2.5vw, 30px);
    line-height: 1.3;
    color: var(--fg-muted);
    max-width: 780px;
    pointer-events: auto;
  }

  .statement strong { color: var(--fg); font-weight: 600; }

  .theme-btn {
    background: none;
    border: 1px solid var(--fg-muted);
    color: var(--fg);
    padding: 6px 14px;
    cursor: pointer;
    font-size: 10px;
    letter-spacing: 0.1em;
    pointer-events: auto;
  }

  @media (max-width: 768px) {
    .page { padding: 25px; }
    .wireframe-container { width: 40vh; height: 40vh; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="wireframe-container">
    <svg viewBox="0 0 200 200">
      <!-- Outer technical rings -->
      <circle cx="100" cy="100" r="95" class="core-orbit" opacity="0.2"/>
      <circle cx="100" cy="100" r="70" class="core-orbit" opacity="0.4" style="animation-duration: 15s"/>
      
      <!-- The Rotating Abstract "Anchor" -->
      <g class="rotator">
        <!-- Octahedron-style geometry -->
        <path d="M100 20 L160 100 L100 180 L40 100 Z" />
        <path d="M100 20 L40 100 L100 100 Z" opacity="0.5"/>
        <path d="M100 180 L160 100 L100 100 Z" opacity="0.5"/>
        <line x1="40" y1="100" x2="160" y2="100" />
        <line x1="100" y1="20" x2="100" y2="180" />
      </g>
    </svg>
  </div>
</div>

<div class="page">
  <div class="header">
    <div>Status: Alpha v.1</div>
    <button class="theme-btn" onclick="toggleTheme()">THEME</button>
  </div>

  <div class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </div>

  <div class="footer">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F2F2F2;
    --fg: #1A1A1A;
    --fg-muted: #666666;
    --accent-glow: rgba(0, 71, 255, 0.15);
    --grain-opacity: 0.04;
  }

  html[data-theme="dark"] {
    --bg: #0A0A0B;
    --fg: #FFFFFF;
    --fg-muted: #888888;
    --accent-glow: rgba(79, 70, 229, 0.2);
    --grain-opacity: 0.07;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'IBM Plex Sans', sans-serif; 
    background-color: var(--bg); 
    color: var(--fg);
    overflow: hidden;
    transition: background-color 0.5s ease;
  }

  /* --- TEXTURED DEPTH LAYER --- */
  .canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* The Grain: This makes the "cheap" digital look go away */
  .canvas::before {
    content: "";
    position: absolute;
    inset: -100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: var(--grain-opacity);
    pointer-events: none;
  }

  /* The Single Light Source (Dramatic Top-Down) */
  .spotlight {
    position: absolute;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 80vh;
    background: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 70%);
    pointer-events: none;
  }

  /* --- LAYOUT --- */
  .page {
    position: relative;
    z-index: 10;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 40px;
  }

  .header, .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* Subtle Hairline Dividers */
  .header { border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 20px; }
  .footer { border-top: 1px solid rgba(128,128,128,0.2); padding-top: 20px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  .wordmark {
    font-size: clamp(60px, 12vw, 160px);
    font-weight: 500;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 0.2em;
    /* Subtle gradient on text for a "metallic" sheen */
    background: linear-gradient(to bottom, var(--fg) 60%, var(--fg-muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .statement {
    font-size: clamp(20px, 2.2vw, 28px);
    line-height: 1.4;
    color: var(--fg-muted);
    max-width: 750px;
    font-weight: 400;
  }

  .statement strong { color: var(--fg); font-weight: 600; -webkit-text-fill-color: var(--fg); }

  .theme-btn {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="canvas">
  <div class="spotlight"></div>
</div>

<div class="page">
  <div class="header">
    <div>In Development</div>
    <button class="theme-btn" onclick="toggleTheme()">DARK</button>
  </div>

  <div class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </div>

  <div class="footer">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.querySelector('.theme-btn').textContent = isDark ? 'DARK' : 'LIGHT';
  }
</script>
</body>
</html>

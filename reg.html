<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --fg-muted: #666666;
    --feature-color: linear-gradient(135deg, #4F46E5, #06B6D4, #7C3AED);
  }

  html[data-theme="dark"] {
    --bg: #0A0A0B;
    --fg: #FFFFFF;
    --fg-muted: #888888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'IBM Plex Sans', sans-serif; 
    background-color: var(--bg); 
    color: var(--fg);
    overflow: hidden;
    transition: background 0.5s ease;
  }

  /* --- THE ABSTRACT OBJECT --- */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    perspective: 1000px;
  }

  .abstract-shape {
    width: 45vw;
    height: 45vw;
    max-width: 600px;
    max-height: 600px;
    position: relative;
    background: var(--feature-color);
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; /* Organic moving shape */
    filter: blur(60px);
    opacity: 0.25;
    animation: morph 15s linear infinite, rotate 20s linear infinite;
  }

  /* A second "inner" shape to create depth/void */
  .abstract-shape::after {
    content: "";
    position: absolute;
    inset: 15%;
    background: var(--bg);
    border-radius: 50%;
    filter: blur(40px);
  }

  @keyframes rotate {
    from { transform: rotate(0deg) scale(1); }
    to { transform: rotate(360deg) scale(1.1); }
  }

  @keyframes morph {
    0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    33% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
    66% { border-radius: 30% 60% 30% 70% / 50% 70% 30% 40%; }
  }

  /* --- UI LAYOUT --- */
  .page {
    position: relative;
    z-index: 10;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header, .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  .header { border-top: 1px solid var(--fg); padding-top: 20px; }
  .footer { border-bottom: 1px solid var(--fg); padding-bottom: 20px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .wordmark {
    font-size: clamp(60px, 12vw, 165px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 0.85;
    margin-bottom: 30px;
  }

  .statement {
    font-size: clamp(20px, 2.5vw, 30px);
    line-height: 1.3;
    color: var(--fg-muted);
    max-width: 750px;
  }

  .statement strong { color: var(--fg); font-weight: 600; }

  .theme-btn {
    background: none;
    border: 1px solid var(--fg-muted);
    color: var(--fg);
    padding: 6px 12px;
    cursor: pointer;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="abstract-shape"></div>
</div>

<div class="page">
  <div class="header">
    <div>In Development</div>
    <button class="theme-btn" onclick="toggleTheme()">DARK/LIGHT</button>
  </div>

  <div class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </div>

  <div class="footer">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFFFFF;
    --fg: #000000;
    --fg-muted: #666666;
    --glass: rgba(79, 70, 229, 0.08);
    --border: rgba(0, 0, 0, 0.1);
  }

  html[data-theme="dark"] {
    --bg: #0A0A0B;
    --fg: #FFFFFF;
    --fg-muted: #94A3B8;
    --glass: rgba(99, 102, 241, 0.12);
    --border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'IBM Plex Sans', sans-serif; 
    background-color: var(--bg); 
    color: var(--fg);
    overflow: hidden;
  }

  /* --- THE ROTATING OBJECT --- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Gives the 3D depth */
  }

  .anchor-object {
    width: 30vw;
    height: 80vh;
    background: var(--glass);
    backdrop-filter: blur(60px);
    border: 1px solid var(--border);
    
    /* This is the magic part: it rotates the whole object */
    animation: rotateObject 15s ease-in-out infinite alternate;
    transform-style: preserve-3d;
  }

  /* Subtle inner detail line that moves with the rotation */
  .anchor-object::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, var(--fg), transparent);
    opacity: 0.2;
  }

  @keyframes rotateObject {
    0% { transform: rotateY(-20deg) rotateX(10deg) rotateZ(-5deg); }
    100% { transform: rotateY(20deg) rotateX(-10deg) rotateZ(5deg); }
  }

  /* --- LAYOUT --- */
  .page {
    position: relative;
    z-index: 10;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 30px 50px;
    max-width: 1500px;
    margin: 0 auto;
  }

  .header, .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  .header { border-top: 2px solid var(--fg); padding-top: 20px; }
  .footer { border-bottom: 2px solid var(--fg); padding-bottom: 20px; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .wordmark {
    font-size: clamp(60px, 12vw, 170px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 0.9;
    margin-bottom: 30px;
  }

  .statement {
    font-size: clamp(20px, 2.5vw, 30px);
    line-height: 1.35;
    color: var(--fg-muted);
    max-width: 800px;
  }

  .statement strong { color: var(--fg); font-weight: 600; }

  .theme-btn {
    background: none;
    border: 1px solid var(--fg-muted);
    color: var(--fg);
    padding: 6px 14px;
    cursor: pointer;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="stage">
  <!-- The single vertical pillar, now rotating as one piece -->
  <div class="anchor-object"></div>
</div>

<div class="page">
  <div class="header">
    <div>In Development</div>
    <button class="theme-btn" onclick="toggleTheme()">THEME</button>
  </div>

  <div class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </div>

  <div class="footer">
    <div>Coming 2026</div>
    <div>reganchor.com</div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }
</script>

</body>
</html>

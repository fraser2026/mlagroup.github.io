<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegAnchor | Unified Flow</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #0b0f19;
            --river-speed: 20s;
        }

        [data-theme='dark'] {
            --bg: #0b0f19;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        /* --- THE DYNAMIC RIVER ENGINE --- */
        .river-viewport {
            position: relative;
            width: 100%;
            height: 70vh;
            /* The 'Cut' is now slightly animated via a subtle scale transform */
            clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
            overflow: hidden;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .river-mesh {
            position: absolute;
            inset: -10% -20%;
            width: 140%;
            height: 140%;
            transform: rotate(-12deg);
            filter: blur(60px);
            display: flex;
            flex-direction: column;
            gap: 0;
            mix-blend-mode: normal;
        }

        /* The 'Flower Rope' logic: Each strand has its own unique path */
        .strand {
            position: absolute;
            width: 300vw;
            height: 25vh;
            border-radius: 50%;
            opacity: 0.7;
            will-change: transform;
            animation: flow var(--river-speed) infinite linear;
        }

        /* Multi-chromatic layering to prevent '1-dimension' color feel */
        .s1 { background: radial-gradient(circle, #6366f1 0%, transparent 70%); top: 0%; animation-duration: 25s; }
        .s2 { background: radial-gradient(circle, #f43f5e 0%, transparent 70%); top: 20%; animation-duration: 30s; animation-delay: -5s; }
        .s3 { background: radial-gradient(circle, #3b82f6 0%, transparent 70%); top: 40%; animation-duration: 22s; animation-delay: -10s; }
        .s4 { background: radial-gradient(circle, #fb923c 0%, transparent 70%); top: 10%; left: 20%; animation-duration: 35s; }
        .s5 { background: radial-gradient(circle, #a855f7 0%, transparent 70%); top: 60%; animation-duration: 28s; animation-delay: -15s; }

        /* The physics: Rotation + Horizontal Translation = Liquid rope feel */
        @keyframes flow {
            0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-25%) translateY(20px) rotate(2deg); }
            100% { transform: translateX(0%) translateY(0) rotate(0deg); }
        }

        /* --- THE CRITICAL FIX: THE EDGE GLOW --- */
        /* This moves WITH the river, breaking the 'stagnant line' effect */
        .edge-shimmer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(-12deg);
            filter: blur(20px);
            animation: shimmer 10s infinite linear;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%) rotate(-12deg); }
            to { transform: translateX(100%) rotate(-12deg); }
        }

        /* --- CONTENT --- */
        .content {
            position: relative;
            z-index: 100;
            text-align: center;
            mix-blend-mode: difference; /* Ensures text is always readable over flowing colors */
            color: white; 
        }

        h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 800; letter-spacing: -0.05em; }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(128, 128, 128, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body data-theme="dark">

    <button class="theme-toggle" onclick="toggleTheme()">Switch Mode</button>

    <div class="river-viewport">
        <div class="river-mesh">
            <div class="strand s1"></div>
            <div class="strand s2"></div>
            <div class="strand s3"></div>
            <div class="strand s4"></div>
            <div class="strand s5"></div>
            <div class="edge-shimmer"></div>
        </div>
        
        <div class="content">
            <h1>RegAnchor</h1>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }
    </script>
</body>
</html>

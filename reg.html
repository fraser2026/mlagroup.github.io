<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegAnchor | AI Governance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f9fafb;
    --fg: #0A0E14;
    --fg-muted: #4b5563;
    --border: #1F2937;
    --font-brand: 'IBM Plex Sans', sans-serif;
    
    /* Vibrant, distinct colors */
    --c1: #6366f1; /* Indigo */
    --c2: #a855f7; /* Violet */
    --c3: #ec4899; /* Pink */
    --c4: #f97316; /* Orange */
  }

  html[data-theme="dark"] {
    --bg: #030712;
    --fg: #ffffff;
    --fg-muted: #9ca3af;
    --border: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font-brand); color: var(--fg); transition: background 0.4s ease; }

  /* === THE ENGINE === */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    filter: saturate(1.4);
  }

  /* Noise Overlay to fix the "muddy" gradient look */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.04;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  .canvas {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    transform: rotate(-12deg) skewX(-15deg); /* Creates the sharp diagonal "streak" */
  }

  .ribbon {
    position: absolute;
    width: 100%;
    height: 12vh;
    left: 0;
    will-change: transform;
    opacity: 0.15;
    /* The "Striation" - using a fine linear gradient to simulate silk texture */
    background: linear-gradient(90deg, 
      transparent 0%, 
      rgba(255,255,255,0.4) 20%, 
      rgba(255,255,255,0.8) 50%, 
      rgba(255,255,255,0.4) 80%, 
      transparent 100%
    );
    filter: blur(40px); /* Lower blur = sharper streaks */
  }

  html[data-theme="dark"] .ribbon { opacity: 0.25; }

  .r1 { top: 10%; background-color: var(--c1); animation: flow 25s linear infinite; }
  .r2 { top: 30%; background-color: var(--c2); animation: flow 35s linear infinite reverse; }
  .r3 { top: 55%; background-color: var(--c3); animation: flow 30s linear infinite; }
  .r4 { top: 80%; background-color: var(--c4); animation: flow 40s linear infinite reverse; }

  @keyframes flow {
    from { transform: translateX(-30%); }
    to { transform: translateX(30%); }
  }

  /* === UI LAYOUT === */
  .page {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .nav { border-top: 1px solid var(--border); padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-muted); }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 10vh; }
  .wordmark { font-size: clamp(60px, 12vw, 160px); font-weight: 500; letter-spacing: -0.04em; line-height: 0.85; margin-bottom: 30px; }
  .statement { font-size: clamp(20px, 2.5vw, 32px); line-height: 1.3; color: var(--fg-muted); max-width: 800px; }
  .statement strong { color: var(--fg); font-weight: 600; }

  .footer { border-bottom: 1px solid var(--border); padding-bottom: 20px; display: flex; justify-content: space-between; }

  .btn-theme {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="canvas">
    <div class="ribbon r1"></div>
    <div class="ribbon r2"></div>
    <div class="ribbon r3"></div>
    <div class="ribbon r4"></div>
  </div>
</div>

<div class="page">
  <nav class="nav">
    <div class="tag">In Development</div>
    <button class="btn-theme" onclick="toggleTheme()">Toggle Theme</button>
  </nav>

  <main class="main">
    <h1 class="wordmark">RegAnchor</h1>
    <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
  </main>

  <footer class="footer">
    <div class="tag">Coming 2026</div>
    <div class="tag">reganchor.com</div>
  </footer>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  }
  // Detect system preference
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>

</body>
</html>

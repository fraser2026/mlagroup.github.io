<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegAnchor | AI Governance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF; --fg: #0A0E14; --fg-m: #4B5563;
            --c1: #6366f1; --c2: #a855f7; --c3: #ec4899; --c4: #f97316;
        }
        html[data-theme="dark"] {
            --bg: #030712; --fg: #FFFFFF; --fg-m: #9CA3AF;
            --c1: #1e1b4b; --c2: #4c1d95; --c3: #701a75; --c4: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; overflow: hidden; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--fg); transition: background 0.5s ease; }
        
        #canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
        
        /* The Satin Grain Texture */
        .grain {
            position: fixed; inset: 0; z-index: 1; opacity: 0.04; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .page { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; padding: 30px 40px; max-width: 1400px; margin: 0 auto; pointer-events: none; }
        header, footer { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-m); pointer-events: auto; }
        header { border-top: 1px solid var(--fg); padding-top: 20px; }
        footer { border-bottom: 1px solid var(--fg); padding-bottom: 20px; }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .wordmark { font-size: clamp(50px, 10vw, 150px); font-weight: 500; letter-spacing: -0.04em; line-height: 0.85; margin-bottom: 25px; }
        .statement { font-size: clamp(18px, 2.2vw, 30px); line-height: 1.35; color: var(--fg-m); max-width: 750px; }
        .statement strong { color: var(--fg); font-weight: 600; }
        .theme-btn { background: var(--fg); color: var(--bg); border: none; padding: 8px 14px; font-size: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="grain"></div>
    <div class="page">
        <header><div>In Development</div><button class="theme-btn" onclick="toggleTheme()">Toggle Theme</button></header>
        <main>
            <h1 class="wordmark">RegAnchor</h1>
            <p class="statement">Intelligence for AI governance. <strong>A continuous, evidential layer beneath every AI system you operate</strong> — registered, scored, and held to account in real time.</p>
        </main>
        <footer><div>Coming 2026</div><div>reganchor.com</div></footer>
    </div>

    <script>
        // SHADER SOURCE CODE
        const V_SRC = `precision mediump float; attribute vec2 p; void main(){ gl_Position=vec4(p,0,1); }`;
        const F_SRC = `
            precision mediump float;
            uniform float t;
            uniform vec2 r;
            uniform vec3 c1, c2, c3, c4;

            // Simplex-like noise for fluid motion
            vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
            float snoise(vec2 v){
              const vec4 C = vec4(0.21, 0.36, -0.57, 0.02);
              vec2 i  = floor(v + dot(v, C.yy) );
              vec2 x0 = v -   i + dot(i, C.xx);
              vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
              vec4 x12 = x0.xyxy + C.xxzz;
              x12.xy -= i1;
              i = mod(i, 289.0);
              vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
              vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
              m = m*m ; m = m*m ;
              vec3 x = 2.0 * fract(p * C.www) - 1.0;
              vec3 h = abs(x) - 0.5;
              vec3 ox = floor(x + 0.5);
              vec3 a0 = x - ox;
              m *= 1.79 - 0.85 * ( a0*a0 + h*h );
              vec3 g;
              g.x  = a0.x  * x0.x  + h.x  * x0.y;
              g.yz = a0.yz * x12.xz + h.yz * x12.yw;
              return 130.0 * dot(m, g);
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / r;
                float n = snoise(uv * 1.5 + t * 0.2);
                
                // Create the diagonal satin flow
                float mask = smoothstep(0.1, 0.9, uv.x + uv.y + n * 0.5);
                vec3 color = mix(mix(c1, c2, uv.x), mix(c3, c4, uv.y), n);
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');
        
        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, V_SRC));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, F_SRC));
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,1,-1,-1,1,1,1,-1]), gl.STATIC_DRAW);

        const pLoc = gl.getAttribLocation(program, 'p');
        gl.enableVertexAttribArray(pLoc);
        gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

        const tLoc = gl.getUniformLocation(program, 't');
        const rLoc = gl.getUniformLocation(program, 'r');
        const cLocs = [
            gl.getUniformLocation(program, 'c1'),
            gl.getUniformLocation(program, 'c2'),
            gl.getUniformLocation(program, 'c3'),
            gl.getUniformLocation(program, 'c4')
        ];

        function hexToRgb(hex) {
            const BigInt = window.BigInt || function(s){return parseInt(s,16)};
            const i = parseInt(hex.slice(1), 16);
            return [(i >> 16 & 255) / 255, (i >> 8 & 255) / 255, (i & 255) / 255];
        }

        function render(time) {
            const style = getComputedStyle(document.documentElement);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);

            gl.uniform1f(tLoc, time * 0.001);
            gl.uniform2f(rLoc, canvas.width, canvas.height);
            
            cLocs.forEach((loc, i) => {
                const color = hexToRgb(style.getPropertyValue(`--c${i+1}`).trim());
                gl.uniform3fv(loc, color);
            });

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);

        function toggleTheme() {
            const h = document.documentElement;
            h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>

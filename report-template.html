function ps(s){
  if(!s) return '';
  return String(s)
    .replace(/[\u2014\u2013]/g,'-')
    .replace(/[\u2018\u2019]/g,"'")
    .replace(/[\u201C\u201D]/g,'"')
    .replace(/\u2026/g,'...')
    .replace(/\u00A0/g,' ')
    .trim();
}

function x(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=ps(s); return d.innerHTML; }

function getBand(adj, bandId){
  if(bandId){ for(let b of RB){ if(b.id===bandId) return b; } }
  for(let b of RB){ if(adj>=b.min && adj<=b.max) return b; }
  return RB[2];
}

function recon(row){
  const sp = row.section_scores || {};
  const band = getBand(row.adjusted_score||0, row.risk_band);
  const sec = row.sector || 'Other';
  const mult = SM[sec] || 0.90;
  const pf = (row.priority_flags||[]).map(f=>({
    id: f.id||'', label: f.label||'', basis: f.basis||'', severity: f.severity||'high'
  }));
  const bsm = {s1:9,s2:18,s3:12,s4:12,s5:15,s6:15,s7:15};
  let rs = row.raw_scores || {};
  if(Object.keys(rs).length===0){
    Object.keys(sp).forEach(s=>{ rs[s]=Math.round((sp[s]/100)*(bsm[s]||15)); });
  }
  return {
    adjustedScore: row.adjusted_score||0,
    weightedScore: row.weighted_score||0,
    multiplier: mult,
    sector: sec,
    orgSize: row.org_size||'',
    respondentName: (row.respondent_name||'').trim(),
    respondentRole: (row.respondent_role||'').trim(),
    band,
    sectionPcts: sp,
    rawScores: rs,
    priorityFlags: pf,
    regimeFlags: row.regime_flags||[],
    uncertaintyCount: row.uncertainty_count||0,
    selectedCategories: row.selected_categories||[],
    frameworkVersion: row.framework_version||'2.0.0'
  };
}

function buildFindings(R){
  const list = [];
  R.priorityFlags.forEach(f=>{
    const d = FD[f.id] || {section:'General',severity:f.severity||'high',impact:'This governance area requires attention.',rec:'Review with your compliance function.'};
    list.push({label:ps(f.label),basis:ps(f.basis),section:d.section,severity:d.severity,impact:d.impact,rec:d.rec});
  });
  (R.regimeFlags||[]).forEach(f=>{
    list.push({label:ps(f.label),basis:ps(f.basis),section:RF_TEMPLATE.section,severity:RF_TEMPLATE.severity,impact:RF_TEMPLATE.impact,rec:RF_TEMPLATE.rec});
  });
  if(R.uncertaintyCount>=3){
    list.push({label:`Elevated uncertainty: ${R.uncertaintyCount} responses flagged insufficient internal visibility`,basis:'Risk band elevated per framework uncertainty threshold',section:'Assessment Integrity',severity:'moderate',impact:`This assessment recorded ${R.uncertaintyCount} uncertainty flags — instances where the respondent indicated incomplete visibility into their own AI governance arrangements. An organisation that does not know whether a control exists cannot claim that control for compliance purposes. The reported score should be understood as a ceiling, not a floor.`,rec:'Conduct an internal governance stocktake to establish the factual position on each uncertain area before any regulatory engagement.'});
  }
  if(R.selectedCategories&&R.selectedCategories.length>0&&!R.selectedCategories.includes('none')){
    list.push({label:'High-risk AI category detected — EU AI Act Annex III obligations apply from August 2026',basis:`EU AI Act Annex III; Categories: ${R.selectedCategories.join(', ')}`,section:'AI Inventory & Classification',severity:'critical',impact:'AI systems in Annex III categories are subject to mandatory conformity assessments, technical documentation requirements, human oversight obligations under Article 14, and logging requirements under Article 12. High-risk obligations apply from August 2026.',rec:'Conduct a formal EU AI Act scoping assessment for each high-risk category identified. Map current systems against the full Annex III compliance checklist and prioritise conformity assessment preparation immediately.'});
  }
  return list;
}

function buildRoadmap(R){
  const domains = ['s1','s2','s3','s4','s5','s6','s7'];
  const scored = domains.map(s=>({
    key:s, pct:R.sectionPcts[s]||0, w:W[s]||0,
    risk:(1-((R.sectionPcts[s]||0)/100))*(W[s]||0)
  })).sort((a,b)=>b.risk-a.risk);

  const p1keys = scored.slice(0,2).map(d=>d.key);
  const p2keys = scored.slice(2,4).map(d=>d.key);
  const p3keys = scored.slice(4).map(d=>d.key);

  const makePhase = (keys,name,window,badge) => ({
    name, window, badge,
    rationale: `Prioritised by risk contribution score. Focus: ${keys.map(k=>SN[k]+' ('+Math.round(W[k]*100)+'% weight)').join(' and ')}.`,
    actions: keys.flatMap(k=>{
      const a = RM_ACTIONS[k]||{owner:'Compliance',actions:['Review and document current position'],del:'Assessment Complete'};
      return a.actions.map(txt=>({text:txt,owner:a.owner,del:a.del}));
    }).slice(0,6),
    deliverables: [...new Set(keys.map(k=>(RM_ACTIONS[k]||{del:'Documented Output'}).del))]
  });

  return {
    p1: makePhase(p1keys,'Phase 1: Defensive Shielding','Days 0–30','Immediate Priority'),
    p2: makePhase(p2keys,'Phase 2: Structural Foundation','Days 31–60','Structural Build'),
    p3: makePhase(p3keys,'Phase 3: Operational Excellence','Days 61–90+','Ongoing')
  };
}

function bandClass(score){
  if(score<30) return 'c';
  if(score<45) return 'h';
  if(score<65) return 'm';
  return 'l';
}

function domainAssessment(sk, bandId){
  const prem = PREMIUM[sk];
  if(!prem) return '';
  const map = {critical:'critical',high:'high',moderate:'moderate',lowmod:'moderate',low:'low'};
  const key = map[bandId] || 'high';
  const pd = prem[key] || prem.high || {};
  return pd.assessment || pd.exposure || '';
}

    <span class="section-label">02 — Governance Maturity Dashboard</span>
    <div class="section-title">Domain Performance <span class="font-serif">Overview.</span></div>
    <p class="section-intro">Domain scores reflect the proportion of maximum available points achieved in each governance area, weighted by regulatory enforcement priority.</p>
    <div class="dash-banner">
      <div>
        <div class="dash-score-sub">Adjusted Exposure Score</div>
        <div class="dash-score-num">${R.adjustedScore}%</div>
      </div>
      <div>
        <div class="dash-band" style="color:${bandColor}">${x(R.band.label)}</div>
        <div class="dash-band-sub">${x(R.band.heading)}</div>
      </div>
    </div>
    ${dk.map((sk,i)=>{
      const sc = R.sectionPcts[sk]||0;
      const bc2 = bandClass(sc);
      const wt = Math.round(W[sk]*100);
      return `<div class="dom-row">
        <span class="dom-n">S${i+1}</span>
        <span class="dom-name">${x(SN[sk])}</span>
        <div class="dom-bar-w"><div class="dom-bar b-${bc2}" style="width:${sc}%"></div></div>
        <span class="dom-pct c-${bc2}">${sc}%</span>
        <span class="dom-wt">${wt}% weight</span>
      </div>`;
    }).join('')}
    <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:5px;font-size:7pt"><span style="width:8px;height:8px;border-radius:2px;background:var(--red);display:inline-block"></span>0–29% Critical</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:7pt"><span style="width:8px;height:8px;border-radius:2px;background:var(--orange);display:inline-block"></span>30–44% High</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:7pt"><span style="width:8px;height:8px;border-radius:2px;background:var(--amber);display:inline-block"></span>45–64% Moderate</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:7pt"><span style="width:8px;height:8px;border-radius:2px;background:var(--green);display:inline-block"></span>65%+ Low</div>
    </div>
    <div class="sub-label" style="margin-top:14px">Domain Weight Classification</div>
    <table class="tbl">
      <thead><tr><th>Domain</th><th style="width:10%">Weight</th><th style="width:8%">Score</th><th>Primary Regulatory Basis</th></tr></thead>
      <tbody>
        ${dk.map((sk,i)=>{const sc=R.sectionPcts[sk]||0;const bc2=bandClass(sc);return`<tr><td style="font-weight:600">S${i+1} — ${x(SN[sk])}</td><td>${Math.round(W[sk]*100)}%</td><td class="c-${bc2}" style="font-weight:700">${sc}%</td><td style="font-size:6.5pt;color:var(--text-2)">${['EU AI Act Art.9/16, ICO Accountability Framework','FCA SM&CR, EU AI Act Art.27, ICO Accountability Framework','UK GDPR Art.30, EU AI Act Art.10','UK GDPR Art.22, EU AI Act Art.14, FCA SM&CR','UK GDPR Art.13/14/22, EU AI Act Art.12','UK GDPR Art.35, EU AI Act Art.9, FCA DP5/22','EU AI Act Art.72/73, FCA PS7/21'][i]}</td></tr>`;}).join('')}
      </tbody>
    </table>
  </div>`;

  // ═══ 03 REGULATORY REGISTER ═══
  o += `<div class="section">
    <span class="section-label">03 — Regulatory Register</span>
    <div class="section-title">Applicable <span class="font-serif">Obligations.</span></div>
    <p class="section-intro">Mandatory obligations are legal requirements with defined enforcement consequences. Advisory obligations represent regulatory best practice with increasing enforcement weight.</p>
    <table class="tbl">
      <thead><tr><th style="width:14%">Regulation</th><th style="width:12%">Article</th><th>Obligation</th><th style="width:10%">Type</th><th style="width:22%">Penalty Exposure</th><th style="width:10%">Deadline</th></tr></thead>
      <tbody>
        ${REG_TABLE.map(r=>`<tr><td style="font-weight:600">${x(r.reg)}</td><td style="color:var(--text-2)">${x(r.art)}</td><td>${x(r.obl)}</td><td><span class="badge ${r.type==='M'?'b-mandatory':'b-advisory'}">${r.type==='M'?'Mandatory':'Advisory'}</span></td><td style="font-size:6.5pt;color:var(--text-2)">${x(r.pen)}</td><td style="font-weight:600;color:var(--text-2)">${x(r.dl)}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="notice">
      <div class="notice-title">Classification Note</div>
      <div class="notice-text"><strong>Mandatory</strong> obligations represent requirements where non-compliance may result in enforcement action, financial penalty, or individual regulatory sanction. <strong>Advisory</strong> obligations represent standards of best practice referenced by regulators — their absence is frequently cited in regulatory findings as evidence of governance inadequacy.</div>
    </div>
  </div>`;

  // ═══ 04 RISK BAND CLASSIFICATION ═══
  o += `<div class="section">
    <span class="section-label">04 — Risk Band Classification</span>
    <div class="section-title">Five-Band <span class="font-serif">Framework.</span></div>
    <p class="section-intro">The MLA diagnostic produces one of five risk band classifications. Each band represents a distinct governance position requiring a distinct response.</p>
    <table class="tbl">
      <thead><tr><th style="width:18%">Band</th><th style="width:14%">Score Range</th><th>Classification</th><th>Report Framing</th></tr></thead>
      <tbody>
        ${RB.map(b=>{const isCurrent=b.id===R.band.id;return`<tr style="${isCurrent?'background:#fffbeb;':''}"><td style="font-weight:700;color:${BAND_COLORS[b.id]}">${x(b.label)}</td><td style="color:var(--text-2)">${b.min}–${b.max}%</td><td style="font-size:7.5pt">${x(b.summary).substring(0,120)}...</td><td style="font-size:7pt;color:var(--text-2)">${x(b.heading)}${isCurrent?' <strong style="color:'+BAND_COLORS[b.id]+'">← Current</strong>':''}</td></tr>`;}).join('')}
      </tbody>
    </table>
  </div>`;

  // ═══ 05 PRIORITY FINDINGS ═══
  o += `<div class="section">
    <span class="section-label">05 — Priority Findings</span>
    <div class="section-title">Critical Governance <span class="font-serif">Findings.</span></div>
    <p class="section-intro">Findings are drawn directly from assessment responses and ordered by severity. Each identifies a specific governance gap, its regulatory consequence, and the required action.</p>
    ${findings.map((f,i)=>{
      const sevColor = f.severity==='critical'?'#dc2626':f.severity==='high'?'#ea580c':f.severity==='regulatory'?'#2563eb':'#d97706';
      const sevBg = f.severity==='critical'?'#fef2f2':f.severity==='high'?'#fff7ed':f.severity==='regulatory'?'#eff6ff':'#fffbeb';
      return `<div class="finding" style="border-left-color:${sevColor}">
        <div class="finding-header">
          <span class="finding-num">Finding ${String(i+1).padStart(2,'0')}</span>
          <span class="finding-sev-badge" style="color:${sevColor};background:${sevBg}">${f.severity==='regulatory'?'REGULATORY':f.severity.toUpperCase()}</span>
          <span class="finding-section">${x(f.section)}</span>
          ${f.basis?`<span class="finding-basis">${x(f.basis)}</span>`:''}
        </div>
        <div class="finding-body">
          <div class="finding-title">${x(f.label)}</div>
          <div class="finding-cols">
            <div><div class="fc-label">Business & Regulatory Impact</div><div class="fc-text">${x(f.impact)}</div></div>
            <div><div class="fc-label">Recommended Action</div><div class="fc-text">${x(f.rec)}</div></div>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // ═══ 06 ROADMAP ═══
  const phClasses = ['','ph2','ph3'];
  const phBadges = ['pb1','pb2','pb3'];
  const phActs = ['an1','an2','an3'];
  o += `<div class="section">
    <span class="section-label">06 — Remediation Roadmap</span>
    <div class="section-title">30 / 60 / 90-Day <span class="font-serif">Action Plan.</span></div>
    <p class="section-intro">Phases are sequenced by risk contribution score, ensuring resources address areas of greatest regulatory exposure first.</p>
    ${['p1','p2','p3'].map((pk,pi)=>{
      const ph = roadmap[pk];
      if(!ph) return '';
      return `<div class="phase ${phClasses[pi]}">
        <div class="phase-header">
          <span class="phase-window">${x(ph.window)}</span>
          <span class="phase-badge ${phBadges[pi]}">${x(ph.badge)}</span>
        </div>
        <div class="phase-body">
          <div class="phase-name">${x(ph.name)}</div>
          <div class="phase-rat">${x(ph.rationale)}</div>
          <ul class="phase-actions">
            ${(ph.actions||[]).map((a,ai)=>`<li><span class="act-n ${phActs[pi]}">${ai+1}</span><span class="act-text">${x(a.text)}</span><span class="act-owner">${x(a.owner)}</span></li>`).join('')}
          </ul>
        </div>
        ${ph.deliverables&&ph.deliverables.length?`<div class="phase-deliverables"><div class="phase-del-label">Key Deliverables</div><div class="phase-del-text">${ph.deliverables.map(d=>x(d)).join(' &nbsp;·&nbsp; ')}</div></div>`:''}
      </div>`;
    }).join('')}
  </div>`;

  // ═══ 07 DOMAIN DETAIL ═══
  o += `<div class="section">
    <span class="section-label">07 — Domain Assessment Detail</span>
    <div class="section-title">Governance Domain <span class="font-serif">Analysis.</span></div>
    <p class="section-intro">Detailed assessment narrative for each governance domain. The concept name captures the principal risk dynamic identified in this organisation's posture.</p>
    ${dk.map((sk,i)=>{
      const sc = R.sectionPcts[sk]||0;
      const bc2 = bandClass(sc);
      const domBandId = sc<30?'critical':sc<45?'high':sc<65?'moderate':sc<80?'lowmod':'low';
      const domColor = BAND_COLORS[domBandId]||'#2563eb';
      const domBandLabel = RB.find(b=>b.id===domBandId)?.label||'';
      const prem = PREMIUM[sk];
      const concept = prem?.concept||SN[sk];
      const assessment = domainAssessment(sk, domBandId);
      return `<div class="domcard">
        <div class="domcard-header">
          <span class="domcard-num">S${i+1}</span>
          <span class="domcard-name">${x(SN[sk])}</span>
          <span class="domcard-score">${sc}%</span>
        </div>
        <div class="domcard-body">
          <div class="domcard-band" style="color:${domColor}">${x(domBandLabel)}</div>
          <div class="domcard-concept">"${x(concept)}"</div>
          <div class="domcard-text">${x(assessment)}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // ═══ 08 OUTLOOK ═══
  o += `<div class="section">
    <span class="section-label">08 — Forward Risk Outlook</span>
    <div class="section-title">Regulatory Trajectory & <span class="font-serif">Implications.</span></div>
    <p class="section-intro">An assessment of the forward regulatory landscape and its implications for ${x(org)}'s remediation priorities.</p>
    ${OUTLOOK.map(ol=>`<div class="outlook-block"><div class="outlook-title">${x(ol.t)}</div><div class="outlook-text">${x(ol.p)}</div></div>`).join('')}
    <div class="notice" style="margin-top:16px">
      <div class="notice-title">Important Notice</div>
      <div class="notice-text">This diagnostic provides governance maturity assessment and does not constitute legal advice. MLA Group Ltd is not a law firm. Outputs should not be relied upon as legal opinion or as confirmation of regulatory compliance. Organisations are advised to engage qualified legal and regulatory compliance professionals when implementing governance changes. Framework version ${x(R.frameworkVersion)}.</div>
    </div>
    <div class="signoff">
      <div>
        <div class="signoff-brand">MLA<span class="gold">·</span>GROUP</div>
        <div class="signoff-sub">AI Governance Risk Advisory &nbsp;·&nbsp; mlagroup.co.uk</div>
      </div>
      <div class="signoff-right">
        <div>Report generated ${date}</div>
        <div>Framework v${x(R.frameworkVersion)}</div>
        ${rpt.id?`<div>Report ID: ${x(rpt.id)}</div>`:''}
      </div>
    </div>
  </div>`;

  document.getElementById('report').innerHTML = o;
}

// ── Entry point ──
if(typeof REPORT_DATA !== 'undefined'){
  render(REPORT_DATA);
}
</script>
</body>
</html>

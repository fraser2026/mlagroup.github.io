<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MLA GROUP — GOVERNANCE REPORT v4.0
   High-density, high-contrast. Board-grade document design.
   Restricted palette: Navy #0f172a · Blue #1d4ed8 · Charcoal #1e293b
   Inter 400–800 for body. Instrument Serif italic for accent.
   ============================================================ */

:root {
  --navy:    #0f172a;
  --blue:    #1d4ed8;
  --blue-lt: #eff6ff;
  --blue-bd: #93c5fd;
  --char:    #1e293b;
  --slate:   #334155;
  --muted:   #64748b;
  --rule:    #cbd5e1;
  --rule-lt: #e2e8f0;
  --card:    #f1f5f9;
  --page:    #f8fafc;
  --sev-c:   #b91c1c;
  --sev-h:   #c2410c;
  --sev-m:   #92400e;
  --sev-l:   #166534;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

html {
  font-size:9.5pt;
  -webkit-print-color-adjust:exact!important;
  print-color-adjust:exact!important;
}

body {
  font-family:'Inter',sans-serif;
  font-weight:400;
  color:var(--char);
  line-height:1.6;
  background:white;
  -webkit-font-smoothing:antialiased;
}

/* ── PAGE STRUCTURE ── */
.section { page-break-before:always; }

/* Full-bleed navy section header — heavy and official */
.sec-bar {
  background:var(--navy);
  margin:0 -18mm 0;
  padding:10px 18mm;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:0;
}
.sec-bar-num   { font-size:5.5pt; font-weight:800; color:var(--blue-bd); text-transform:uppercase; letter-spacing:.22em; min-width:28px; }
.sec-bar-title { font-size:8pt; font-weight:700; color:white; text-transform:uppercase; letter-spacing:.12em; }
.sec-bar-org   { font-size:6pt; color:rgba(255,255,255,.28); font-weight:400; }

/* 4px blue rule immediately below the section bar */
.sec-accent { display:block; height:4px; background:var(--blue); margin:0 -18mm 18px; }

.sec-title {
  font-size:18pt; font-weight:800; color:var(--navy);
  line-height:1.08; margin-bottom:5px; letter-spacing:-.03em;
}
.sec-title em { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; letter-spacing:0; font-size:19pt; }

.sec-intro { font-size:8pt; font-weight:400; color:var(--slate); line-height:1.65; max-width:64ch; margin-bottom:16px; }

.sub-label {
  display:block; font-size:5.5pt; font-weight:800; text-transform:uppercase;
  letter-spacing:.18em; color:var(--navy); margin:14px 0 7px;
  padding-bottom:4px; border-bottom:2px solid var(--navy);
}

/* ── LOGO RENDERING ── */
.logo-mla { font-weight:800; letter-spacing:-.02em; }
.logo-grp { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; color:var(--blue); }

/* ── COVER ── */
.cover { page-break-after:always; display:flex; flex-direction:column; }

.cov-top { background:var(--navy); padding:16mm 18mm 14mm; flex-shrink:0; }
.cov-logo-sub { font-size:5.5pt; color:rgba(255,255,255,.28); letter-spacing:.07em; margin-top:4px; margin-bottom:20px; }
.cov-rule { width:36px; height:4px; background:var(--blue); margin:0 0 10px; }
.cov-doctype { font-size:5.5pt; font-weight:700; text-transform:uppercase; letter-spacing:.22em; color:rgba(255,255,255,.4); margin-bottom:12px; }
.cov-org { font-size:26pt; font-weight:800; color:white; line-height:1.02; letter-spacing:-.03em; margin-bottom:8px; }
.cov-desc { font-size:8pt; color:rgba(255,255,255,.4); line-height:1.55; max-width:56%; margin-bottom:22px; font-weight:400; }

/* Score block on cover */
.cov-score {
  display:flex; align-items:center; gap:18px;
  padding:14px 18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-top:4px solid;
  max-width:440px; margin-bottom:24px;
}
.ring { position:relative; width:76px; height:76px; flex-shrink:0; }
.ring svg { width:76px; height:76px; transform:rotate(-90deg); }
.ring-bg   { fill:none; stroke:rgba(255,255,255,.1); stroke-width:7; }
.ring-fill { fill:none; stroke-width:7; stroke-linecap:butt; }
.ring-num  { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:19pt; font-weight:800; color:white; letter-spacing:-.04em; }
.score-pill { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.14em; padding:3px 9px; color:white; display:inline-block; margin-bottom:5px; }
.score-hdg { font-size:8pt; color:rgba(255,255,255,.5); line-height:1.4; font-weight:500; }

/* Cover meta — strict table layout, no CSS grid */
.cov-meta { width:100%; border-top:1px solid rgba(255,255,255,.08); padding-top:14px; }
.cov-meta table { width:100%; border-collapse:collapse; }
.cov-meta td { width:25%; vertical-align:top; padding:0 16px 0 0; }
.cov-meta-lbl { font-size:5pt; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color:rgba(255,255,255,.25); display:block; margin-bottom:4px; }
.cov-meta-val { font-size:7.5pt; font-weight:600; color:white; line-height:1.4; display:block; }

/* Cover bottom — white section */
.cov-btm { background:white; padding:12mm 18mm 8mm; flex:1; display:flex; flex-direction:column; }

.cov-verdict {
  padding:12px 16px; border-left:5px solid;
  background:var(--card); margin-bottom:16px;
}
.cov-verdict-lbl { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.16em; margin-bottom:5px; }
.cov-verdict-txt { font-size:8pt; color:var(--char); line-height:1.65; font-weight:400; }

.toc { margin-top:auto; }
.toc-rule { height:2px; background:var(--navy); margin-bottom:12px; }
.toc-hdg { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.18em; color:var(--navy); margin-bottom:9px; }
.toc-grid table { width:100%; border-collapse:collapse; }
.toc-grid td { width:50%; padding:3px 0; font-size:7.5pt; color:var(--char); font-weight:500; vertical-align:top; }
.toc-n { display:inline-block; width:22px; font-weight:800; color:var(--blue); font-size:7pt; }

.rpt-id { margin-top:12px; padding-top:8px; border-top:1px solid var(--rule-lt); font-size:5.5pt; color:var(--muted); letter-spacing:.04em; }

/* ── TABLES ── */
.tbl { width:100%; border-collapse:collapse; font-size:7.5pt; margin-bottom:14px; }
.tbl thead th {
  background:var(--navy); color:white; font-weight:700;
  text-align:left; padding:8px 10px;
  font-size:5.5pt; text-transform:uppercase; letter-spacing:.1em;
}
.tbl tbody td { padding:7px 10px; border-bottom:1px solid var(--rule-lt); vertical-align:top; line-height:1.5; color:var(--char); }
.tbl tbody tr:nth-child(even) td { background:var(--page); }
.tbl tbody tr:last-child td { border-bottom:2px solid var(--rule); }
.tbl tbody tr { page-break-inside:avoid; }

.badge { display:inline-block; padding:2px 7px; font-size:5.5pt; font-weight:700; text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
.b-mandatory { background:#fef2f2; color:#7f1d1d; border:1px solid #fca5a5; }
.b-advisory  { background:#eff6ff; color:#1e3a8a; border:1px solid #93c5fd; }

/* ── VERDICT ── */
.verdict { padding:12px 16px; border-left:5px solid var(--navy); background:var(--card); margin-bottom:14px; page-break-inside:avoid; }
.verdict-lbl { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.16em; margin-bottom:5px; }
.verdict-txt { font-size:8pt; color:var(--char); line-height:1.65; }

/* ── BOARD ATTENTION ── */
.attn { list-style:none; margin-bottom:14px; border:1px solid var(--rule); }
.attn li { position:relative; padding:9px 10px 9px 32px; font-size:8pt; line-height:1.5; border-bottom:1px solid var(--rule-lt); page-break-inside:avoid; font-weight:500; background:white; }
.attn li:nth-child(even) { background:var(--page); }
.attn li:last-child { border-bottom:none; }
.attn li::before { content:attr(data-n); position:absolute; left:8px; top:10px; width:16px; height:16px; background:var(--navy); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:5.5pt; font-weight:800; }
.attn-sub { display:block; font-size:6pt; color:var(--muted); margin-top:2px; font-weight:400; }

/* ── DASHBOARD ── */
.dash-hdr {
  background:var(--navy); padding:14px 18px;
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:0;
}
.dash-num { font-size:24pt; font-weight:800; color:white; line-height:1; letter-spacing:-.04em; }
.dash-num-lbl { font-size:5pt; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color:rgba(255,255,255,.35); margin-top:4px; }
.dash-band { font-size:11pt; font-weight:700; line-height:1.2; }
.dash-band-sub { font-size:6.5pt; color:rgba(255,255,255,.4); margin-top:3px; }

.dom-wrap { border:1px solid var(--rule); border-top:none; background:white; padding:8px 14px; margin-bottom:14px; }
.dom-row { display:flex; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule-lt); page-break-inside:avoid; }
.dom-row:last-child { border-bottom:none; }
.dom-n    { font-size:6pt; font-weight:800; color:var(--blue); width:24px; flex-shrink:0; }
.dom-name { font-size:7.5pt; font-weight:600; width:166px; flex-shrink:0; color:var(--char); }
.dom-track{ flex:1; height:7px; background:var(--card); margin:0 12px; overflow:hidden; }
.dom-fill { height:100%; }
.dom-pct  { font-size:9pt; font-weight:800; width:38px; text-align:right; flex-shrink:0; letter-spacing:-.02em; }
.dom-wt   { font-size:5.5pt; color:var(--muted); width:52px; text-align:right; flex-shrink:0; font-weight:500; }

.sc-c{color:var(--sev-c);} .bc-c{background:var(--sev-c);}
.sc-h{color:var(--sev-h);} .bc-h{background:var(--sev-h);}
.sc-m{color:var(--sev-m);} .bc-m{background:var(--sev-m);}
.sc-l{color:var(--sev-l);} .bc-l{background:var(--sev-l);}

/* ── FINDING CARDS — high density, high contrast ── */
.finding { border:1px solid var(--rule); border-left:5px solid; margin-bottom:12px; page-break-inside:avoid; overflow:hidden; }
.find-hd { background:var(--navy); padding:7px 12px; display:flex; align-items:center; gap:9px; }
.find-num { font-size:5.5pt; font-weight:800; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.14em; min-width:58px; }
.sev-pill { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.1em; padding:2px 8px; color:white; border:1px solid rgba(255,255,255,.2); }
.find-sec { font-size:5.5pt; color:rgba(255,255,255,.4); font-weight:500; }
.find-basis { font-size:5.5pt; color:var(--blue-bd); font-weight:700; margin-left:auto; text-align:right; }
.find-body { padding:11px 13px; background:white; }
.find-title { font-size:9.5pt; font-weight:700; color:var(--navy); line-height:1.3; margin-bottom:10px; }
.find-grid { display:table; width:100%; }
.find-col  { display:table-cell; width:50%; vertical-align:top; padding-right:14px; }
.find-col:last-child { padding-right:0; padding-left:14px; border-left:1px solid var(--rule-lt); }
.fc-lbl { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.14em; color:var(--navy); margin-bottom:4px; border-bottom:1px solid var(--rule-lt); padding-bottom:3px; }
.fc-txt { font-size:7.5pt; color:var(--slate); line-height:1.6; margin-top:4px; }

/* ── PHASE CARDS ── */
.phase { border:1px solid var(--rule); margin-bottom:12px; page-break-inside:avoid; overflow:hidden; }
.ph-hd { background:var(--navy); padding:10px 13px; display:flex; justify-content:space-between; align-items:center; }
.ph-win  { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.18em; color:rgba(255,255,255,.35); }
.ph-name { font-size:9pt; font-weight:700; color:white; margin-top:2px; }
.ph-badge { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.1em; padding:3px 9px; background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.15); }
.ph-body { padding:11px 13px; background:white; }
.ph-rat { font-size:7.5pt; color:var(--slate); line-height:1.55; margin-bottom:10px; }
.ph-acts { list-style:none; }
.ph-acts li { display:flex; align-items:flex-start; gap:9px; padding:6px 0; border-bottom:1px solid var(--rule-lt); font-size:7.5pt; line-height:1.45; color:var(--char); page-break-inside:avoid; font-weight:500; }
.ph-acts li:last-child { border-bottom:none; }
.act-n { width:18px; height:18px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:6pt; font-weight:800; color:white; margin-top:1px; background:var(--blue); }
.act-txt { flex:1; }
.act-own { font-size:5.5pt; color:var(--muted); font-weight:600; padding:2px 6px; background:var(--card); border:1px solid var(--rule); white-space:nowrap; flex-shrink:0; }
.ph-del { background:var(--card); border-top:2px solid var(--navy); padding:8px 13px; display:flex; gap:10px; }
.ph-del-lbl { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.12em; color:var(--navy); min-width:72px; flex-shrink:0; margin-top:1px; }
.ph-del-txt { font-size:7pt; color:var(--slate); line-height:1.5; }

/* ── DOMAIN CARDS ── */
.domcard { border:1px solid var(--rule); margin-bottom:10px; page-break-inside:avoid; overflow:hidden; }
.domcard-hd { background:var(--navy); padding:8px 13px; display:flex; align-items:center; gap:9px; }
.dc-num  { font-size:6pt; font-weight:800; color:var(--blue-bd); min-width:22px; }
.dc-name { font-size:5.5pt; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.5); }
.dc-score{ margin-left:auto; font-size:11pt; font-weight:800; color:white; letter-spacing:-.03em; }
.domcard-body { padding:11px 13px; background:white; }
.dc-band  { font-size:5.5pt; font-weight:800; text-transform:uppercase; letter-spacing:.12em; margin-bottom:6px; }
.dc-concept { font-family:'Instrument Serif',serif; font-style:italic; font-size:12pt; color:var(--navy); margin-bottom:7px; line-height:1.25; }
.dc-text  { font-size:7.5pt; color:var(--slate); line-height:1.65; }

/* ── OUTLOOK ── */
.outlook-item { border:1px solid var(--rule); border-left:5px solid var(--blue); padding:11px 14px; margin-bottom:11px; page-break-inside:avoid; background:var(--card); }
.outlook-title { font-size:8.5pt; font-weight:700; color:var(--navy); margin-bottom:5px; }
.outlook-txt { font-size:8pt; color:var(--slate); line-height:1.65; }

.notice { background:var(--card); border:1px solid var(--rule); border-top:3px solid var(--navy); padding:11px 14px; page-break-inside:avoid; }
.notice-title { font-size:6pt; font-weight:800; text-transform:uppercase; letter-spacing:.14em; color:var(--navy); margin-bottom:5px; }
.notice-txt { font-size:7pt; color:var(--slate); line-height:1.65; }

.signoff { margin-top:22px; padding-top:12px; border-top:3px solid var(--navy); display:flex; justify-content:space-between; align-items:flex-end; page-break-inside:avoid; }
.signoff-sub { font-size:6pt; color:var(--muted); margin-top:3px; }
.signoff-r { text-align:right; font-size:6.5pt; color:var(--muted); line-height:1.6; }
</style>
</head>

const SN={s1:'AI Inventory & Classification',s2:'Governance & Accountability',s3:'Data Quality & Lineage',s4:'Human Oversight & Controls',s5:'Explainability & Transparency',s6:'Compliance & Legal Alignment',s7:'Operational Controls & Resilience'};

  pf_governance:{section:'Governance & Accountability',severity:'critical',impact:'The absence of a named AI governance owner creates a structural accountability gap. Under the EU AI Act and FCA operational resilience expectations, clear documented ownership is a baseline requirement. In any enforcement investigation, this is the first question asked: who is accountable?',rec:'Appoint a named individual as AI Governance Lead with a documented mandate, defined scope covering all AI systems in use, and a formal reporting line to board or senior executive level.'},
  pf_oversight:{section:'Human Oversight & Controls',severity:'critical',impact:'Automated decisions affecting individuals without adequate human review create direct regulatory exposure. UK GDPR Article 22 imposes specific requirements where decisions are solely automated. EU AI Act Article 14 makes human oversight a mandatory requirement for high-risk AI systems.',rec:'Implement mandatory human review protocols for all AI-assisted decisions that materially affect individuals. Document the protocol, define what constitutes a high-impact outcome, name the review function, and maintain records.'},

  pf_no_policy:{section:'Governance & Accountability',severity:'high',impact:'Without documented AI use policies, staff have no authoritative guidance on acceptable use, prohibited applications, risk escalation, or governance obligations. This creates unmanaged operational risk across every function using AI tools.',rec:'Develop and implement a comprehensive AI Use Policy covering permitted and prohibited applications, risk assessment requirements, data handling obligations, human oversight requirements, and incident reporting.'}

  s1:{concept:'The Invisible Fleet',
    critical:{assessment:'No structured AI system inventory exists. The organisation does not know which AI tools are in operational use, who authorised their deployment, what data they process, or whether any qualify as high-risk under EU AI Act Annex III. This is a fundamental governance failure that makes all downstream controls impossible to operate.'},

    high:{assessment:'Governance ownership is informally assigned without documented mandate, defined scope, or formal reporting line. AI governance decisions are made without documented authority or board visibility. Informal governance cannot withstand regulatory examination.'},

    critical:{assessment:'No data lineage documentation exists for AI systems. The organisation cannot identify the source of training data, validate data quality, or trace the provenance of inputs to AI-driven decisions. EU AI Act Article 10 requires that high-risk AI systems use training data that meets quality standards and that data governance practices are documented.'},

  },
  s5:{concept:'The Black Box Problem',

    high:{assessment:'Limited transparency measures exist but no systematic framework ensures consistent disclosure across AI systems. Explanation capability is absent or untested. Ad hoc measures cannot satisfy regulatory requirements.'},
    moderate:{assessment:'Some explainability mechanisms exist but are not systematically documented or consistently applied across all AI systems that affect individuals.'},

// ════ UTILITIES ════
function ps(s){if(!s)return'';return String(s).replace(/[\u2014\u2013]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u2026/g,'...').replace(/\u00A0/g,' ').trim();}
function x(s){if(!s)return'';const d=document.createElement('div');d.textContent=ps(s);return d.innerHTML;}
function getBand(adj,bid){if(bid){for(const b of RB){if(b.id===bid)return b;}}for(const b of RB){if(adj>=b.min&&adj<=b.max)return b;}return RB[2];}
function sc(p){return p<30?'c':p<45?'h':p<65?'m':'l';}

function recon(row){
  const sp=row.section_scores||{};
  const band=getBand(row.adjusted_score||0,row.risk_band);
  const pf=(row.priority_flags||[]).map(f=>({id:f.id||'',label:f.label||'',basis:f.basis||'',severity:f.severity||'high'}));
  const bsm={s1:9,s2:18,s3:12,s4:12,s5:15,s6:15,s7:15};
  let rs=row.raw_scores||{};
  if(!Object.keys(rs).length){Object.keys(sp).forEach(k=>{rs[k]=Math.round((sp[k]/100)*(bsm[k]||15));});}
  return{score:row.adjusted_score||0,band,sector:row.sector||'Other',orgSize:row.org_size||'',name:(row.respondent_name||'').trim(),role:(row.respondent_role||'').trim(),pcts:sp,priorityFlags:pf,regimeFlags:row.regime_flags||[],uncertainty:row.uncertainty_count||0,categories:row.selected_categories||[],fv:row.framework_version||'2.0.0'};
}

function buildFindings(R){
  const list=[];
  R.priorityFlags.forEach(f=>{const d=FD[f.id]||{section:'General',severity:f.severity||'high',impact:'This governance area requires attention.',rec:'Review with your compliance function.'};list.push({label:ps(f.label),basis:ps(f.basis),section:d.section,severity:d.severity,impact:d.impact,rec:d.rec});});
  (R.regimeFlags||[]).forEach(f=>{list.push({label:ps(f.label),basis:ps(f.basis),section:RF.section,severity:'regulatory',impact:RF.impact,rec:RF.rec});});
  if(R.uncertainty>=3){list.push({label:`Elevated uncertainty: ${R.uncertainty} responses flagged insufficient internal visibility`,basis:'Framework uncertainty threshold',section:'Assessment Integrity',severity:'moderate',impact:`This assessment recorded ${R.uncertainty} uncertainty flags — instances where the respondent indicated incomplete visibility into their own AI governance arrangements. An organisation that does not know whether a control exists cannot claim that control for compliance purposes.`,rec:'Conduct an internal governance stocktake to establish the factual position on each uncertain area before any regulatory engagement.'});}
  if(R.categories&&R.categories.length&&!R.categories.includes('none')){list.push({label:'High-risk AI category detected — EU AI Act Annex III obligations apply from August 2026',basis:`EU AI Act Annex III; Categories: ${R.categories.join(', ')}`,section:'AI Inventory & Classification',severity:'critical',impact:'AI systems in Annex III categories are subject to mandatory conformity assessments, technical documentation requirements, human oversight obligations under Article 14, and logging requirements under Article 12.',rec:'Conduct a formal EU AI Act scoping assessment for each high-risk category identified. Map systems against the full Annex III compliance checklist and prioritise conformity assessment preparation immediately.'});}
  return list;
}

function buildRoadmap(R){
  const dk=['s1','s2','s3','s4','s5','s6','s7'];
  const scored=dk.map(k=>({key:k,risk:(1-((R.pcts[k]||0)/100))*(W[k]||0)})).sort((a,b)=>b.risk-a.risk);
  const make=(keys,name,window,badge)=>({name,window,badge,rationale:`Prioritised by risk contribution score. Focus: ${keys.map(k=>SN[k]+' ('+Math.round(W[k]*100)+'% weight)').join(' and ')}.`,actions:keys.flatMap(k=>{const a=RM[k]||{owner:'Compliance',actions:['Review and document current position']};return a.actions.map(t=>({text:t,owner:a.owner}));}).slice(0,6),deliverables:[...new Set(keys.map(k=>(RM[k]||{del:'Documented Output'}).del))]});
  return{p1:make(scored.slice(0,2).map(d=>d.key),'Phase 1: Defensive Shielding','Days 0–30','Immediate Priority'),p2:make(scored.slice(2,4).map(d=>d.key),'Phase 2: Structural Foundation','Days 31–60','Structural Build'),p3:make(scored.slice(4).map(d=>d.key),'Phase 3: Operational Excellence','Days 61–90+','Ongoing')};
}

function domAssessment(sk,bid){const p=PREMIUM[sk];if(!p)return'';const m={critical:'critical',high:'high',moderate:'moderate',lowmod:'moderate',low:'low'};return(p[m[bid]]||p.high||{}).assessment||'';}

function logo(dark){

  // ═ 06 ROADMAP ═
  o+=`<div class="section">
    ${secBar('06','Remediation Roadmap',org)}
    <div class="sec-title">30 / 60 / 90-Day <em>Action Plan.</em></div>
    <p class="sec-intro">Phases are sequenced by risk contribution score, ensuring resources address areas of greatest regulatory exposure first.</p>
    ${['p1','p2','p3'].map((pk,pi)=>{const ph=roadmap[pk];if(!ph)return'';return`<div class="phase">
      <div class="ph-hd ${['ph1','ph2','ph3'][pi]}"><div><div class="ph-win">${x(ph.window)}</div><div class="ph-name">${x(ph.name)}</div></div><span class="ph-badge">${x(ph.badge)}</span></div>
      <div class="ph-body"><div class="ph-rat">${x(ph.rationale)}</div><ul class="ph-acts">${(ph.actions||[]).map((a,ai)=>`<li><span class="act-n">${ai+1}</span><span class="act-txt">${x(a.text)}</span><span class="act-own">${x(a.owner)}</span></li>`).join('')}</ul></div>
      ${ph.deliverables&&ph.deliverables.length?`<div class="ph-del"><span class="ph-del-lbl">Deliverables</span><span class="ph-del-txt">${ph.deliverables.map(d=>x(d)).join(' &nbsp;·&nbsp; ')}</span></div>`:''}
    </div>`;}).join('')}
  </div>`;

  // ═ 07 DOMAIN DETAIL ═
  o+=`<div class="section">
    ${secBar('07','Domain Assessment Detail',org)}
    <div class="sec-title">Governance Domain <em>Analysis.</em></div>
    <p class="sec-intro">Detailed assessment narrative for each governance domain. The concept name captures the principal risk dynamic identified in this organisation's posture.</p>
    ${dk.map((k,i)=>{
      const p=R.pcts[k]||0;
      const bid=p<30?'critical':p<45?'high':p<65?'moderate':p<80?'lowmod':'low';
      const dc=BC[bid]||'#2563eb';
      const bl=RB.find(b=>b.id===bid)?.label||'';
      const prem=PREMIUM[k];
      return`<div class="domcard">
        <div class="domcard-hd"><span class="dc-num">S${i+1}</span><span class="dc-name">${x(SN[k])}</span><span class="dc-score">${p}%</span></div>
        <div class="domcard-body">
          <div class="dc-band" style="color:${dc}">${x(bl)}</div>
          <div class="dc-concept">&ldquo;${x(prem?.concept||SN[k])}&rdquo;</div>
          <div class="dc-text">${x(domAssessment(k,bid))}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // ═ 08 OUTLOOK ═
  o+=`<div class="section">
    ${secBar('08','Forward Risk Outlook',org)}
    <div class="sec-title">Regulatory Trajectory & <em>Implications.</em></div>
    <p class="sec-intro">An assessment of the forward regulatory landscape and its implications for ${x(org)}'s remediation priorities.</p>
    ${OUTLOOK.map(ol=>`<div class="outlook-item"><div class="outlook-title">${x(ol.t)}</div><div class="outlook-txt">${x(ol.p)}</div></div>`).join('')}
    <div class="notice" style="margin-top:14px"><div class="notice-title">Important Notice</div><div class="notice-txt">This diagnostic provides governance maturity assessment and does not constitute legal advice. MLA Group Ltd is not a law firm. Outputs should not be relied upon as legal opinion or as confirmation of regulatory compliance. Organisations are advised to engage qualified legal and regulatory compliance professionals when implementing governance changes. Framework version ${x(R.fv)}.</div></div>
    <div class="signoff">
      <div><div style="font-size:10pt">${logo(false)}</div><div class="signoff-sub">AI Governance Risk Advisory &nbsp;·&nbsp; mlagroup.co.uk</div></div>
      <div class="signoff-r"><div>Report generated ${date}</div><div>Framework v${x(R.fv)}</div>${rpt.id?`<div style="margin-top:2px">Report ID: ${x(rpt.id)}</div>`:''}</div>
    </div>
  </div>`;

  document.getElementById('report').innerHTML=o;
}

if(typeof REPORT_DATA!=='undefined'){render(REPORT_DATA);}
</script>
</body>
</html>

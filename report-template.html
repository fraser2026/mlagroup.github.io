<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RegAnchor · AI Governance Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   AI Governance Diagnostic — same system as the governance dossier
   Inter only. Sentence case. Status on the word. No Anchor Line.
   ============================================================ */

:root {
  --ink: #0A0E14;
  --text-2: #425466;
  --text-3: #697386;
  --line: #E6EBF1;
  --line-strong: #0A0E14;
  --wash: #F6F9FC;
  --lavender: #F3F1FF;
  --accent: #533AFD;
  --ok: #0F766E;
  --warn: #B45309;
  --risk: #C8102E;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --t-body: 9.5pt;
  --t-small: 8.5pt;
  --t-micro: 8pt;
  --t-num: 22pt;
  --t-cover-title: 52pt;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 10pt;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

/* Page size only. Body margins come from Puppeteer so the locked header/footer has room. */
@page { size: A4; }

body {
  font-family: var(--font);
  font-weight: 400;
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.5;
  background: #fff;
  -webkit-font-smoothing: antialiased;
}

@media screen {
  html, body { background: #ECEFF3; }
  body { min-width: max-content; margin: 0; padding: 1px 16px; }
}

.keep { page-break-inside: avoid; break-inside: avoid; }

.section {
  position: relative;
  display: flex;
  flex-direction: column;
  page-break-before: always;
}
@media screen {
  .section {
    width: 210mm;
    min-height: 297mm;
    margin: 28px auto;
    padding: 18mm 24mm 16mm;
    background: #fff;
    box-shadow: 0 1px 3px rgba(10, 14, 20, 0.06), 0 12px 40px rgba(10, 14, 20, 0.08);
  }
}
@media print {
  .page-hdr, .page-ftr { display: none !important; }
  .section { width: auto; min-height: 0; padding: 0; }
  .section-body { flex: none; }
}
.section-body { flex: 1 1 auto; }

.page-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 22px;
  padding: 0 0 12px;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.page-ftr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: auto 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--line);
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
.page-ftr .brand-wordmark { width: 88px; padding: 0; }

.page-title {
  font-size: 18pt;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin: 0 0 28px;
}
.page-title + .sec-intro { margin-top: -14px; }

.sec-intro {
  font-size: var(--t-body);
  color: var(--text-2);
  line-height: 1.55;
  max-width: 64ch;
  margin: 0 0 22px;
}
.sub-label {
  display: block;
  font-size: 10pt;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
  margin: 28px 0 12px;
}

.exec-lede {
  margin: 0 0 12px;
  font-size: var(--t-body);
  color: var(--ink);
  line-height: 1.55;
}
.exec-lede:last-of-type { margin-bottom: 28px; }

/* ── Cover ── */
.cover {
  position: relative;
  page-break-after: always;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #fff;
  padding: 30mm 24mm 0;
  min-height: 252mm;
}
@media screen {
  .cover {
    width: 210mm;
    min-height: 297mm;
    margin: 28px auto;
    box-shadow: 0 1px 3px rgba(10, 14, 20, 0.06), 0 12px 40px rgba(10, 14, 20, 0.08);
  }
}
@media print {
  .cover {
    margin: 0;
    width: 210mm;
    height: 297mm;
    min-height: 297mm;
    max-height: 297mm;
    padding: 28mm 24mm 0;
  }
  body.report-body-only .cover { display: none !important; }
  body.report-cover-only .section { display: none !important; }
  body.report-body-only .section:first-of-type { page-break-before: auto; }
}
.cover-swoosh-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.cover-swoosh {
  position: absolute;
  left: -8%;
  bottom: 0;
  width: 124%;
  max-width: none;
  height: auto;
  display: block;
  transform: translateY(56%);
}
.cover-content {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 78%;
  padding-bottom: 24%;
  --cover-stack-gap: 28mm;
}
.brand-wordmark { display: block; width: 118px; height: auto; overflow: visible; padding-bottom: 4px; flex-shrink: 0; }
.cover .brand-wordmark { width: 132px; margin-top: 10mm; }
.cover-intro { margin-top: var(--cover-stack-gap); display: flex; flex-direction: column; }
.cov-title {
  font-size: var(--t-cover-title);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.02;
  letter-spacing: -0.045em;
  margin: 0 0 18pt;
}
.cov-tagline {
  font-size: 11.5pt;
  font-weight: 500;
  color: var(--accent);
  line-height: 1.3;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.cov-meta { display: flex; flex-direction: column; gap: 24px; margin: var(--cover-stack-gap) 0 0; max-width: 30em; }
.cov-meta-item { display: flex; flex-direction: column; gap: 4px; }
.cov-meta dt { font-size: 8pt; font-weight: 500; color: var(--text-3); line-height: 1.2; }
.cov-meta dd { font-size: 10.5pt; font-weight: 500; color: var(--ink); line-height: 1.35; font-variant-numeric: tabular-nums; }

/* ── Posture ── */
.posture-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px 36px;
  align-items: center;
  margin: 0 0 28px;
}
.posture-score { display: flex; align-items: center; gap: 20px; }
.score-ring { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
.score-ring svg { display: block; width: 108px; height: 108px; }
.score-ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.score-num { font-size: var(--t-num); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.score-of { font-size: var(--t-micro); color: var(--text-3); margin-top: 3px; }
.score-posture { font-size: 12pt; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
.score-note { font-size: var(--t-small); color: var(--text-2); line-height: 1.5; }
.posture-bands { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.posture-band { display: flex; align-items: center; gap: 10px; font-size: var(--t-small); font-weight: 500; color: var(--ink); line-height: 1.3; }
.posture-band-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); opacity: 0.22; flex-shrink: 0; }
.posture-band.is-active { color: var(--accent); }
.posture-band.is-active .posture-band-dot { background: var(--accent); opacity: 1; box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.18); }

.highlights { margin: 0 0 32px; }
.highlights-label { display: block; font-size: 10pt; font-weight: 500; color: var(--ink); line-height: 1.3; margin: 0 0 20px; }
.highlights-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.highlight {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 18px 12px 16px;
  border-radius: var(--radius);
  background: var(--lavender);
  min-height: 92px;
}
.highlight-val { font-size: 18pt; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -0.02em; }
.highlight-lbl { margin-top: 8px; font-size: var(--t-small); font-weight: 500; color: var(--ink); line-height: 1.3; max-width: 14ch; }

.obs-list { list-style: none; }
.obs-list li { padding: 6px 0 6px 16px; font-size: var(--t-body); color: var(--ink); line-height: 1.5; position: relative; }
.obs-list li::before { content: ''; position: absolute; left: 2px; top: 13px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* ── Contents ── */
.toc { list-style: none; }
.toc li { display: flex; align-items: baseline; padding: 10px 0; font-size: var(--t-body); color: var(--ink); font-weight: 500; }
.toc-label { display: flex; align-items: baseline; gap: 0.55em; flex: 0 1 auto; min-width: 0; }
.toc-num { flex: 0 0 3ch; width: 3ch; font-variant-numeric: tabular-nums; text-align: right; }
.toc-lead { flex: 1 1 auto; border-bottom: 1px dotted var(--text-3); margin: 0 10px 0.3em; min-width: 1.5em; height: 0; opacity: 0.55; }
.toc-page { flex: 0 0 2ch; width: 2ch; font-variant-numeric: tabular-nums; text-align: right; }

/* ── Tables ── */
table.data {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin: 0 0 16px;
  font-size: var(--t-small);
}
table.data th {
  text-align: left;
  font-weight: 500;
  color: var(--ink);
  font-size: var(--t-micro);
  letter-spacing: -0.01em;
  padding: 10px 12px;
  background: var(--lavender);
  vertical-align: middle;
}
table.data th:first-child { border-radius: var(--radius) 0 0 var(--radius); }
table.data th:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
table.data td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  vertical-align: top;
  line-height: 1.4;
  font-weight: 500;
}
table.data .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data .sub { display: block; font-size: var(--t-micro); font-weight: 400; color: var(--text-3); margin-top: 2px; }
table.data td.quiet { color: var(--text-2); font-weight: 400; }

.status { font-weight: 500; font-size: var(--t-small); white-space: nowrap; }
.s-ok { color: var(--ok); }
.s-warn { color: var(--warn); }
.s-risk { color: var(--risk); }
.s-ink { color: var(--ink); }
.s-muted { color: var(--text-3); }
.s-accent { color: var(--accent); }

.meter { display: flex; align-items: center; gap: 10px; min-width: 120px; }
.meter-track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 2px; background: var(--accent); }
.meter-val { flex: 0 0 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }

/* ── Blocks (findings, domains, phases, outlook) ── */
.block { padding: 18px 0; border-bottom: 1px solid var(--line); }
.block:first-of-type { padding-top: 0; }
.block-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.block-code { font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; font-size: var(--t-small); flex-shrink: 0; min-width: 2.4em; }
.block-name { font-weight: 500; color: var(--ink); font-size: 10pt; line-height: 1.35; flex: 1; }
.block-aside { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; font-size: var(--t-small); white-space: nowrap; }
.block-sub { font-size: var(--t-small); font-weight: 500; color: var(--ink); margin: 0 0 6px; }
.block-body { font-size: var(--t-small); color: var(--text-2); line-height: 1.55; max-width: 74ch; }
.block-meta { display: grid; grid-template-columns: 1fr 2fr; gap: 10px 16px; margin: 10px 0 12px; font-size: var(--t-small); }
.block-meta dt { font-size: var(--t-micro); font-weight: 500; color: var(--text-3); margin-bottom: 2px; }
.block-meta dd { color: var(--ink); font-weight: 500; line-height: 1.4; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.wash-box { background: var(--wash); border-radius: var(--radius); padding: 10px 12px; }
.wash-label { display: block; font-size: var(--t-micro); font-weight: 500; color: var(--text-3); margin-bottom: 4px; }
.wash-box p { font-size: var(--t-small); color: var(--ink); line-height: 1.5; font-weight: 400; }

.phase { padding: 0 0 22px; margin: 0 0 22px; border-bottom: 1px solid var(--line); }
.phase:last-child { border-bottom: none; margin-bottom: 0; }
.phase-win { display: block; font-size: var(--t-micro); font-weight: 500; color: var(--text-3); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.phase-name { font-size: 12pt; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 6px; }
.phase .block-body { margin-bottom: 14px; }
.phase table.data { margin-bottom: 12px; }

.notice-lede { font-size: var(--t-body); color: var(--text-2); line-height: 1.55; margin: 0 0 28px; max-width: 68ch; }
.notice-lede strong { color: var(--ink); font-weight: 500; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; margin: 0 0 24px; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--t-micro); font-weight: 500; line-height: 1.45; }
.fact-k { color: var(--text-2); }
.fact-v { color: var(--ink); word-break: break-word; font-variant-numeric: tabular-nums; }

.export-ref { font-size: var(--t-micro); font-weight: 500; color: var(--text-3); line-height: 1.45; }

.empty { padding: 16px 0; color: var(--text-3); font-size: var(--t-body); border-top: 1px solid var(--line); }

@media print {
  thead { display: table-header-group; }
  tr, .block, .fact, .obs-list li, .highlight { page-break-inside: avoid; break-inside: avoid; }
  table.data { page-break-inside: auto; }
  .sub-label, .phase-win, .phase-name { page-break-after: avoid; break-after: avoid; }
  p, li { orphans: 3; widows: 3; }
}
</style>
</head>

// ════ UTILITIES ════
function ps(s) {
  if (s == null) return '';
  return String(s)
    .replace(/\s*[\u2014\u2013]\s*/g, ', ')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/\u2026/g, '...')
    .replace(/\u00A0/g, ' ')
    .trim();
}
function x(s) {
  const d = document.createElement('div');
  d.textContent = ps(s);
  return d.innerHTML;
}
function fmtDate(iso) {
  const d = new Date(iso || Date.now());
  return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}
function bandFor(score, id) {
  if (id) { const b = RB.find((r) => r.id === id); if (b) return b; }
  return RB.find((r) => score >= r.min && score <= r.max) || RB[2];
}
function lowerName(s) {
  return s.startsWith('AI ') ? s : s.charAt(0).toLowerCase() + s.slice(1);
}
function listJoin(items) {
  return items.length < 3 ? items.join(' and ') : `${items.slice(0, -1).join(', ')} and ${items[items.length - 1]}`;
}
function domainBand(p) {
  return p < 30 ? 'critical' : p < 45 ? 'high' : p < 65 ? 'moderate' : p < 80 ? 'lowmod' : 'low';
}
function shortRef(id) {
  const hex = String(id || '').replace(/[^0-9a-f]/gi, '').slice(0, 8).toUpperCase();
  return hex ? `RAR-${hex}` : 'RAR-PREVIEW';
}
function raLevel(score) {
  const levels = [
    { code: 'L1', label: 'Initial', max: 34 }, { code: 'L2', label: 'Aware', max: 54 },
    { code: 'L3', label: 'Defined', max: 69 }, { code: 'L4', label: 'Structured', max: 79 },
    { code: 'L5', label: 'Managed', max: 87 }, { code: 'L6', label: 'Optimised', max: 94 },
    { code: 'L7', label: 'Authoritative', max: 100 },
  ];
  const s = Math.max(0, Math.min(100, Number(score) || 0));
  return levels.find((l) => s <= l.max) || levels[levels.length - 1];
}
function donut(score) {
  const s = Math.max(0, Math.min(100, Number(score) || 0));
  const r = 46;
  const c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 108 108" aria-hidden="true">
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="#E6EBF1" stroke-width="7"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="#533AFD" stroke-width="7" stroke-dasharray="${(s / 100) * c} ${c}" transform="rotate(-90 54 54)"/>
  </svg>`;
}
function meter(p) {
  const v = Math.max(0, Math.min(100, Number(p) || 0));
  return `<div class="meter"><div class="meter-track"><div class="meter-fill" style="width:${v}%"></div></div><span class="meter-val">${v}%</span></div>`;
}

function applyPagination() {
  const root = document.getElementById('report');
  const pagePx = Math.round(297 * (96 / 25.4));
  const blocks = [root.querySelector('.cover'), ...root.querySelectorAll(':scope > .section')].filter(Boolean);
  let page = 1;
  const tocPages = {};
  for (const block of blocks) {
    block.setAttribute('data-page-start', String(page));
    const id = block.getAttribute('data-toc');
    if (id) tocPages[id] = page;
    page += Math.max(1, Math.ceil(Math.max(block.scrollHeight, 1) / pagePx - 0.02));
  }
  const total = page - 1;
  root.querySelectorAll('.toc-page[data-toc]').forEach((el) => {
    const n = tocPages[el.getAttribute('data-toc')];
    if (n != null) el.textContent = String(n);
  });
  root.querySelectorAll('.section .page-ftr').forEach((ftr) => {
    const start = ftr.closest('.section')?.getAttribute('data-page-start');
    if (start) ftr.querySelector('.pf-n').textContent = start;
    ftr.querySelector('.pf-t').textContent = String(total);
  });
}

// ════ MODEL ════
function applyLiveRegs(raw) {
  const live = raw && raw._regs;
  if (!Array.isArray(live) || !live.length) return REGS_DEFAULT.slice();
  const regs = live.map((r) => ({
    reg: ps(r.reg || r.regime), art: ps(r.art || r.article), obl: ps(r.obl || r.obligation),
    type: (r.type || r.requirement_type) === 'A' ? 'A' : 'M', pen: ps(r.pen || r.penalty), dl: ps(r.dl || r.deadline),
  })).filter((r) => r.reg && r.obl);
  return regs.length ? regs : REGS_DEFAULT.slice();
}

function buildFindings(raw) {
  const list = [];
  (raw.priority_flags || []).forEach((f) => {
    const d = FD[f.id] || { section: null, severity: f.severity || 'high', impact: 'This governance area requires attention.', rec: 'Review with your compliance function.' };
    list.push({ label: f.label, basis: f.basis, section: d.section, severity: d.severity, impact: d.impact, rec: d.rec });
  });
  (raw.regime_flags || []).forEach((f) => {
    const basis = ps(f.basis);
    list.push({
      label: f.label, basis: f.basis, section: RF.section, severity: 'regulatory',
      impact: basis ? `${basis} applies independently of the overall maturity score. These are mandatory requirements, not recommendations, and must be addressed regardless of where other gaps are prioritised.` : RF.impact,
      rec: basis ? `Map current AI use against ${basis} with your compliance function or external regulatory counsel, and record the named owner and evidence for each obligation.` : RF.rec,
    });
  });
  const cats = (raw.selected_categories || []).filter((c) => c && c !== 'none');
  if (cats.length) {
    list.push({
      label: 'High-risk AI use detected. EU AI Act Annex III obligations apply from August 2026',
      basis: `EU AI Act Annex III: ${cats.map((c) => CATEGORY_LABEL[c] || c).join(', ')}`,
      section: 's1', severity: 'critical',
      impact: 'AI systems in Annex III categories are subject to mandatory conformity assessment, technical documentation, human oversight under Article 14 and logging under Article 12.',
      rec: 'Run a formal EU AI Act scoping assessment for each high-risk category identified. Map systems against the Annex III checklist and prioritise conformity assessment preparation.',
    });
  }
  const unc = Number(raw.uncertainty_count || 0);
  if (unc >= 3) {
    list.push({
      label: `Limited internal visibility: ${unc} responses were marked as unknown`,
      basis: 'Assessment integrity', section: null, severity: 'moderate',
      impact: `This assessment recorded ${unc} responses where the respondent could not confirm the position. An organisation that does not know whether a control exists cannot rely on that control for compliance purposes.`,
      rec: 'Run an internal governance stocktake to establish the factual position on each uncertain area before any regulatory engagement.',
    });
  }
  const order = { critical: 0, regulatory: 1, high: 2, moderate: 3 };
  return list.sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));
}

function buildRoadmap(pcts) {
  const ranked = DOMAINS.map((k) => ({ k, risk: (1 - (pcts[k] || 0) / 100) * W[k] })).sort((a, b) => b.risk - a.risk).map((d) => d.k);
  const phase = (keys, name, win) => ({
    name, win, keys,
    actions: keys.flatMap((k) => RM[k].actions.slice(0, Math.ceil(6 / keys.length)).map((t) => ({ text: t, owner: RM[k].owner }))),
    deliverables: keys.map((k) => RM[k].del),
  });
  return [
    phase(ranked.slice(0, 2), 'Immediate priorities', 'Days 0 to 30'),
    phase(ranked.slice(2, 4), 'Structural foundation', 'Days 31 to 60'),
    phase(ranked.slice(4), 'Operational maturity', 'Days 61 to 90'),
  ];
}

        const p = pcts[k] || 0;
        const b = RB.find((r) => r.id === domainBand(p));
        return `<tr><td class="num quiet">S${i + 1}</td><td>${x(SN[k])}</td><td class="num">${Math.round(W[k] * 100)}%</td><td>${meter(p)}</td><td>${status(b.label, BAND_TONE[b.id])}</td></tr>`;
      }).join('')}</tbody>
    </table>
    <span class="sub-label">Regulatory basis</span>
    <table class="data">
      <thead><tr><th style="width:38%">Domain</th><th>Primary regulatory basis</th></tr></thead>
      <tbody>${DOMAINS.map((k) => `<tr><td>${x(SN[k])}</td><td class="quiet">${x(BASIS[k])}</td></tr>`).join('')}</tbody>
    </table>
  `);

  /* 3 Priority findings */
  html += section('3', 'Priority findings', `
    <p class="sec-intro">Findings are drawn from assessment responses and ordered by severity. Each sets out the governance gap, its regulatory consequence and the action required.</p>
    ${findings.length ? findings.map((f, i) => {
      const sev = SEVERITY[f.severity] || SEVERITY.high;
      return `<div class="block keep">
        <div class="block-head">
          <span class="block-code">F${String(i + 1).padStart(2, '0')}</span>
          <span class="block-name">${x(f.label)}</span>
          ${status(sev.label, sev.tone)}
        </div>
        <dl class="block-meta">
          <div><dt>Domain</dt><dd>${x(f.section ? SN[f.section] : 'Assessment integrity')}</dd></div>
          <div><dt>Basis</dt><dd>${x(f.basis || 'Not recorded')}</dd></div>
        </dl>
        <div class="pair">
          <div class="wash-box"><span class="wash-label">Impact</span><p>${x(f.impact)}</p></div>
          <div class="wash-box"><span class="wash-label">Recommended action</span><p>${x(f.rec)}</p></div>
        </div>
      </div>`;
    }).join('') : empty('No priority findings were raised by this assessment.')}
  `);

  /* 4 Remediation roadmap */
  html += section('4', 'Remediation roadmap', `
    <p class="sec-intro">Phases are sequenced by each domain's contribution to overall risk, so effort goes first where regulatory exposure is greatest.</p>
    ${roadmap.map((ph, i) => `<div class="phase">
      <div class="keep">
        <span class="phase-win">${x(ph.win)}</span>
        <div class="phase-name">Phase ${i + 1}. ${x(ph.name)}</div>
        <p class="block-body">Focus on ${listJoin(ph.keys.map((k) => `${x(lowerName(SN[k]))} (${Math.round(W[k] * 100)}% weight)`))}.</p>
      </div>
      <table class="data">
        <thead><tr><th style="width:6%"></th><th>Action</th><th style="width:26%">Owner</th></tr></thead>
        <tbody>${ph.actions.map((a, ai) => `<tr><td class="num quiet">${ai + 1}</td><td>${x(a.text)}</td><td class="quiet">${x(a.owner)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="wash-box keep"><span class="wash-label">Deliverables</span><p>${ph.deliverables.map((d) => x(d)).join(' · ')}</p></div>
    </div>`).join('')}
  `);

  /* 5 Domain analysis */
  html += section('5', 'Domain analysis', `
    <p class="sec-intro">The position in each governance domain, with the principal risk dynamic identified for ${x(org)}.</p>
    ${DOMAINS.map((k, i) => {
      const p = pcts[k] || 0;
      const bid = domainBand(p);
      const b = RB.find((r) => r.id === bid);
      const prem = PREMIUM[k];
      const text = prem[bid === 'lowmod' ? 'moderate' : bid] || prem.high;
      return `<div class="block keep">
        <div class="block-head">
          <span class="block-code">S${i + 1}</span>
          <span class="block-name">${x(SN[k])}</span>
          <span class="block-aside">${p}%</span>
          ${status(b.label, BAND_TONE[bid])}
        </div>
        <p class="block-sub">${x(prem.concept)}</p>
        <p class="block-body">${x(text)}</p>
      </div>`;
    }).join('')}
  `);

  /* 6 Regulatory register */
  html += section('6', 'Regulatory register', `
    <p class="sec-intro">Mandatory obligations are legal requirements with defined enforcement consequences. Advisory obligations are regulatory best practice that is increasingly cited in findings.</p>
    <table class="data">
      <thead><tr><th style="width:14%">Regulation</th><th style="width:13%">Article</th><th>Obligation</th><th style="width:11%">Type</th><th style="width:20%">Penalty exposure</th><th style="width:10%">Deadline</th></tr></thead>
      <tbody>${regs.map((r) => `<tr>
        <td>${x(r.reg)}</td>
        <td class="quiet">${x(r.art)}</td>
        <td>${x(r.obl)}</td>
        <td>${status(r.type === 'M' ? 'Mandatory' : 'Advisory', r.type === 'M' ? 's-ink' : 's-muted')}</td>
        <td class="quiet">${x(r.pen)}</td>
        <td class="num">${x(r.dl)}</td>
      </tr>`).join('')}</tbody>
    </table>
  `);

  /* 7 Risk band classification */
  html += section('7', 'Risk band classification', `
    <p class="sec-intro">The diagnostic places each organisation in one of five risk bands. Each band represents a distinct governance position requiring a distinct response.</p>
    <table class="data">
      <thead><tr><th style="width:22%">Band</th><th style="width:12%">Score</th><th>Position</th><th style="width:11%"></th></tr></thead>
      <tbody>${RB.slice().reverse().map((b) => `<tr>
        <td>${status(b.label, BAND_TONE[b.id])}</td>
        <td class="num">${b.min} to ${b.max}</td>
        <td>${x(b.heading.charAt(0).toUpperCase() + b.heading.slice(1))}<span class="sub">${x(b.summary)}</span></td>
        <td>${b.id === band.id ? status('Current', 's-accent') : ''}</td>
      </tr>`).join('')}</tbody>
    </table>
  `);

  /* 8 Regulatory outlook */
  html += section('8', 'Regulatory outlook', `
    <p class="sec-intro">The regulatory direction of travel and what it means for ${x(org)}'s remediation priorities.</p>
    ${OUTLOOK.map((o) => `<div class="block keep">
      <div class="block-head"><span class="block-name">${x(o.t)}</span></div>
      <p class="block-body">${x(o.p)}</p>
    </div>`).join('')}
  `);

  /* 9 Basis of assessment */
  const facts = [
    ['Organisation', org],
    ['Report ID', ref],
    ['Sector', raw.sector ? ps(raw.sector).charAt(0) + ps(raw.sector).slice(1).toLowerCase() : ''],
    ['Organisation size', raw.org_size],
    ['Assessment date', assessed],
    ['Report generated', generated],
    ['Framework version', fv],
    ['Snapshot', rpt.snapshot_hash],
  ];
  html += section('9', 'Basis of assessment', `
    <p class="notice-lede">This diagnostic is a governance maturity assessment of <strong>${x(org)}</strong> based on responses provided on <strong>${x(assessed)}</strong>. It does not constitute legal advice and is not a confirmation of regulatory compliance. MLA Group Ltd is not a law firm. Engage qualified legal and regulatory professionals when implementing governance changes.</p>
    <div class="facts keep">${facts.map(([k, v]) => `<div class="fact"><span class="fact-k">${x(k)}</span><span class="fact-v">${x(v || 'Not recorded')}</span></div>`).join('')}</div>
    ${rpt.id ? `<p class="export-ref">Full report reference ${x(rpt.id)}. The snapshot identifies the exact assessment data used to produce this report.</p>` : ''}
  `);

  const root = document.getElementById('report');
  root.innerHTML = html;
  document.title = `RegAnchor · AI Governance Diagnostic · ${org}`;
  const finish = () => applyPagination();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(finish).catch(finish);
  else requestAnimationFrame(finish);
}
